<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;background:var(--bg);padding:20px;box-sizing:border-box;font-family:var(--font-body);color:var(--tx)"><div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px">

 <div style="padding:12px 14px;border-radius:16px;background:var(--yellow-tint);color:var(--yellow-ink);display:flex;flex-direction:column;gap:6px;min-width:0"><span style="display:flex;align-items:center;gap:6px;font:800 13px/1 var(--font-body)"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z"/><path d="M12 3a9 9 0 0 1 0 18Z" fill="currentColor" stroke="none"/></svg>Nearly there</span><span style="font:600 12px/1.35 var(--font-body)">Mostly right</span></div>
 <div style="padding:12px 14px;border-radius:16px;background:var(--coral-tint);color:var(--coral-ink);display:flex;flex-direction:column;gap:6px;min-width:0"><span style="display:flex;align-items:center;gap:6px;font:800 13px/1 var(--font-body)"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V4.5M6 4.5h11l-2.4 4.25L17 13H6"/></svg>Needs work</span><span style="font:600 12px/1.35 var(--font-body)">Look at this. Never error red</span></div>
 <div style="padding:12px 14px;border-radius:16px;background:var(--neutral-tint);color:var(--neutral-ink);display:flex;flex-direction:column;gap:6px;min-width:0"><span style="display:flex;align-items:center;gap:6px;font:800 13px/1 var(--font-body)"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z"/><path d="M8.2 12h.01M12 12h.01M15.8 12h.01"/></svg>Just started</span><span style="font:600 12px/1.35 var(--font-body)">Too few answers to tell</span></div>
 <div style="padding:12px 14px;border-radius:16px;background:var(--neutral-tint);color:var(--neutral-ink);display:flex;flex-direction:column;gap:6px;min-width:0"><span style="display:flex;align-items:center;gap:6px;font:800 13px/1 var(--font-body)"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z" stroke-dasharray="2.6 3.1"/></svg>Not started</span><span style="font:600 12px/1.35 var(--font-body)">No answers yet</span></div></div></body></html>
