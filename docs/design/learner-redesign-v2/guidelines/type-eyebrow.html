<!-- @dsCard group="Type" viewport="700x110" subtitle="The only uppercase style. Above titles and in REV cards." name="Eyebrow" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;background:var(--bg);padding:20px;box-sizing:border-box;font-family:var(--font-body);color:var(--tx)">
<div style="display:flex;gap:28px;align-items:center;flex-wrap:wrap">
 <span style="font:var(--type-eyebrow);letter-spacing:.14em;text-transform:uppercase;color:var(--teal-ink)">Key idea</span>
 <span style="font:var(--type-eyebrow);letter-spacing:.12em;text-transform:uppercase;color:var(--violet-ink)">Next exam</span>
 <span style="font:var(--type-eyebrow);letter-spacing:.12em;text-transform:uppercase;color:var(--tx2)">Question 5 of 10</span>
 <span style="padding:10px 14px;border-radius:12px;background:var(--deep);font:var(--type-eyebrow);letter-spacing:.12em;text-transform:uppercase;color:var(--rev-label)">REV suggests · 45 min</span></div>
 <div style="margin-top:14px;font:600 12px var(--font-body);color:var(--tx2)">Manrope 800 · 12px · +0.12–0.14em · ink colour of its context</div>
</body></html>
