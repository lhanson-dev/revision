<!-- @dsCard group="Colors" viewport="700x150" subtitle="Deep teal is reserved for REV. Nothing else may use it." name="REV surface" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;background:var(--bg);padding:20px;box-sizing:border-box;font-family:var(--font-body);color:var(--tx)">
<div style="display:grid;grid-template-columns:minmax(0,1.3fr) repeat(4,minmax(0,1fr));gap:12px">
 <div style="padding:16px;border-radius:20px;background:var(--deep);color:var(--rev-text);display:flex;flex-direction:column;gap:8px"><span style="font:800 12px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--rev-label)">REV noticed</span><span style="font:700 14px/1.4 var(--font-body)">Sample REV text</span><span style="font:600 13px var(--font-body);color:var(--rev-muted)">Muted reason line</span></div>
 <div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:64px;border-radius:14px;background:var(--deep);display:flex;align-items:flex-end;padding:8px 10px;box-sizing:border-box;font:800 12px var(--font-body);color:var(--tx)"></div><div style="font:800 13px var(--font-body)">--deep</div><div style="font:600 12px var(--font-body);color:var(--tx2)">#0f2f36</div></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:64px;border-radius:14px;background:var(--rev-label);display:flex;align-items:flex-end;padding:8px 10px;box-sizing:border-box;font:800 12px var(--font-body);color:var(--tx)"></div><div style="font:800 13px var(--font-body)">--rev-label</div><div style="font:600 12px var(--font-body);color:var(--tx2)">#7fe3d3</div></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:64px;border-radius:14px;background:var(--rev-text);border:1px solid var(--line);display:flex;align-items:flex-end;padding:8px 10px;box-sizing:border-box;font:800 12px var(--font-body);color:"></div><div style="font:800 13px var(--font-body)">--rev-text</div><div style="font:600 12px var(--font-body);color:var(--tx2)">#e8f3f0</div></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:64px;border-radius:14px;background:var(--rev-muted);display:flex;align-items:flex-end;padding:8px 10px;box-sizing:border-box;font:800 12px var(--font-body);color:var(--tx)"></div><div style="font:800 13px var(--font-body)">--rev-muted</div><div style="font:600 12px var(--font-body);color:var(--tx2)">#b7cfcc</div></div></div>
</body></html>
