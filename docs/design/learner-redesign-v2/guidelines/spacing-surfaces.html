<!-- @dsCard group="Spacing" viewport="700x150" subtitle="Cards are flat: 1px border, no shadow. Focus = 2px teal + 5px tint ring." name="Surfaces & focus" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;background:var(--bg);padding:20px;box-sizing:border-box;font-family:var(--font-body);color:var(--tx)">
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px"><div style="padding:20px;border-radius:24px;background:var(--sf);border:1px solid var(--line);font:800 15px var(--font-body)">Card<div style="font:600 12px var(--font-body);color:var(--tx2);margin-top:6px">--sf · 1px --line · r24</div></div>
 <div style="padding:20px;border-radius:24px;background:var(--violet-tint);font:800 15px var(--font-body)">Tint panel<div style="font:600 12px var(--font-body);color:var(--violet-ink);margin-top:6px">No border · ink text</div></div>
 <div style="padding:20px;border-radius:18px;background:var(--sf);border:2px solid var(--teal);box-shadow:var(--focus-ring);font:800 15px var(--font-body)">Focused<div style="font:600 12px var(--font-body);color:var(--tx2);margin-top:6px">every interactive element</div></div></div>
</body></html>
