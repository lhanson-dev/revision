<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;background:var(--bg);padding:20px;box-sizing:border-box;font-family:var(--font-body);color:var(--tx)">
<div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px">
<div style="padding:14px;border-radius:20px;background:var(--sf);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px;min-width:0">
<div style="height:70px;border-radius:10px;background:var(--bg);border:1px solid var(--line);display:flex;align-items:flex-end;justify-content:center;padding:6px;box-sizing:border-box"><div style="width:96%;height:100%;border-radius:6px;background:var(--teal-tint);display:flex;gap:4px;padding:4px;box-sizing:border-box"><i style="width:22%;background:var(--teal);border-radius:3px"></i><i style="flex:1;background:var(--sf);border-radius:3px"></i></div></div>
<div style="font:800 15px var(--font-body)">Desktop <span style="color:var(--tx2);font-weight:700">> 1160</span></div>
<div style="font:600 12px/1.45 var(--font-body);color:var(--tx2)">Sidebar 248<br>40px gutters<br>2 cols</div></div><div style="padding:14px;border-radius:20px;background:var(--sf);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px;min-width:0">
<div style="height:70px;border-radius:10px;background:var(--bg);border:1px solid var(--line);display:flex;align-items:flex-end;justify-content:center;padding:6px;box-sizing:border-box"><div style="width:80%;height:100%;border-radius:6px;background:var(--teal-tint);display:flex;gap:4px;padding:4px;box-sizing:border-box"><i style="width:22%;background:var(--teal);border-radius:3px"></i><i style="flex:1;background:var(--sf);border-radius:3px"></i></div></div>
<div style="font:800 15px var(--font-body)">Laptop <span style="color:var(--tx2);font-weight:700">961–1160</span></div>
<div style="font:600 12px/1.45 var(--font-body);color:var(--tx2)">Sidebar 248<br>28px · stack ≤1100<br>2→1 col</div></div><div style="padding:14px;border-radius:20px;background:var(--sf);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px;min-width:0">
<div style="height:70px;border-radius:10px;background:var(--bg);border:1px solid var(--line);display:flex;align-items:flex-end;justify-content:center;padding:6px;box-sizing:border-box"><div style="width:62%;height:100%;border-radius:6px;background:var(--teal-tint);display:flex;gap:4px;padding:4px;box-sizing:border-box"><i style="width:8%;background:var(--teal);border-radius:3px"></i><i style="flex:1;background:var(--sf);border-radius:3px"></i></div></div>
<div style="font:800 15px var(--font-body)">Tablet <span style="color:var(--tx2);font-weight:700">621–960</span></div>
<div style="font:600 12px/1.45 var(--font-body);color:var(--tx2)">Icon rail 84<br>24px gutters<br>1 col</div></div><div style="padding:14px;border-radius:20px;background:var(--sf);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px;min-width:0">
<div style="height:70px;border-radius:10px;background:var(--bg);border:1px solid var(--line);display:flex;align-items:flex-end;justify-content:center;padding:6px;box-sizing:border-box"><div style="width:40%;height:100%;border-radius:6px;background:var(--teal-tint);display:flex;gap:4px;padding:4px;box-sizing:border-box"><i style="flex:1;background:var(--sf);border-radius:3px"></i></div></div>
<div style="font:800 15px var(--font-body)">Phone <span style="color:var(--tx2);font-weight:700">≤ 620</span></div>
<div style="font:600 12px/1.45 var(--font-body);color:var(--tx2)">Bottom tab bar<br>20px gutters<br>1 col</div></div>
</div>
<div style="margin-top:12px;display:flex;gap:16px;flex-wrap:wrap;font:700 12px var(--font-body);color:var(--tx2)"><span><b style="color:var(--tx)">1100px</b> canvas max</span><span><b style="color:var(--tx)">820px</b> question column</span><span><b style="color:var(--tx)">760px</b> reading measure</span><span><b style="color:var(--tx)">320px</b> minimum</span><span style="color:var(--coral-ink)">No page-level horizontal scroll</span></div>
</body></html>
