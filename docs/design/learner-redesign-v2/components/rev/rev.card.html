<!-- @dsCard group="Components" viewport="700x560" name="REV" subtitle="Living E states (try typing), RevCard hero + compact" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="../../components/_preview.js"></script></head>
<body style="margin:0;background:var(--bg);padding:20px;box-sizing:border-box"><div id="root"></div>
<script type="text/babel">
mountDS(['../core/Icon.jsx','../core/Button.jsx','../rev/RevMark.jsx','../rev/RevCard.jsx'], ({Button,RevMark,RevCard,StepRow}) => {
  function Demo(){
    const [st,setSt] = React.useState('waiting'); const [v,setV] = React.useState('');
    const timer = React.useRef();
    const type = e => { setV(e.target.value); setSt('listening'); clearTimeout(timer.current); timer.current = setTimeout(() => setSt(s => s === 'listening' ? 'waiting' : s), 1400); };
    const send = () => { if(!v) return; setV(''); setSt('thinking'); setTimeout(() => setSt('responding'), 2200); };
    const S = ({s,label}) => <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:8,padding:14,borderRadius:18,background:'var(--deep)',color:'var(--rev-text)'}}><RevMark size={56} state={s}/><span style={{font:'800 12px/1 var(--font-body)',letterSpacing:'.1em',textTransform:'uppercase',color:'var(--rev-label)'}}>{label}</span></div>;
    return <div style={{display:'flex',flexDirection:'column',gap:16}}>
      <div style={{display:'grid',gridTemplateColumns:'repeat(5,minmax(0,1fr))',gap:10}}>
        <S s="waiting" label="Waiting"/><S s="listening" label="Listening"/><S s="thinking" label="Thinking"/><S s="responding" label="Responding"/>
        <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:8,padding:14,borderRadius:18,background:'var(--sf)',boxShadow:'inset 0 0 0 1px var(--line)',color:'var(--tx)'}}><RevMark size={40} state="thinking" reducedMotion/><span style={{font:'700 11px/1.2 var(--font-body)',color:'var(--tx2)',textAlign:'center'}}>Reduced motion</span></div>
      </div>
      <div style={{display:'flex',alignItems:'center',gap:12,padding:'8px 8px 8px 14px',borderRadius:999,background:'var(--sf)',boxShadow:'inset 0 0 0 1px var(--line)'}}>
        <RevMark size={34} state={st} onSettled={() => setSt('waiting')}/>
        <input value={v} onChange={type} onKeyDown={e => e.key === 'Enter' && send()} placeholder="Type to see REV listen, press Enter to see it think" style={{flex:1,minWidth:0,border:0,outline:'none',background:'transparent',font:'600 15px var(--font-body)',color:'var(--tx)'}}/>
        <Button size="sm" icon="arrowUp" onClick={send}>Ask</Button>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1.4fr 1fr',gap:16}}>
        <RevCard hero eyebrow="REV suggests · 45 min" title="Nail break-even before Friday's quiz" reason="Why: break-even is marked Needs work, and it's on Friday's quiz." actions={<Button size="sm" iconRight="arrowRight">Start practice</Button>}>
          <div style={{display:'flex',flexDirection:'column',gap:8}}><StepRow label="Learn · Contribution" status="done"/><StepRow label="Practice · 10 questions" meta="15 min" status="current"/><StepRow label="Exam Prep · 6-marker" meta="20 min"/></div>
        </RevCard>
        <RevCard eyebrow="REV suggests" actions={<><Button size="sm">Move it</Button><Button size="sm" variant="rev">Keep as is</Button></>}>Thursday looks light. Want me to move Saturday's Maths there so your weekend's freer?</RevCard>
      </div>
    </div>;
  }
  return <Demo/>;
});
</script></body></html>
