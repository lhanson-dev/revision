<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0F2F36" flood-opacity="0.08"/></filter>
    <style>
      .title{font:700 42px Manrope,Arial,sans-serif;fill:#132026}.sub{font:500 18px Manrope,Arial,sans-serif;fill:#607074}.h{font:700 22px Manrope,Arial,sans-serif;fill:#132026}.k{font:700 14px Manrope,Arial,sans-serif;fill:#0F2F36}.b{font:500 15px Manrope,Arial,sans-serif;fill:#5B686C}.small{font:600 12px Manrope,Arial,sans-serif;fill:#607074}.white{fill:#fff}.teal{fill:#2BB6A3}.ink{fill:#0F2F36}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#FAFCFB"/>
  <text x="56" y="66" class="title">Brand Studio v0.5 — cross-channel expression</text>
  <text x="56" y="98" class="sub">Same Revision grammar, different jobs. Manrope + Calm Teal + Living E stay recognisable.</text>

  <!-- Marketing -->
  <g transform="translate(56 142)" filter="url(#shadow)">
    <rect width="720" height="300" rx="28" fill="#FFFFFF" stroke="#E6ECEB"/>
    <text x="30" y="42" class="h">Marketing / editorial</text>
    <text x="30" y="68" class="b">More expressive, story-led and spacious — not a brochure copy of the app.</text>
    <rect x="30" y="92" width="290" height="170" rx="26" fill="#0F2F36"/>
    <circle cx="272" cy="130" r="34" fill="#E6FBF4" opacity="0.4"/>
    <line x1="255" y1="121" x2="289" y2="121" stroke="#2BB6A3" stroke-width="6" stroke-linecap="round"/>
    <line x1="255" y1="131" x2="289" y2="131" stroke="#2BB6A3" stroke-width="6" stroke-linecap="round"/>
    <line x1="255" y1="141" x2="289" y2="141" stroke="#2BB6A3" stroke-width="6" stroke-linecap="round"/>
    <text x="50" y="136" class="white" style="font:700 27px Manrope,Arial">Revision that knows</text>
    <text x="50" y="168" class="white" style="font:700 27px Manrope,Arial">what matters next.</text>
    <rect x="50" y="200" width="122" height="40" rx="14" fill="#2BB6A3"/>
    <text x="72" y="225" style="font:700 13px Manrope,Arial;fill:#132026">Start revising</text>

    <rect x="344" y="92" width="158" height="76" rx="20" fill="#F1FAF8" stroke="#E6ECEB"/>
    <text x="360" y="120" class="k">Feature story</text><text x="360" y="144" class="small">image + benefit</text>
    <rect x="520" y="92" width="158" height="76" rx="20" fill="#FFFFFF" stroke="#E6ECEB"/>
    <text x="536" y="120" class="k">Proof</text><text x="536" y="144" class="small">real product / evidence</text>
    <rect x="344" y="186" width="158" height="76" rx="20" fill="#E6FBF4"/>
    <text x="360" y="214" class="k">Pricing</text><text x="360" y="238" class="small">clear value hierarchy</text>
    <rect x="520" y="186" width="158" height="76" rx="26" fill="#0F2F36"/>
    <text x="536" y="214" style="font:700 14px Manrope,Arial;fill:#fff">Closing CTA</text><text x="536" y="238" style="font:600 12px Manrope,Arial;fill:#A8BCC0">one primary action</text>
  </g>

  <!-- Admin -->
  <g transform="translate(824 142)" filter="url(#shadow)">
    <rect width="720" height="300" rx="28" fill="#FFFFFF" stroke="#E6ECEB"/>
    <text x="30" y="42" class="h">Admin / operations</text>
    <text x="30" y="68" class="b">Same controls and semantics, quieter expression and higher useful density.</text>
    <rect x="30" y="92" width="660" height="170" rx="20" fill="#F6F8F7" stroke="#E6ECEB"/>
    <rect x="48" y="108" width="152" height="138" rx="12" fill="#0F2024"/>
    <text x="66" y="136" style="font:700 14px Manrope,Arial;fill:#E6F2EF">Operations</text>
    <text x="66" y="166" style="font:600 12px Manrope,Arial;fill:#A8BCC0">Overview</text>
    <text x="66" y="192" style="font:600 12px Manrope,Arial;fill:#A8BCC0">Assurance</text>
    <text x="66" y="218" style="font:600 12px Manrope,Arial;fill:#2BB6A3">Content</text>
    <rect x="218" y="108" width="454" height="40" rx="12" fill="#FFFFFF" stroke="#E6ECEB"/>
    <text x="234" y="133" class="small">Search / filters</text>
    <rect x="218" y="160" width="454" height="86" rx="12" fill="#FFFFFF" stroke="#E6ECEB"/>
    <line x1="218" y1="190" x2="672" y2="190" stroke="#E6ECEB"/>
    <line x1="218" y1="218" x2="672" y2="218" stroke="#E6ECEB"/>
    <text x="234" y="181" class="small">TABLES ARE FIRST-CLASS — NOT CARD GRIDS</text>
    <circle cx="646" cy="204" r="6" fill="#3BAA7A"/><text x="558" y="208" class="small">Healthy</text>
    <circle cx="646" cy="232" r="6" fill="#DDAA3A"/><text x="548" y="236" class="small">Needs review</text>
  </g>

  <!-- Social -->
  <g transform="translate(56 486)" filter="url(#shadow)">
    <rect width="720" height="330" rx="28" fill="#FFFFFF" stroke="#E6ECEB"/>
    <text x="30" y="42" class="h">Social</text>
    <text x="30" y="68" class="b">Stronger crop + larger type. Recognition comes from the system, not a new campaign identity.</text>
    <g transform="translate(30 94)">
      <rect width="150" height="188" rx="20" fill="#0F2F36"/>
      <text x="18" y="36" style="font:700 18px Manrope,Arial;fill:#fff">Start with</text><text x="18" y="60" style="font:700 18px Manrope,Arial;fill:#fff">one thing.</text>
      <rect x="18" y="136" width="68" height="8" rx="4" fill="#2BB6A3"/><rect x="18" y="151" width="50" height="8" rx="4" fill="#2BB6A3"/><rect x="18" y="166" width="60" height="8" rx="4" fill="#2BB6A3"/>
    </g>
    <g transform="translate(198 94)"><rect width="150" height="188" rx="20" fill="#E6FBF4"/><text x="18" y="36" class="k">Study tip</text><text x="18" y="66" class="b">Small, useful,</text><text x="18" y="88" class="b">worth saving.</text><circle cx="75" cy="139" r="24" fill="#FFFFFF"/><path d="M64 139h22M75 128v22" stroke="#168C7C" stroke-width="3" stroke-linecap="round"/></g>
    <g transform="translate(366 94)"><rect width="150" height="188" rx="20" fill="#FFFFFF" stroke="#E6ECEB"/><text x="18" y="36" class="k">Product</text><rect x="18" y="54" width="114" height="102" rx="16" fill="#F1FAF8" stroke="#E6ECEB"/><rect x="34" y="72" width="82" height="14" rx="7" fill="#E6FBF4"/><rect x="34" y="98" width="62" height="12" rx="6" fill="#2BB6A3"/><rect x="34" y="120" width="76" height="12" rx="6" fill="#C7D9EE"/></g>
    <g transform="translate(534 94)"><rect width="150" height="188" rx="20" fill="#F2E9D9"/><text x="18" y="36" class="k">Proof</text><text x="18" y="88" style="font:700 38px Manrope,Arial;fill:#0F2F36">72%</text><text x="18" y="114" class="small">with source/context</text><text x="18" y="148" class="small">Never overstate for</text><text x="18" y="166" class="small">visual impact.</text></g>
    <text x="30" y="310" class="small">Canonical canvases: 1080×1080 · 1080×1350 · 1080×1920 · 1920×1080</text>
  </g>

  <!-- Video -->
  <g transform="translate(824 486)" filter="url(#shadow)">
    <rect width="720" height="330" rx="28" fill="#FFFFFF" stroke="#E6ECEB"/>
    <text x="30" y="42" class="h">Video / motion graphics</text>
    <text x="30" y="68" class="b">Short brand moments, readable captions and calm transitions. Motion must earn its place.</text>
    <rect x="30" y="94" width="276" height="156" rx="20" fill="#0F2024"/>
    <circle cx="168" cy="142" r="38" fill="#2BB6A3" opacity="0.12"/><line x1="150" y1="130" x2="186" y2="130" stroke="#2BB6A3" stroke-width="6" stroke-linecap="round"/><line x1="150" y1="142" x2="186" y2="142" stroke="#2BB6A3" stroke-width="6" stroke-linecap="round"/><line x1="150" y1="154" x2="186" y2="154" stroke="#2BB6A3" stroke-width="6" stroke-linecap="round"/>
    <text x="58" y="216" style="font:700 18px Manrope,Arial;fill:#fff">Exam technique: 3 steps</text>
    <rect x="46" y="224" width="244" height="18" rx="7" fill="#13272B"/><text x="58" y="237" style="font:600 10px Manrope,Arial;fill:#E6F2EF">Captions stay readable on mobile crops</text>
    <rect x="330" y="94" width="158" height="70" rx="16" fill="#F1FAF8"/><text x="346" y="122" class="k">Opening</text><text x="346" y="146" class="small">0.8–1.5s</text>
    <rect x="506" y="94" width="158" height="70" rx="16" fill="#F1FAF8"/><text x="522" y="122" class="k">Lower third</text><text x="522" y="146" class="small">clear + restrained</text>
    <rect x="330" y="180" width="158" height="70" rx="16" fill="#E6FBF4"/><text x="346" y="208" class="k">Transitions</text><text x="346" y="232" class="small">cuts / fades / lines</text>
    <rect x="506" y="180" width="158" height="70" rx="16" fill="#0F2F36"/><text x="522" y="208" style="font:700 14px Manrope,Arial;fill:#fff">End card</text><text x="522" y="232" style="font:600 12px Manrope,Arial;fill:#A8BCC0">one CTA · 2–3s</text>
    <text x="30" y="298" class="small">Avoid: glitch · scanlines · bounce-heavy motion · neon particle theatre</text>
  </g>
</svg>