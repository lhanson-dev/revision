<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect width="1600" height="1000" fill="#FAFCFB"/><style>text{font-family:Manrope,Arial,sans-serif;fill:#132026}.h{font-size:38px;font-weight:700}.s{font-size:18px;font-weight:700}.b{font-size:15px}.m{font-size:13px;fill:#5B686C}.card{fill:#fff;stroke:#E6ECEB;stroke-width:1.5}</style><text x="50" y="60" class="h">Brand Studio v0.4 — subjects &amp; data visualisation</text><text x="50" y="92" class="b">Recognition without subject themes · evidence-first charts · colour never carries meaning alone</text><text x="50" y="145" class="s">Subject recognition system</text>
<g transform="translate(50,175)"><rect class="card" width="900" height="285" rx="20"/><text x="24" y="38" class="s">Neutral surface + small accent slot</text><g transform="translate(28,68)"><rect width="250" height="84" rx="18" fill="#fff" stroke="#E6ECEB"/><rect x="16" y="16" width="48" height="48" rx="13" fill="#E6FBF4"/><path d="M29 48h22M29 40h22M29 32h22" stroke="#132026" stroke-width="2" stroke-linecap="round"/><text x="78" y="37" class="b" font-weight="700">Business</text><text x="78" y="59" class="m">AQA AS</text></g><g transform="translate(300,68)"><rect width="250" height="84" rx="18" fill="#fff" stroke="#E6ECEB"/><rect x="16" y="16" width="48" height="48" rx="13" fill="#C7D9EE"/><circle cx="40" cy="40" r="15" fill="none" stroke="#132026" stroke-width="2"/><path d="M40 25v30M25 40h30" stroke="#132026" stroke-width="2"/><text x="78" y="37" class="b" font-weight="700">Maths</text><text x="78" y="59" class="m">GCSE</text></g><g transform="translate(572,68)"><rect width="250" height="84" rx="18" fill="#fff" stroke="#E6ECEB"/><rect x="16" y="16" width="48" height="48" rx="13" fill="#F2E9D9"/><path d="M28 28c24 0 24 24 24 24M52 28c-24 0-24 24-24 24" fill="none" stroke="#132026" stroke-width="2"/><text x="78" y="37" class="b" font-weight="700">Biology</text><text x="78" y="59" class="m">A Level</text></g><text x="28" y="196" class="b">Approved accent sources</text><g transform="translate(28,214)"><rect width="110" height="34" rx="17" fill="#E6FBF4"/><text x="20" y="22" class="m">Soft Aqua</text><rect x="124" width="90" height="34" rx="17" fill="#BCE8CF"/><text x="144" y="22" class="m">Sage</text><rect x="228" width="110" height="34" rx="17" fill="#C7D9EE"/><text x="247" y="22" class="m">Stone Blue</text><rect x="352" width="112" height="34" rx="17" fill="#F2E9D9"/><text x="370" y="22" class="m">Warm Sand</text><rect x="478" width="90" height="34" rx="17" fill="#E9EEF2"/><text x="500" y="22" class="m">Mist</text></g></g>
<g transform="translate(980,175)"><rect class="card" width="550" height="285" rx="20"/><text x="24" y="38" class="s">Rules</text><text x="24" y="76" class="b">• Name + icon + optional accent</text><text x="24" y="108" class="b">• Accent lives in tile, chip or small marker</text><text x="24" y="140" class="b">• No full-page subject themes</text><text x="24" y="172" class="b">• Never use success / warning / error as subject colours</text><text x="24" y="204" class="b">• Colour does not imply attainment</text><text x="24" y="246" class="m">No fixed subject-to-colour mapping yet; only add one if testing proves it improves recognition.</text></g>
<text x="50" y="520" class="s">Data visualisation</text><g transform="translate(50,550)"><rect class="card" width="1480" height="390" rx="20"/><text x="24" y="38" class="s">Candidate ordered chart palette</text><g transform="translate(24,58)"><g><rect width="190" height="56" rx="14" fill="#168C7C"/><text x="16" y="34" fill="#fff" font-size="14" font-weight="700">Data Teal #168C7C</text></g><g transform="translate(205,0)"><rect width="190" height="56" rx="14" fill="#5F7FA3"/><text x="16" y="34" fill="#fff" font-size="14" font-weight="700">Data Blue #5F7FA3</text></g><g transform="translate(410,0)"><rect width="190" height="56" rx="14" fill="#5F8F73"/><text x="16" y="34" fill="#fff" font-size="14" font-weight="700">Data Sage #5F8F73</text></g><g transform="translate(615,0)"><rect width="190" height="56" rx="14" fill="#A5824A"/><text x="16" y="34" fill="#fff" font-size="14" font-weight="700">Data Sand #A5824A</text></g><g transform="translate(820,0)"><rect width="190" height="56" rx="14" fill="#607074"/><text x="16" y="34" fill="#fff" font-size="14" font-weight="700">Data Slate #607074</text></g></g>
<g transform="translate(24,145)"><text x="0" y="0" class="b" font-weight="700">Progress bar — bounded completion</text><rect x="0" y="20" width="340" height="16" rx="8" fill="#E6ECEB"/><rect x="0" y="20" width="220" height="16" rx="8" fill="#168C7C"/><text x="0" y="64" class="m">Specification coverage 65% · label the measure explicitly</text></g>
<g transform="translate(410,145)"><text x="0" y="0" class="b" font-weight="700">Line — change over time</text><path d="M0 84L70 55L140 70L210 25L280 45" fill="none" stroke="#168C7C" stroke-width="4"/><g fill="#168C7C"><circle cx="0" cy="84" r="5"/><circle cx="70" cy="55" r="5"/><circle cx="140" cy="70" r="5"/><circle cx="210" cy="25" r="5"/><circle cx="280" cy="45" r="5"/></g><text x="0" y="112" class="m">Trends may move down when evidence changes</text></g>
<g transform="translate(770,145)"><text x="0" y="0" class="b" font-weight="700">Bars — comparison</text><rect x="10" y="46" width="38" height="52" rx="6" fill="#168C7C"/><rect x="66" y="25" width="38" height="73" rx="6" fill="#5F7FA3"/><rect x="122" y="61" width="38" height="37" rx="6" fill="#5F8F73"/><rect x="178" y="38" width="38" height="60" rx="6" fill="#A5824A"/><text x="0" y="122" class="m">Use direct labels where possible</text></g>
<g transform="translate(1060,145)"><text x="0" y="0" class="b" font-weight="700">Evidence distinction</text><rect x="0" y="20" width="330" height="42" rx="12" fill="#F1FAF8"/><text x="14" y="46" class="b">Coverage ≠ Understanding ≠ Readiness</text><text x="0" y="90" class="m">Do not collapse distinct evidence into one decorative score.</text><text x="0" y="115" class="m">“On track” must say on track for what.</text></g>
<line x1="24" y1="295" x2="1456" y2="295" stroke="#E6ECEB"/><text x="24" y="330" class="b" font-weight="700">Chart selection:</text><text x="142" y="330" class="b">progress bar = bounded completion · line = time · bar = comparison · stacked = composition · donut = small category set only</text><text x="24" y="362" class="m">With 3+ series, add labels, markers, dash patterns or shapes so colour is never the only differentiator.</text></g></svg>