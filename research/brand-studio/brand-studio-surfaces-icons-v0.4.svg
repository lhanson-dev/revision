<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect width="1600" height="1000" fill="#FAFCFB"/><style>text{font-family:Manrope,Arial,sans-serif;fill:#132026}.h{font-size:38px;font-weight:700}.s{font-size:18px;font-weight:700}.b{font-size:15px}.m{font-size:13px;fill:#5B686C}.card{fill:#fff;stroke:#E6ECEB;stroke-width:1.5}.quiet{fill:#F1FAF8;stroke:#E6ECEB}.feature{fill:#0F2F36}.ft{fill:#E6F2EF}.teal{fill:#2BB6A3}.soft{fill:#E6FBF4}.sage{fill:#BCE8CF}.blue{fill:#C7D9EE}.sand{fill:#F2E9D9}</style><text x="50" y="60" class="h">Brand Studio v0.4 — surfaces &amp; graphic language</text><text x="50" y="92" class="b">Calm Teal foundations · flexible surface families · restrained icon and motif system</text><text x="50" y="145" class="s">Surface families</text>
<g transform="translate(50,175)"><rect class="card" rx="20" width="280" height="155"/><text x="22" y="34" class="s">Standard</text><text x="22" y="65" class="b">Ordinary content grouping</text><text x="22" y="92" class="m">20px · Flat · 20–24px padding</text><rect x="22" y="112" width="96" height="10" rx="5" fill="#E6ECEB"/><rect x="128" y="112" width="64" height="10" rx="5" fill="#F1FAF8"/></g>
<g transform="translate(350,175)"><rect class="quiet" rx="20" width="280" height="155"/><text x="22" y="34" class="s">Quiet</text><text x="22" y="65" class="b">Secondary context &amp; support</text><text x="22" y="92" class="m">Tinted surface · no shadow</text></g>
<g transform="translate(650,175)"><rect class="card" rx="20" width="280" height="155" style="filter:drop-shadow(0 4px 8px rgba(15,47,54,.08))"/><text x="22" y="34" class="s">Interactive</text><text x="22" y="65" class="b">Route, choice, actionable summary</text><text x="22" y="92" class="m">Clear affordance · Raised on focus</text><text x="240" y="122" font-size="26" fill="#168C7C">→</text></g>
<g transform="translate(950,175)"><rect class="feature" rx="32" width="280" height="155"/><text x="22" y="34" class="s ft">Feature</text><text x="22" y="65" class="b ft">Hero / editorial brand moment</text><circle cx="226" cy="88" r="38" fill="#2BB6A3" opacity=".18"/><circle cx="226" cy="88" r="25" fill="#E6FBF4" opacity=".18"/></g>
<g transform="translate(1250,175)"><rect class="soft" rx="24" width="280" height="155" stroke="#BCE8CF"/><text x="22" y="34" class="s">Guidance</text><text x="22" y="65" class="b">Recommendation / next step</text><text x="22" y="92" class="m">Explain why when evidence-based</text></g>
<g transform="translate(50,355)"><rect class="soft" rx="32" width="280" height="155"/><circle cx="64" cy="78" r="42" fill="#2BB6A3" opacity=".10"/><circle cx="64" cy="78" r="30" fill="#2BB6A3" opacity=".12"/><g stroke="#168C7C" stroke-width="6" stroke-linecap="round"><line x1="48" y1="62" x2="80" y2="62"/><line x1="48" y1="78" x2="80" y2="78"/><line x1="48" y1="94" x2="80" y2="94"/></g><text x="120" y="52" class="s">REV</text><text x="120" y="78" class="b">Living E + soft halo</text><text x="120" y="104" class="m">Only for genuine REV moments</text></g>
<g transform="translate(350,355)"><rect rx="18" width="280" height="155" fill="#E7F5EF"/><circle cx="38" cy="42" r="14" fill="#3BAA7A"/><text x="64" y="47" class="s" fill="#2D7A5D">Status</text><text x="22" y="82" class="b">Icon + text + semantic colour</text><text x="22" y="110" class="m">Never decoration-only</text></g>
<g transform="translate(650,355)"><rect class="card" rx="20" width="280" height="155"/><rect x="0" y="0" width="8" height="155" rx="4" fill="#C7D9EE"/><text x="24" y="36" class="s">Exam / performance</text><text x="24" y="68" class="b">Structured, calm, evidence-aware</text><text x="24" y="98" class="m">No manufactured urgency</text></g>
<g transform="translate(950,355)"><rect class="card" rx="20" width="280" height="155"/><rect x="22" y="22" width="44" height="44" rx="12" fill="#F2E9D9"/><path d="M35 52h18M35 44h18M35 36h18" stroke="#132026" stroke-width="2" stroke-linecap="round"/><text x="82" y="48" class="s">Subject accent</text><text x="22" y="92" class="b">Neutral card + small recognition cue</text><text x="22" y="120" class="m">Never a full subject theme</text></g>
<g transform="translate(1250,355)"><rect class="card" rx="24" width="280" height="155"/><text x="22" y="38" class="s">Pricing / upgrade</text><text x="22" y="70" class="b">Value + entitlement made clear</text><rect x="22" y="96" width="128" height="38" rx="14" fill="#2BB6A3"/><text x="44" y="121" font-size="14" font-weight="700">View options</text></g>
<text x="50" y="570" class="s">Iconography</text><g transform="translate(50,600)"><rect class="card" rx="20" width="710" height="300"/><text x="24" y="38" class="s">Rounded line language</text><g transform="translate(35,70)" stroke="#132026" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M10 20l18-14 18 14v24H10z"/><path d="M18 44V28h20v16"/></g><text x="105" y="104" class="b">24px default · 20px compact · 16px inline</text><g transform="translate(35,135)" stroke="#168C7C" stroke-width="2" fill="none" stroke-linecap="round"><circle cx="28" cy="28" r="22"/><path d="M17 28h22M28 17v22"/></g><text x="105" y="170" class="b">1.75–2px stroke · rounded caps and joins</text><g transform="translate(35,205)" stroke="#132026" stroke-width="2" fill="none" stroke-linecap="round"><rect x="8" y="10" width="40" height="34" rx="8"/><path d="M17 25h22M17 33h14"/></g><text x="105" y="238" class="b">currentColor · consistent library · clear silhouette</text><text x="24" y="280" class="m">Avoid emoji controls, mixed libraries, cartoon clip-art and inconsistent 3D treatments.</text></g>
<g transform="translate(790,600)"><rect class="card" rx="20" width="740" height="300"/><text x="24" y="38" class="s">Graphic motifs</text><circle cx="95" cy="120" r="48" fill="#E6FBF4"/><circle cx="95" cy="120" r="33" fill="#2BB6A3" opacity=".08"/><g stroke="#168C7C" stroke-width="5" stroke-linecap="round"><line x1="77" y1="104" x2="113" y2="104"/><line x1="77" y1="120" x2="113" y2="120"/><line x1="77" y1="136" x2="113" y2="136"/></g><text x="155" y="112" class="b">Living-E line echoes and soft halo</text><text x="155" y="138" class="m">Reserve halo for REV-led moments</text><path d="M40 205h150" stroke="#2BB6A3" stroke-width="5" stroke-linecap="round"/><path d="M40 225h95" stroke="#BCE8CF" stroke-width="5" stroke-linecap="round"/><text x="215" y="220" class="b">Marker bars / underlines</text><g fill="#C7D9EE"><circle cx="505" cy="105" r="5"/><circle cx="525" cy="105" r="5"/><circle cx="545" cy="105" r="5"/></g><text x="585" y="111" class="b">Sparse activity traces</text><circle cx="520" cy="215" r="48" fill="none" stroke="#E6ECEB" stroke-width="2"/><circle cx="520" cy="215" r="32" fill="none" stroke="#BCE8CF" stroke-width="2"/><text x="585" y="220" class="b">Restrained rings / ripples</text><text x="24" y="278" class="m">Use one or two motifs per composition; avoid sci-fi particles, neon bloom and visual clutter.</text></g></svg>