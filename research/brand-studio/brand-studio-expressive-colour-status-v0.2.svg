<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2320" viewBox="0 0 1600 2320" role="img" aria-labelledby="title desc">
  <title id="title">Revision Brand Studio expressive colour and status v0.2</title>
  <desc id="desc">Experimental colour-system board separating approved core brand colours, candidate semantic feedback pairs and an expressive palette for REV, illustration, campaigns and restrained subject recognition.</desc>
  <defs>
    <style>
      .bg{fill:#F7F8FF}.ink{fill:#10143F}.muted{fill:#66708F}.indigo{fill:#3349F4}.white{fill:#fff}.card{fill:#fff;stroke:#E3E6F2;stroke-width:1.5}.line{stroke:#E3E6F2;stroke-width:1.5}
      .h0{font:950 55px Inter,Arial,sans-serif;letter-spacing:-2.7px}.h1{font:900 34px Inter,Arial,sans-serif;letter-spacing:-1.1px}.h2{font:850 23px Inter,Arial,sans-serif}.body{font:500 16px Inter,Arial,sans-serif}.small{font:650 13px Inter,Arial,sans-serif}.tiny{font:750 11px Inter,Arial,sans-serif;letter-spacing:.6px}.label{font:850 12px Inter,Arial,sans-serif;letter-spacing:1.2px}
    </style>
    <radialGradient id="orb" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#7BF3FF"/><stop offset=".32" stop-color="#4C7DFF"/><stop offset="1" stop-color="#18249A"/></radialGradient>
  </defs>
  <rect class="bg" width="1600" height="2320"/>
  <text x="84" y="82" class="label indigo">BRAND STUDIO · COLOUR SYSTEM · EXPERIMENTAL</text>
  <text x="84" y="150" class="h0 ink">Colour with jobs, not colour by accident.</text>
  <text x="84" y="194" class="body muted">v0.2 · core source colours remain unchanged · semantic and expressive extensions require confirmation</text>

  <rect x="84" y="242" width="1432" height="108" rx="28" fill="#10143F"/>
  <text x="118" y="284" class="label" fill="#C9FF2E">SYSTEM RULE</text>
  <text x="118" y="326" class="h2 white">Core brand colours create recognition. Semantic colours carry meaning. Expressive colours create energy. Never make one category do another category's job.</text>

  <text x="84" y="430" class="h1 ink">1. Approved core source palette</text>
  <text x="84" y="464" class="body muted">These colours come from the active Visual Brand System on main. Their cross-channel role is being expanded in PR #75, not their underlying values.</text>
  <rect x="84" y="504" width="1432" height="264" rx="30" class="card"/>
  <g transform="translate(120 546)">
    <g><rect width="174" height="116" rx="22" fill="#10143F"/><text y="148" class="small ink">Deep Ink</text><text y="171" class="tiny muted">#10143F · structure/text</text></g>
    <g transform="translate(196 0)"><rect width="174" height="116" rx="22" fill="#3349F4"/><text y="148" class="small ink">Revision Indigo</text><text y="171" class="tiny muted">#3349F4 · brand/action</text></g>
    <g transform="translate(392 0)"><rect width="174" height="116" rx="22" fill="#18279F"/><text y="148" class="small ink">Deep Indigo</text><text y="171" class="tiny muted">#18279F · depth/REV</text></g>
    <g transform="translate(588 0)"><rect width="174" height="116" rx="22" fill="#C9FF2E"/><text y="148" class="small ink">Bright Lime</text><text y="171" class="tiny muted">#C9FF2E · momentum</text></g>
    <g transform="translate(784 0)"><rect width="174" height="116" rx="22" fill="#F7F8FF" stroke="#E3E6F2"/><text y="148" class="small ink">Canvas</text><text y="171" class="tiny muted">#F7F8FF · base</text></g>
    <g transform="translate(980 0)"><rect width="174" height="116" rx="22" fill="#66708F"/><text y="148" class="small ink">Muted</text><text y="171" class="tiny muted">#66708F · secondary text</text></g>
    <g transform="translate(1176 0)"><rect width="174" height="116" rx="22" fill="#fff" stroke="#E3E6F2"/><text y="148" class="small ink">Surface</text><text y="171" class="tiny muted">White + #E3E6F2</text></g>
  </g>

  <text x="84" y="850" class="h1 ink">2. Candidate semantic feedback system</text>
  <text x="84" y="884" class="body muted">Meaning-critical status colours should be stable across learner, Admin and marketing UI. Every status keeps text/icon language; colour is never the sole carrier.</text>

  <g transform="translate(84 928)">
    <rect width="338" height="248" rx="28" fill="#EAF8F2" stroke="#CBECDD"/>
    <circle cx="42" cy="48" r="13" fill="#137A53"/><text x="70" y="54" class="label" fill="#137A53">SUCCESS · CANDIDATE</text>
    <text x="36" y="108" class="h2" fill="#137A53">Evidence saved</text><text x="36" y="144" class="body" fill="#375E50">Your answer and evidence are safe.</text>
    <text x="36" y="202" class="tiny" fill="#137A53">FG #137A53 · BG #EAF8F2</text><text x="36" y="224" class="tiny muted">Contrast ≈ 4.88:1</text>
  </g>
  <g transform="translate(446 928)">
    <rect width="338" height="248" rx="28" fill="#FFF8E6" stroke="#F3DEAE"/>
    <circle cx="42" cy="48" r="13" fill="#8A5A00"/><text x="70" y="54" class="label" fill="#8A5A00">WARNING · CANDIDATE</text>
    <text x="36" y="108" class="h2" fill="#8A5A00">Check this first</text><text x="36" y="144" class="body" fill="#6E5A2D">A choice needs your attention.</text>
    <text x="36" y="202" class="tiny" fill="#8A5A00">FG #8A5A00 · BG #FFF8E6</text><text x="36" y="224" class="tiny muted">Contrast ≈ 5.59:1</text>
  </g>
  <g transform="translate(808 928)">
    <rect width="338" height="248" rx="28" fill="#FFF0F3" stroke="#F2CAD3"/>
    <circle cx="42" cy="48" r="13" fill="#A43850"/><text x="70" y="54" class="label" fill="#A43850">DANGER · CANDIDATE</text>
    <text x="36" y="108" class="h2" fill="#A43850">Could not save</text><text x="36" y="144" class="body" fill="#70434D">Nothing was lost. Try again.</text>
    <text x="36" y="202" class="tiny" fill="#A43850">FG #A43850 · BG #FFF0F3</text><text x="36" y="224" class="tiny muted">Contrast ≈ 5.83:1</text>
  </g>
  <g transform="translate(1170 928)">
    <rect width="346" height="248" rx="28" fill="#EEF1FF" stroke="#D9DEFE"/>
    <circle cx="42" cy="48" r="13" fill="#3349F4"/><text x="70" y="54" class="label indigo">INFO · CANDIDATE</text>
    <text x="36" y="108" class="h2 indigo">Why this matters</text><text x="36" y="144" class="body" fill="#485177">Extra context without alarm.</text>
    <text x="36" y="202" class="tiny indigo">FG #3349F4 · BG #EEF1FF</text><text x="36" y="224" class="tiny muted">Contrast ≈ 5.49:1</text>
  </g>

  <rect x="84" y="1206" width="1432" height="92" rx="24" fill="#fff" stroke="#E3E6F2"/>
  <text x="118" y="1242" class="label indigo">ACCESSIBILITY CHECK</text>
  <text x="118" y="1274" class="small ink">These foreground/background candidates meet WCAG AA normal-text contrast in calculation. They still require real component, focus, disabled and dark/bright-context testing before approval.</text>

  <text x="84" y="1382" class="h1 ink">3. Expressive palette — deliberately not semantic</text>
  <text x="84" y="1416" class="body muted">Use for REV effects, illustration, editorial cards, social/video and restrained subject recognition. These colours must never silently become new primary buttons or attainment/status meanings.</text>
  <rect x="84" y="1456" width="1432" height="312" rx="30" class="card"/>
  <g transform="translate(120 1500)">
    <g><rect width="270" height="146" rx="28" fill="#7BF3FF"/><text y="178" class="h2 ink">REV Cyan</text><text y="207" class="small muted">#7BF3FF · AI/glow/signal</text><rect y="225" width="190" height="28" rx="14" fill="#EEF1FF"/><text x="18" y="244" class="tiny indigo">PREFERRED EXPERIMENT</text></g>
    <g transform="translate(318 0)"><rect width="270" height="146" rx="28" fill="#7C66FF"/><text y="178" class="h2 ink">Electric Violet</text><text y="207" class="small muted">#7C66FF · editorial/illustration</text><rect y="225" width="132" height="28" rx="14" fill="#F2F0FF"/><text x="18" y="244" class="tiny" fill="#5D48D6">EXPERIMENTAL</text></g>
    <g transform="translate(636 0)"><rect width="270" height="146" rx="28" fill="#FF7A7A"/><text y="178" class="h2 ink">Coral</text><text y="207" class="small muted">#FF7A7A · human energy/editorial</text><rect y="225" width="132" height="28" rx="14" fill="#FFF0F0"/><text x="18" y="244" class="tiny" fill="#A43850">EXPERIMENTAL</text></g>
    <g transform="translate(954 0)"><rect width="270" height="146" rx="28" fill="#FFD45C"/><text y="178" class="h2 ink">Gold</text><text y="207" class="small muted">#FFD45C · warmth/illustration</text><rect y="225" width="132" height="28" rx="14" fill="#FFF8E6"/><text x="18" y="244" class="tiny" fill="#8A5A00">EXPERIMENTAL</text></g>
  </g>

  <text x="84" y="1850" class="h1 ink">4. Subject differentiation without competing themes</text>
  <text x="84" y="1884" class="body muted">Subject colour is a recognition aid, not a complete theme and never a proxy for attainment. Name + icon/context remains visible.</text>
  <rect x="84" y="1924" width="1432" height="250" rx="30" class="card"/>
  <g transform="translate(120 1960)">
    <rect width="296" height="160" rx="22" fill="#fff" stroke="#E3E6F2"/><rect width="10" height="160" rx="5" fill="#7C66FF"/><circle cx="56" cy="54" r="22" fill="#F2F0FF"/><text x="92" y="49" class="tiny muted">SUBJECT</text><text x="92" y="78" class="h2 ink">Business</text><text x="32" y="126" class="small muted">Accent only · same Revision surface</text>
    <g transform="translate(324 0)"><rect width="296" height="160" rx="22" fill="#fff" stroke="#E3E6F2"/><rect width="10" height="160" rx="5" fill="#FF7A7A"/><circle cx="56" cy="54" r="22" fill="#FFF0F0"/><text x="92" y="49" class="tiny muted">SUBJECT</text><text x="92" y="78" class="h2 ink">Spanish</text><text x="32" y="126" class="small muted">Accent only · text remains explicit</text></g>
    <g transform="translate(648 0)"><rect width="296" height="160" rx="22" fill="#fff" stroke="#E3E6F2"/><rect width="10" height="160" rx="5" fill="#FFD45C"/><circle cx="56" cy="54" r="22" fill="#FFF8E6"/><text x="92" y="49" class="tiny muted">SUBJECT</text><text x="92" y="78" class="h2 ink">Maths</text><text x="32" y="126" class="small muted">Accent only · no attainment meaning</text></g>
    <g transform="translate(972 0)"><rect width="296" height="160" rx="22" fill="#10143F"/><text x="28" y="48" class="label" fill="#C9FF2E">DO NOT DO THIS</text><text x="28" y="84" class="h2 white">A different app per subject</text><text x="28" y="122" class="small" fill="#B8C0E1">Avoid full competing palettes/themes.</text></g>
  </g>

  <rect x="84" y="2204" width="1432" height="76" rx="24" fill="#10143F"/>
  <text x="118" y="2251" class="small white">Recommended v0.2 direction: approve the three-level colour architecture first; keep REV Cyan as the leading expressive experiment; test the wider expressive set and subject accents before promoting any exact values.</text>
</svg>