<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1940" viewBox="0 0 1600 1940" role="img" aria-labelledby="title desc">
  <title id="title">Revision Brand Studio v0.3 — controls and forms</title>
  <desc id="desc">Experimental Calm Teal control and form system with accessible action and validation treatments.</desc>
  <defs>
    <filter id="s1" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F2F36" flood-opacity=".06"/></filter>
    <style>
      .bg{fill:#FAFCFB}.panel{fill:#fff;stroke:#E6ECEB;stroke-width:1.5}.ink{fill:#132026}.deep{fill:#0F2F36}.muted{fill:#607074}.teal{fill:#2BB6A3}.aqua{fill:#E6FBF4}.surface{fill:#F1FAF8}.white{fill:#fff}.error{fill:#E0605A}.info{fill:#4A8ECB}
      .label{font:700 13px Manrope,Arial,sans-serif;letter-spacing:1px}.h0{font:700 44px Manrope,Arial,sans-serif;letter-spacing:-1.4px}.h1{font:700 30px Manrope,Arial,sans-serif}.h2{font:700 22px Manrope,Arial,sans-serif}.body{font:500 16px Manrope,Arial,sans-serif}.small{font:500 14px Manrope,Arial,sans-serif}.tiny{font:600 12px Manrope,Arial,sans-serif}.button{font:600 15px Manrope,Arial,sans-serif}
    </style>
  </defs>
  <rect class="bg" width="1600" height="1940"/>
  <text x="72" y="76" class="label teal">BRAND STUDIO · v0.3 · EXPERIMENTAL</text>
  <text x="72" y="132" class="h0 deep">Controls &amp; forms</text>
  <text x="72" y="170" class="body muted">Consistent primitives across learner, marketing and Admin · light + dark</text>

  <!-- Buttons -->
  <rect x="72" y="220" width="1456" height="520" rx="28" class="panel" filter="url(#s1)"/>
  <text x="108" y="266" class="label teal">01 · ACTIONS</text>
  <text x="108" y="308" class="h1 deep">One action family, controlled variants</text>
  <text x="108" y="340" class="small muted">44px standard · 52px large · 14px radius · strong focus on every interactive state</text>

  <!-- light buttons -->
  <text x="108" y="402" class="tiny muted">LIGHT MODE</text>
  <rect x="108" y="430" width="218" height="52" rx="14" fill="#2BB6A3"/><text x="162" y="462" class="button ink">Primary action</text>
  <rect x="348" y="430" width="218" height="52" rx="14" fill="#0F2F36"/><text x="393" y="462" class="button white">Strong primary</text>
  <rect x="588" y="430" width="218" height="52" rx="14" fill="#fff" stroke="#E6ECEB" stroke-width="1.5"/><text x="645" y="462" class="button ink">Secondary</text>
  <rect x="828" y="430" width="180" height="52" rx="14" fill="#fff"/><text x="864" y="462" class="button deep">Tertiary →</text>
  <rect x="1030" y="430" width="218" height="52" rx="14" fill="#FBECEB" stroke="#E0605A" stroke-width="1.5"/><text x="1085" y="462" class="button" fill="#AD504D">Delete item</text>
  <rect x="1270" y="430" width="200" height="52" rx="14" fill="#F1FAF8"/><text x="1328" y="462" class="button muted">Disabled</text>

  <text x="108" y="535" class="tiny muted">STATE EXAMPLES</text>
  <rect x="108" y="564" width="218" height="44" rx="14" fill="#2BB6A3"/><text x="169" y="592" class="button ink">Default</text>
  <rect x="348" y="564" width="218" height="44" rx="14" fill="#E6FBF4" stroke="#0F2F36" stroke-width="2"/><text x="416" y="592" class="button deep">Focus</text>
  <rect x="588" y="564" width="218" height="44" rx="14" fill="#25A692"/><text x="650" y="592" class="button ink">Pressed</text>
  <rect x="828" y="564" width="218" height="44" rx="14" fill="#2BB6A3" opacity=".65"/><circle cx="866" cy="586" r="9" fill="none" stroke="#132026" stroke-width="2" stroke-dasharray="6 4"/><text x="890" y="592" class="button ink">Loading…</text>

  <rect x="108" y="646" width="1360" height="58" rx="16" fill="#FFF7E8"/>
  <text x="130" y="681" class="small" fill="#826C31">Accessibility correction: white on Primary Teal is ~2.52:1. Graphite on Primary Teal is ~6.59:1, so dark action text is the proposed default.</text>

  <!-- Form anatomy -->
  <rect x="72" y="780" width="900" height="1010" rx="28" class="panel" filter="url(#s1)"/>
  <text x="108" y="826" class="label teal">02 · FORM ANATOMY</text>
  <text x="108" y="868" class="h1 deep">Labels stay visible. States explain themselves.</text>

  <text x="108" y="930" class="tiny deep">DEFAULT</text>
  <text x="108" y="965" class="small ink">Subject name</text>
  <rect x="108" y="980" width="720" height="48" rx="14" fill="#fff" stroke="#E6ECEB" stroke-width="1.5"/>
  <text x="132" y="1010" class="body muted">e.g. Business Studies</text>
  <text x="108" y="1055" class="small muted">Use the subject name shown by your school or exam board.</text>

  <text x="108" y="1114" class="tiny deep">FOCUS</text>
  <text x="108" y="1149" class="small ink">Exam date</text>
  <rect x="108" y="1164" width="720" height="48" rx="14" fill="#fff" stroke="#0F2F36" stroke-width="2"/>
  <rect x="102" y="1158" width="732" height="60" rx="18" fill="none" stroke="#BCE8CF" stroke-width="4" opacity=".7"/>
  <text x="132" y="1194" class="body ink">18 May 2027</text>
  <text x="108" y="1240" class="small muted">Focus remains obvious without relying on glow alone.</text>

  <text x="108" y="1299" class="tiny" fill="#AD504D">ERROR</text>
  <text x="108" y="1334" class="small ink">Weekly revision time</text>
  <rect x="108" y="1349" width="720" height="48" rx="14" fill="#fff" stroke="#E0605A" stroke-width="2"/>
  <text x="132" y="1379" class="body ink">0</text>
  <circle cx="800" cy="1373" r="11" fill="#E0605A"/><text x="797" y="1378" font-family="Arial" font-size="15" font-weight="700" fill="#fff">!</text>
  <text x="108" y="1426" class="small" fill="#AD504D">Enter at least 15 minutes so we can build a useful plan.</text>

  <text x="108" y="1485" class="tiny" fill="#2D7A5D">MEANINGFUL SUCCESS</text>
  <text x="108" y="1520" class="small ink">Email verified</text>
  <rect x="108" y="1535" width="720" height="48" rx="14" fill="#E7F5EF" stroke="#3BAA7A" stroke-width="1.5"/>
  <text x="132" y="1565" class="body ink">jamie@example.com</text><text x="712" y="1565" class="small" fill="#2D7A5D">✓ Verified</text>
  <text x="108" y="1612" class="small muted">Do not add success styling to every ordinary valid field.</text>

  <text x="108" y="1671" class="tiny muted">DISABLED VS READ-ONLY</text>
  <rect x="108" y="1688" width="338" height="48" rx="14" fill="#F1FAF8" stroke="#E6ECEB"/><text x="132" y="1718" class="body muted">Disabled — cannot act</text>
  <rect x="468" y="1688" width="360" height="48" rx="14" fill="#fff" stroke="#E6ECEB"/><text x="492" y="1718" class="body ink">Read-only — visible/selectable</text>

  <!-- Dark / selection -->
  <rect x="1010" y="780" width="518" height="1010" rx="28" fill="#0F2024" stroke="#24434A" stroke-width="1.5"/>
  <text x="1046" y="826" class="label" fill="#2BB6A3">03 · DARK + SELECTION</text>
  <text x="1046" y="868" class="h2" fill="#E6F2EF">Same grammar, darker surfaces</text>
  <text x="1046" y="902" class="small" fill="#A8BCC0">Use surface steps and borders; avoid theatrical glow.</text>

  <text x="1046" y="966" class="tiny" fill="#A8BCC0">DARK FIELD</text>
  <text x="1046" y="1001" class="small" fill="#E6F2EF">Search topics</text>
  <rect x="1046" y="1016" width="420" height="48" rx="14" fill="#13272B" stroke="#24434A" stroke-width="1.5"/>
  <text x="1070" y="1046" class="body" fill="#A8BCC0">Start typing…</text>

  <text x="1046" y="1124" class="tiny" fill="#A8BCC0">FOCUS</text>
  <rect x="1046" y="1140" width="420" height="48" rx="14" fill="#173136" stroke="#E6FBF4" stroke-width="2"/>
  <text x="1070" y="1170" class="body" fill="#E6F2EF">Operations</text>

  <text x="1046" y="1244" class="tiny" fill="#A8BCC0">CHECKBOX / RADIO</text>
  <rect x="1046" y="1270" width="22" height="22" rx="6" fill="#0F2F36" stroke="#2BB6A3" stroke-width="2"/><path d="M1052 1281 l5 5 l9 -11" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="1082" y="1287" class="small" fill="#E6F2EF">Include weekends</text>
  <circle cx="1057" cy="1334" r="11" fill="#2BB6A3"/><circle cx="1057" cy="1334" r="4" fill="#132026"/><text x="1082" y="1339" class="small" fill="#E6F2EF">30 minute blocks</text>

  <text x="1046" y="1412" class="tiny" fill="#A8BCC0">CHIPS</text>
  <rect x="1046" y="1434" width="108" height="38" rx="19" fill="#2BB6A3"/><text x="1074" y="1458" class="tiny ink">Selected</text>
  <rect x="1168" y="1434" width="104" height="38" rx="19" fill="#173136" stroke="#24434A"/><text x="1199" y="1458" class="tiny" fill="#E6F2EF">Default</text>
  <rect x="1286" y="1434" width="132" height="38" rx="19" fill="#173136" stroke="#E6FBF4" stroke-width="2"/><text x="1319" y="1458" class="tiny" fill="#E6F2EF">Focused</text>

  <text x="1046" y="1540" class="tiny" fill="#A8BCC0">TOGGLE</text>
  <rect x="1046" y="1562" width="54" height="30" rx="15" fill="#2BB6A3"/><circle cx="1083" cy="1577" r="11" fill="#132026"/><text x="1118" y="1583" class="small" fill="#E6F2EF">Dark mode</text>

  <rect x="1046" y="1650" width="420" height="96" rx="20" fill="#173136" stroke="#24434A"/>
  <text x="1070" y="1680" class="tiny" fill="#2BB6A3">CONTROL RULE</text>
  <text x="1070" y="1710" class="small" fill="#E6F2EF">Colour supports state; shape, label and position</text>
  <text x="1070" y="1733" class="small" fill="#A8BCC0">must keep the state understandable without colour.</text>

  <!-- Semantic strip -->
  <rect x="72" y="1824" width="1456" height="72" rx="22" fill="#fff" stroke="#E6ECEB"/>
  <circle cx="108" cy="1860" r="10" fill="#3BAA7A"/><text x="128" y="1865" class="small" fill="#2D7A5D">Success strong #2D7A5D</text>
  <circle cx="420" cy="1860" r="10" fill="#DDAA3A"/><text x="440" y="1865" class="small" fill="#826C31">Warning strong #826C31</text>
  <circle cx="745" cy="1860" r="10" fill="#E0605A"/><text x="765" y="1865" class="small" fill="#AD504D">Error strong #AD504D</text>
  <circle cx="1050" cy="1860" r="10" fill="#4A8ECB"/><text x="1070" y="1865" class="small" fill="#3C72A2">Info strong #3C72A2</text>
  <text x="72" y="1924" class="tiny muted">Experimental confirmation artifact · Brand Studio v0.3 · semantic strong variants remain candidates pending Founder approval.</text>
</svg>