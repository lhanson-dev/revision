<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2240" viewBox="0 0 1600 2240" role="img" aria-labelledby="title desc">
  <title id="title">Revision Brand Studio channel expressions v0.1</title>
  <desc id="desc">Experimental visual board showing how the same Revision brand foundation could flex across learner product, marketing, Admin, social media and video without forcing identical layouts.</desc>
  <defs>
    <linearGradient id="revGrad" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#3349F4"/><stop offset="1" stop-color="#18279F"/></linearGradient>
    <radialGradient id="orb" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#7BF3FF"/><stop offset="0.35" stop-color="#4C7DFF"/><stop offset="1" stop-color="#18249A"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#1F2D78" flood-opacity="0.12"/></filter>
    <style>
      .bg{fill:#F7F8FF}.ink{fill:#10143F}.muted{fill:#66708F}.indigo{fill:#3349F4}.white{fill:#fff}.line{stroke:#E3E6F2;stroke-width:1.5}
      .h0{font:950 52px Inter,Arial,sans-serif;letter-spacing:-2.5px}.h1{font:900 32px Inter,Arial,sans-serif;letter-spacing:-1px}.h2{font:850 22px Inter,Arial,sans-serif}.body{font:500 16px Inter,Arial,sans-serif}.small{font:650 13px Inter,Arial,sans-serif}.tiny{font:750 11px Inter,Arial,sans-serif;letter-spacing:.7px}.label{font:850 12px Inter,Arial,sans-serif;letter-spacing:1.2px}
    </style>
  </defs>
  <rect class="bg" width="1600" height="2240"/>
  <text x="82" y="78" class="label indigo">BRAND STUDIO · CHANNEL EXPRESSION</text>
  <text x="82" y="142" class="h0 ink">Same DNA. Different jobs.</text>
  <text x="82" y="184" class="body muted">Experimental examples for confirmation — visual direction only, not production implementation.</text>
  <rect x="1220" y="72" width="300" height="50" rx="25" fill="#EEF1FF"/><circle cx="1248" cy="97" r="7" fill="#3349F4"/><text x="1268" y="103" class="small indigo">EXPERIMENTAL · v0.1</text>

  <!-- Shared DNA -->
  <rect x="82" y="230" width="1438" height="104" rx="26" fill="#10143F"/>
  <text x="115" y="270" class="label" fill="#C9FF2E">SHARED DNA</text>
  <text x="115" y="309" class="h2 white">Deep Ink · Revision Indigo · selective Bright Lime · confident sans-serif · rounded geometry · clear hierarchy · REV intelligence motif</text>

  <!-- Learner product -->
  <text x="82" y="404" class="h1 ink">Learner product</text>
  <text x="82" y="436" class="small muted">Recommended expression: energetic + calm + task-first. Brand is visible, but learning clarity wins.</text>
  <rect x="82" y="468" width="1438" height="360" rx="30" fill="#fff" stroke="#E3E6F2" filter="url(#shadow)"/>
  <!-- learner nav -->
  <text x="118" y="515" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="950" letter-spacing="-1.5" fill="#10143F">Revision</text><text x="210" y="493" font-size="18" fill="#B9F11D">✦</text>
  <text x="510" y="515" class="small ink">Home</text><text x="585" y="515" class="small muted">Plan</text><text x="655" y="515" class="small indigo">REV</text><text x="724" y="515" class="small muted">Progress</text><text x="812" y="515" class="small muted">Subjects</text>
  <rect x="118" y="552" width="900" height="230" rx="30" fill="url(#revGrad)"/>
  <text x="154" y="594" class="label" fill="#C9FF2E">REV · YOUR STUDY GUIDE</text>
  <text x="154" y="646" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="950" letter-spacing="-1.8" fill="#fff">What matters today?</text>
  <text x="154" y="687" class="body" fill="#E5E8FF">Business should get the first 35 minutes. Your recent evidence is thinner in operations.</text>
  <rect x="154" y="718" width="190" height="48" rx="14" fill="#C9FF2E"/><text x="193" y="749" class="small ink">Start next step</text>
  <circle cx="920" cy="666" r="76" fill="none" stroke="#7BF3FF" stroke-opacity=".4"/><circle cx="920" cy="666" r="52" fill="url(#orb)" stroke="#E5FDFF" stroke-width="2"/>
  <rect x="1048" y="552" width="430" height="230" rx="24" fill="#fff" stroke="#E3E6F2"/>
  <text x="1082" y="594" class="label indigo">TODAY'S PLAN</text><text x="1082" y="638" class="h2 ink">3 useful blocks</text><text x="1082" y="676" class="small muted">Business · Operations</text><text x="1082" y="706" class="small muted">Spanish · Comprehension</text><text x="1082" y="736" class="small muted">Maths · Algebra</text>

  <!-- Marketing -->
  <text x="82" y="900" class="h1 ink">Marketing / editorial</text>
  <text x="82" y="932" class="small muted">Recommended expression: bigger, bolder and story-led. Same foundations, more art direction and asymmetry.</text>
  <rect x="82" y="964" width="920" height="420" rx="34" fill="#10143F" filter="url(#shadow)"/>
  <text x="120" y="1012" class="label" fill="#C9FF2E">REVISION</text>
  <text x="120" y="1088" font-family="Inter,Arial,sans-serif" font-size="62" font-weight="950" letter-spacing="-3" fill="#fff">Know what matters.</text>
  <text x="120" y="1153" font-family="Inter,Arial,sans-serif" font-size="62" font-weight="950" letter-spacing="-3" fill="#C9FF2E">Then get on with it.</text>
  <text x="120" y="1210" class="body" fill="#CDD3EE">A revision plan that adapts to the time you have, the exams ahead and the evidence you build.</text>
  <rect x="120" y="1250" width="175" height="50" rx="14" fill="#3349F4"/><text x="157" y="1282" class="small white">See how it works</text>
  <rect x="640" y="1060" width="300" height="250" rx="30" fill="#3349F4" transform="rotate(-5 790 1185)"/>
  <circle cx="790" cy="1180" r="80" fill="url(#orb)"/>
  <path d="M704 1300 C750 1240 826 1240 885 1295" fill="none" stroke="#C9FF2E" stroke-width="18" stroke-linecap="round"/>
  <rect x="1030" y="964" width="490" height="420" rx="34" fill="#fff" stroke="#E3E6F2"/>
  <text x="1065" y="1010" class="label indigo">ALTERNATIVE EDITORIAL SURFACE</text>
  <text x="1065" y="1066" class="h1 ink">Make the time you have count.</text>
  <text x="1065" y="1112" class="body muted">More whitespace. Product proof. A quieter persuasion moment.</text>
  <rect x="1065" y="1162" width="390" height="142" rx="24" fill="#EEF1FF"/>
  <rect x="1094" y="1190" width="112" height="18" rx="9" fill="#3349F4"/><rect x="1094" y="1222" width="285" height="12" rx="6" fill="#BFC6E9"/><rect x="1094" y="1248" width="220" height="12" rx="6" fill="#D6DAEE"/>
  <text x="1065" y="1342" class="tiny muted">Use for product proof, pricing, trust and editorial explanation.</text>

  <!-- Admin -->
  <text x="82" y="1460" class="h1 ink">Admin / operations</text>
  <text x="82" y="1492" class="small muted">Recommended expression: restrained and denser. Reuse controls and status semantics; do not force marketing art direction into operations.</text>
  <rect x="82" y="1524" width="850" height="380" rx="28" fill="#fff" stroke="#E3E6F2"/>
  <rect x="82" y="1524" width="184" height="380" rx="28" fill="#10143F"/>
  <text x="112" y="1570" class="label" fill="#C9FF2E">REVISION ADMIN</text>
  <text x="112" y="1622" class="small white">Overview</text><text x="112" y="1660" class="small" fill="#AAB3D7">Content</text><text x="112" y="1698" class="small" fill="#AAB3D7">Assurance</text><text x="112" y="1736" class="small" fill="#AAB3D7">Users</text>
  <text x="300" y="1574" class="h2 ink">System health</text>
  <g transform="translate(300 1608)"><rect width="180" height="92" rx="18" fill="#F7F8FF" stroke="#E3E6F2"/><text x="18" y="30" class="tiny muted">REMINDER ENGINE</text><circle cx="26" cy="60" r="7" fill="#3349F4"/><text x="42" y="65" class="small ink">Healthy</text></g>
  <g transform="translate(496 1608)"><rect width="180" height="92" rx="18" fill="#F7F8FF" stroke="#E3E6F2"/><text x="18" y="30" class="tiny muted">ASSURANCE</text><circle cx="26" cy="60" r="7" fill="#C9FF2E"/><text x="42" y="65" class="small ink">2 actions</text></g>
  <g transform="translate(692 1608)"><rect width="180" height="92" rx="18" fill="#F7F8FF" stroke="#E3E6F2"/><text x="18" y="30" class="tiny muted">DATA</text><circle cx="26" cy="60" r="7" fill="#66708F"/><text x="42" y="65" class="small ink">Unknown</text></g>
  <rect x="300" y="1732" width="572" height="126" rx="18" fill="#fff" stroke="#E3E6F2"/><text x="320" y="1764" class="tiny muted">CRITICAL ACTIONS</text><text x="320" y="1802" class="small ink">Content assurance requires review</text><rect x="732" y="1777" width="120" height="38" rx="12" fill="#EEF1FF"/><text x="758" y="1801" class="tiny indigo">OPEN QUEUE</text>
  <rect x="960" y="1524" width="560" height="380" rx="28" fill="#EEF1FF"/>
  <text x="995" y="1570" class="label indigo">ADMIN RULE</text><text x="995" y="1616" class="h2 ink">Same brand, lower theatre.</text><text x="995" y="1655" class="body muted">Keep Indigo for actions and focus. Lime can flag momentum or attention, but operational statuses must use stable semantic meanings.</text>
  <rect x="995" y="1712" width="220" height="52" rx="14" fill="#3349F4"/><text x="1044" y="1745" class="small white">Review action</text><rect x="1230" y="1712" width="220" height="52" rx="14" fill="#fff" stroke="#E3E6F2"/><text x="1285" y="1745" class="small ink">Export</text>

  <!-- Social + Video -->
  <text x="82" y="1982" class="h1 ink">Social &amp; video</text>
  <text x="82" y="2014" class="small muted">High expression is allowed here, but recognition should come from repeatable grammar rather than a new campaign identity every time.</text>
  <!-- square post -->
  <rect x="82" y="2048" width="310" height="160" rx="24" fill="#3349F4"/>
  <text x="105" y="2080" class="label" fill="#C9FF2E">SOCIAL · RECOMMENDED</text><text x="105" y="2125" class="h2 white">Stop guessing</text><text x="105" y="2155" class="h2 white">what to revise.</text><circle cx="340" cy="2160" r="28" fill="url(#orb)"/>
  <!-- story -->
  <rect x="414" y="2048" width="220" height="160" rx="24" fill="#10143F"/>
  <text x="438" y="2080" class="label" fill="#C9FF2E">STORY / REEL</text><text x="438" y="2122" class="small white">3 signs your plan</text><text x="438" y="2148" class="small white">needs to adapt</text><rect x="438" y="2178" width="120" height="8" rx="4" fill="#3349F4"/>
  <!-- video -->
  <rect x="660" y="2048" width="530" height="160" rx="24" fill="#10143F"/>
  <text x="686" y="2080" class="label" fill="#C9FF2E">VIDEO TITLE FRAME</text><text x="686" y="2130" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="950" letter-spacing="-1" fill="#fff">Your revision plan changed.</text><text x="686" y="2164" class="small" fill="#C7CCE0">That doesn't mean you've failed.</text><rect x="686" y="2184" width="210" height="8" rx="4" fill="#3349F4"/>
  <!-- lower third -->
  <rect x="1214" y="2048" width="306" height="160" rx="24" fill="#fff" stroke="#E3E6F2"/>
  <text x="1238" y="2080" class="label indigo">LOWER THIRD / CAPTION</text><rect x="1238" y="2110" width="244" height="54" rx="14" fill="#10143F"/><text x="1258" y="2133" class="tiny" fill="#C9FF2E">REVISION</text><text x="1258" y="2152" class="small white">What matters next</text><text x="1238" y="2194" class="tiny muted">Captions remain essential.</text>
</svg>