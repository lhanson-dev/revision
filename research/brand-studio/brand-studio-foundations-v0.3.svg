<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1900" viewBox="0 0 1600 1900" role="img" aria-labelledby="title desc">
  <title id="title">Revision Brand Studio v0.3 — typography, spacing, shape and depth</title>
  <desc id="desc">Experimental confirmation board using the Founder-confirmed Calm Teal palette and Manrope direction.</desc>
  <defs>
    <filter id="s1" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F2F36" flood-opacity=".06"/></filter>
    <filter id="s2" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#0F2F36" flood-opacity=".10"/></filter>
    <style>
      .bg{fill:#FAFCFB}.panel{fill:#fff;stroke:#E6ECEB;stroke-width:1.5}.ink{fill:#132026}.deep{fill:#0F2F36}.muted{fill:#607074}.teal{fill:#2BB6A3}.aqua{fill:#E6FBF4}.surface{fill:#F1FAF8}.white{fill:#fff}
      .label{font:700 13px Manrope,Arial,sans-serif;letter-spacing:1px}.h0{font:700 44px Manrope,Arial,sans-serif;letter-spacing:-1.5px}.h1{font:700 30px Manrope,Arial,sans-serif;letter-spacing:-.6px}.h2{font:700 22px Manrope,Arial,sans-serif}.body{font:500 16px Manrope,Arial,sans-serif}.small{font:500 14px Manrope,Arial,sans-serif}.tiny{font:600 12px Manrope,Arial,sans-serif}.num{font:700 20px Manrope,Arial,sans-serif}
    </style>
  </defs>
  <rect class="bg" width="1600" height="1900"/>
  <text x="72" y="76" class="label teal">BRAND STUDIO · v0.3 · EXPERIMENTAL</text>
  <text x="72" y="132" class="h0 deep">System foundations</text>
  <text x="72" y="170" class="body muted">Manrope · spacing rhythm · radii · elevation · responsive layout</text>
  <rect x="1245" y="84" width="285" height="46" rx="23" fill="#E6FBF4"/><text x="1284" y="113" class="tiny deep">FOR FOUNDER CONFIRMATION</text>

  <!-- Typography -->
  <rect x="72" y="220" width="1456" height="620" rx="28" class="panel" filter="url(#s1)"/>
  <text x="108" y="266" class="label teal">01 · TYPOGRAPHY</text>
  <text x="108" y="308" class="h1 deep">One readable Manrope hierarchy</text>
  <text x="108" y="340" class="small muted">Large enough to feel confident, restrained enough for sustained learning.</text>

  <text x="108" y="420" font-family="Manrope,Arial,sans-serif" font-size="56" font-weight="700" fill="#132026">Display XL — 56 / 64</text>
  <text x="108" y="476" font-family="Manrope,Arial,sans-serif" font-size="44" font-weight="700" fill="#132026">Display L — 44 / 52</text>
  <text x="108" y="526" font-family="Manrope,Arial,sans-serif" font-size="36" font-weight="700" fill="#132026">H1 — 36 / 44</text>
  <text x="108" y="571" font-family="Manrope,Arial,sans-serif" font-size="28" font-weight="700" fill="#132026">H2 — 28 / 36</text>
  <text x="108" y="609" font-family="Manrope,Arial,sans-serif" font-size="22" font-weight="700" fill="#132026">H3 — 22 / 30</text>
  <text x="108" y="648" class="body ink">Body — 16 / 24 · default learner and product copy</text>
  <text x="108" y="681" class="small ink">Body S — 14 / 20 · secondary UI and denser Admin</text>
  <text x="108" y="712" class="tiny ink">LABEL — 13 / 18 · 600</text>
  <text x="108" y="742" font-family="Manrope,Arial,sans-serif" font-size="15" font-weight="600" fill="#132026">Button — 15 / 20 · 600</text>
  <text x="108" y="772" font-family="Manrope,Arial,sans-serif" font-size="12" font-weight="500" fill="#607074">Caption — 12 / 16</text>

  <rect x="995" y="382" width="470" height="386" rx="24" class="surface"/>
  <text x="1030" y="423" class="label deep">RESPONSIVE INTENT</text>
  <text x="1030" y="474" font-family="Manrope,Arial,sans-serif" font-size="34" font-weight="700" fill="#132026">What shall we do today?</text>
  <text x="1030" y="508" class="small muted">Mobile Display L · 34 / 42</text>
  <text x="1030" y="571" font-family="Manrope,Arial,sans-serif" font-size="30" font-weight="700" fill="#132026">Plan your revision</text>
  <text x="1030" y="604" class="small muted">Mobile H1 · 30 / 38</text>
  <text x="1030" y="656" class="body ink">Readable learning copy stays at 16px.</text>
  <text x="1030" y="686" class="small muted">Marketing can be larger; Admin can be denser.</text>
  <rect x="1030" y="716" width="160" height="36" rx="18" fill="#2BB6A3"/><text x="1063" y="739" class="tiny ink">NO ROUTINE 800+</text>

  <!-- Spacing -->
  <rect x="72" y="880" width="704" height="460" rx="28" class="panel" filter="url(#s1)"/>
  <text x="108" y="926" class="label teal">02 · SPACING RHYTHM</text>
  <text x="108" y="968" class="h2 deep">4px base · limited semantic scale</text>
  <g transform="translate(108 1020)">
    <rect width="4" height="28" rx="2" fill="#2BB6A3"/><text x="14" y="20" class="tiny ink">4</text>
    <rect x="62" width="8" height="28" rx="4" fill="#2BB6A3"/><text x="82" y="20" class="tiny ink">8</text>
    <rect x="130" width="12" height="28" rx="6" fill="#2BB6A3"/><text x="154" y="20" class="tiny ink">12</text>
    <rect x="210" width="16" height="28" rx="8" fill="#2BB6A3"/><text x="238" y="20" class="tiny ink">16</text>
    <rect x="300" width="20" height="28" rx="10" fill="#2BB6A3"/><text x="332" y="20" class="tiny ink">20</text>
    <rect x="402" width="24" height="28" rx="12" fill="#2BB6A3"/><text x="438" y="20" class="tiny ink">24</text>
    <rect x="516" width="32" height="28" rx="14" fill="#2BB6A3"/><text x="562" y="20" class="tiny ink">32</text>
  </g>
  <text x="108" y="1116" class="small ink">Card padding</text><text x="330" y="1116" class="small muted">20–24</text>
  <text x="108" y="1152" class="small ink">Feature / REV padding</text><text x="330" y="1152" class="small muted">28–32</text>
  <text x="108" y="1188" class="small ink">Page gutters</text><text x="330" y="1188" class="small muted">16 mobile · 24 tablet · 32–40 desktop</text>
  <text x="108" y="1224" class="small ink">Section spacing</text><text x="330" y="1224" class="small muted">32 mobile · 48 tablet · 64 desktop</text>
  <text x="108" y="1260" class="small ink">Hero breathing space</text><text x="330" y="1260" class="small muted">64–96 when useful</text>
  <text x="108" y="1306" class="tiny teal">RULE: SCALE THE RHYTHM; DO NOT REDESIGN THE HIERARCHY PER DEVICE.</text>

  <!-- Radius -->
  <rect x="824" y="880" width="704" height="460" rx="28" class="panel" filter="url(#s1)"/>
  <text x="860" y="926" class="label teal">03 · RADIUS FAMILY</text>
  <text x="860" y="968" class="h2 deep">Intentional range, not one universal card</text>
  <g transform="translate(860 1022)">
    <rect width="112" height="92" rx="12" fill="#F1FAF8" stroke="#E6ECEB"/><text x="31" y="124" class="tiny ink">12 · COMPACT</text>
    <rect x="140" width="112" height="92" rx="14" fill="#F1FAF8" stroke="#E6ECEB"/><text x="166" y="124" class="tiny ink">14 · CONTROL</text>
    <rect x="280" width="112" height="92" rx="20" fill="#F1FAF8" stroke="#E6ECEB"/><text x="304" y="124" class="tiny ink">20 · STANDARD</text>
    <rect x="420" width="150" height="92" rx="32" fill="#E6FBF4" stroke="#BCE8CF"/><text x="452" y="124" class="tiny ink">32 · FEATURE</text>
  </g>
  <rect x="860" y="1207" width="190" height="52" rx="26" fill="#2BB6A3"/><text x="919" y="1239" class="tiny ink">PILL / CIRCLE</text>
  <text x="860" y="1306" class="tiny teal">CARDS MAY VARY BY FAMILY. CONTROLS STAY CONSISTENT.</text>

  <!-- Elevation -->
  <rect x="72" y="1380" width="1456" height="430" rx="28" class="panel" filter="url(#s1)"/>
  <text x="108" y="1426" class="label teal">04 · DEPTH &amp; WIDTH</text>
  <text x="108" y="1468" class="h2 deep">Whitespace + borders first. Shadow only when it communicates layer.</text>
  <g transform="translate(108 1522)">
    <rect width="280" height="150" rx="20" fill="#fff" stroke="#E6ECEB"/><text x="24" y="42" class="label deep">FLAT</text><text x="24" y="76" class="small muted">Border only</text><text x="24" y="108" class="tiny ink">Default cards / fields / Admin</text>
    <rect x="320" width="280" height="150" rx="20" fill="#fff" stroke="#E6ECEB" filter="url(#s1)"/><text x="344" y="42" class="label deep">RAISED</text><text x="344" y="76" class="small muted">2 / 8 / 6%</text><text x="344" y="108" class="tiny ink">Interactive / selected surfaces</text>
    <rect x="640" width="280" height="150" rx="20" fill="#fff" filter="url(#s2)"/><text x="664" y="42" class="label deep">FLOATING</text><text x="664" y="76" class="small muted">10 / 30 / 10%</text><text x="664" y="108" class="tiny ink">Nav / menu / popover</text>
    <rect x="960" width="300" height="150" rx="32" fill="#0F2024" stroke="#24434A"/><text x="984" y="42" class="label" fill="#E6F2EF">DARK MODE</text><text x="984" y="76" class="small" fill="#A8BCC0">Surface hierarchy beats shadow</text><text x="984" y="108" class="tiny" fill="#E6F2EF">Border + tone separation</text>
  </g>
  <text x="108" y="1740" class="small ink">General product max-width</text><text x="390" y="1740" class="num deep">1200px</text>
  <text x="580" y="1740" class="small ink">Reading width</text><text x="760" y="1740" class="num deep">680–760px</text>
  <text x="1015" y="1740" class="small ink">Focused forms</text><text x="1190" y="1740" class="num deep">560–680px</text>
  <text x="72" y="1860" class="tiny muted">Experimental confirmation artifact · Brand Studio v0.3 · does not become authority until Founder-approved and promoted.</text>
</svg>