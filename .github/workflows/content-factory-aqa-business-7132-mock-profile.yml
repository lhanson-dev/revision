name: Content Factory AQA Business 7132 Mock Profile

on:
  pull_request:
    branches: [main]
    paths:
      - '80-company-workflows/Content Factory Mock Exam Production.md'
      - 'docs/technical/Content Factory Mock Exam Production.md'
      - 'content-factory/mock-exams/aqa-7132/**'
      - 'research/aqa-business-7132/2027/**'
      - 'research/business-subject-foundation/**'
      - 'scripts/content-factory/load-business-subject-foundation-candidate-v08.mjs'
      - 'scripts/assurance/materialise-aqa-business-7132-course-exam-truth.mjs'
      - 'scripts/assurance/validate-aqa-business-7132-mock-profile.mjs'
      - 'scripts/assurance/plan-aqa-business-7132-mock-set.mjs'
      - '.github/workflows/content-factory-aqa-business-7132-mock-profile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: content-factory-aqa-business-7132-mock-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-mock-profile:
    name: Validate AQA 7132 Mock Profile + Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact ref
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.19.0 --no-audit --no-fund

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate current Course Truth, Exam Truth and Mock Profile
        run: node scripts/assurance/validate-aqa-business-7132-mock-profile.mjs

      - name: Build and validate deterministic three-paper mock plan
        run: node scripts/assurance/plan-aqa-business-7132-mock-set.mjs

      - name: Retain deterministic plan evidence
        uses: actions/upload-artifact@v6
        with:
          name: aqa-7132-deterministic-mock-plan-${{ github.sha }}
          path: .artifacts/content-factory-aqa-business-7132-mock-plan/mock-set-plan.json
          if-no-files-found: error
          retention-days: 90

      - name: Prove no provider key is required by this stage
        run: |
          test -z "${OPENAI_API_KEY:-}"
          echo "Mock Profile and deterministic mock-set planning are provider-free."
