name: LF-03 PR 794 Independent Attachment A3

on:
  pull_request:
    paths:
      - '.github/workflows/lf03-pr794-attachment-independent-a3.yml'
      - 'scripts/assurance/lf03-pr794-attachment-a3-review.mjs'
      - 'scripts/assurance/lf03-pr794-attachment-a3-review.node-check.mjs'
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: lf03-pr794-attachment-independent-a3
  cancel-in-progress: false

jobs:
  reviewer-contract:
    name: Trusted reviewer contract tests (no secrets)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test scripts/assurance/lf03-pr794-attachment-a3-review.node-check.mjs

  independent-a3:
    name: Trusted exact-head blind two-question A3
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 794 &&
      github.event.comment.user.login == 'lhanson-dev' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'revision-run-lf03-pr794-attachment-independent-a3:v1')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted approved main only
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: npm
      - name: Install trusted parser only
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate triggering identity and source-parser contract before provider spend
        run: node --test scripts/assurance/lf03-pr794-attachment-a3-review.node-check.mjs
      - name: Run fresh blinded source-to-AQA question challenge
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/assurance/lf03-pr794-attachment-a3-review.mjs
      - name: Preserve exact-head independent A3 receipt (30 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lf03-pr794-attachment-independent-a3-${{ github.run_id }}
          path: .artifacts/lf03-pr794-attachment-independent-a3/
          if-no-files-found: warn
          retention-days: 30
