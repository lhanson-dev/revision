name: Content Factory Foundation Assurance Proof

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: content-factory-foundation-assurance-proof
  cancel-in-progress: false

jobs:
  foundation-assurance-proof:
    name: Governed retained real-course Foundation assurance proof
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 289 &&
       github.event.comment.user.login == 'lhanson-dev' &&
       github.event.comment.author_association == 'OWNER' &&
       github.event.comment.body == 'revision-run-foundation-assurance-proof:v1')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_RUN_ID: '34017938933'
      SOURCE_ARTIFACT_ID: '9984534245'
      SOURCE_ARTIFACT_NAME: content-factory-foundation-live-proof-5734f266a551069b27ea9a158a37c7ef93db9bb6
      SOURCE_ARTIFACT_DIGEST: sha256:0b11868b48bfdbdeb5fd8db5fbca4378e62e227f37949347c97175e87aa2622a
      SOURCE_HEAD_SHA: 5734f266a551069b27ea9a158a37c7ef93db9bb6
      FOUNDATION_FINGERPRINT: 843eb478fb43585315b2ea38a69e1499abae10b1227e9bade54dc6117d272976
      SOURCE_PROOF_PATH: .artifacts/content-factory-foundation-assurance-source/aqa-a-level-business-7132-foundation-5734f266a551-1788677993717.json
    steps:
      - name: Checkout approved main
        uses: actions/checkout@v6

      - name: Verify retained source proof identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}")"
          actual_name="$(jq -r '.name' <<<"${artifact_json}")"
          actual_digest="$(jq -r '.digest' <<<"${artifact_json}")"
          actual_run_id="$(jq -r '.workflow_run.id' <<<"${artifact_json}")"
          actual_head_sha="$(jq -r '.workflow_run.head_sha' <<<"${artifact_json}")"
          test "${actual_name}" = "${SOURCE_ARTIFACT_NAME}"
          test "${actual_digest}" = "${SOURCE_ARTIFACT_DIGEST}"
          test "${actual_run_id}" = "${SOURCE_RUN_ID}"
          test "${actual_head_sha}" = "${SOURCE_HEAD_SHA}"

      - name: Download retained Foundation live proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .artifacts/content-factory-foundation-assurance-source
          gh run download "${SOURCE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "${SOURCE_ARTIFACT_NAME}" \
            --dir .artifacts/content-factory-foundation-assurance-source
          test -f "${SOURCE_PROOF_PATH}"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.19.0 --no-audit --no-fund

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run deterministic Foundation assurance proof
        env:
          CONTENT_FACTORY_FOUNDATION_ASSURANCE_PROOF: '1'
          CONTENT_FACTORY_FOUNDATION_SOURCE_PROOF_PATH: ${{ env.SOURCE_PROOF_PATH }}
          CONTENT_FACTORY_FOUNDATION_SOURCE_HEAD_SHA: ${{ env.SOURCE_HEAD_SHA }}
          CONTENT_FACTORY_FOUNDATION_FINGERPRINT: ${{ env.FOUNDATION_FINGERPRINT }}
          CONTENT_FACTORY_FOUNDATION_SOURCE_RUN_ID: ${{ env.SOURCE_RUN_ID }}
          CONTENT_FACTORY_FOUNDATION_SOURCE_ARTIFACT_ID: ${{ env.SOURCE_ARTIFACT_ID }}
          CONTENT_FACTORY_FOUNDATION_SOURCE_ARTIFACT_NAME: ${{ env.SOURCE_ARTIFACT_NAME }}
          CONTENT_FACTORY_FOUNDATION_SOURCE_ARTIFACT_DIGEST: ${{ env.SOURCE_ARTIFACT_DIGEST }}
          CONTENT_FACTORY_REVIEWED_COMMIT: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npx vitest run src/content-factory/foundation-assurance-proof.integration.test.ts --reporter=verbose

      - name: Upload deterministic Foundation assurance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-factory-foundation-assurance-proof-${{ github.sha }}
          path: .artifacts/content-factory-foundation-assurance-proof/
          if-no-files-found: warn
          retention-days: 30
