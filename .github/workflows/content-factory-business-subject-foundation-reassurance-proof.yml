name: Content Factory Business Subject Foundation Targeted Reassurance Proof

on:
  workflow_dispatch:
    inputs:
      reviewed_main_sha:
        description: Exact current main SHA containing the current remediated Business candidate
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: content-factory-business-subject-foundation-reassurance-proof
  cancel-in-progress: false

jobs:
  business-subject-foundation-reassurance:
    name: Incremental Business subject-foundation reassurance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Normalize reviewed main SHA
        id: normalize-reviewed-main-sha
        env:
          RAW_REVIEWED_MAIN_SHA: ${{ inputs.reviewed_main_sha }}
        run: |
          set -euo pipefail
          reviewed_main_sha="$(printf '%s' "${RAW_REVIEWED_MAIN_SHA}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [[ ! "${reviewed_main_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "reviewed_main_sha must resolve to exactly 40 lowercase hexadecimal characters after trimming surrounding whitespace" >&2
            exit 1
          fi
          printf 'sha=%s\n' "${reviewed_main_sha}" >> "${GITHUB_OUTPUT}"

      - name: Checkout exact reviewed main
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.normalize-reviewed-main-sha.outputs.sha }}

      - name: Verify exact current main identity
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_MAIN_SHA: ${{ steps.normalize-reviewed-main-sha.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${REVIEWED_MAIN_SHA}"
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "${current_main}" = "${REVIEWED_MAIN_SHA}"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.19.0 --no-audit --no-fund

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Revalidate v0.6 promotion provenance and three-node scope
        run: node scripts/assurance/validate-business-subject-provenance.mjs

      - name: Validate v0.6 reassurance package contract
        run: node scripts/assurance/business-subject-foundation-reassurance.mjs --self-test

      - name: Recover exact-SHA reassurance state
        id: recover-reassurance
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_MAIN_SHA: ${{ steps.normalize-reviewed-main-sha.outputs.sha }}
        run: |
          set -euo pipefail
          echo 'mode=fresh' >> "${GITHUB_OUTPUT}"
          artifact_name="content-factory-business-subject-foundation-reassurance-${REVIEWED_MAIN_SHA}"
          artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${artifact_name}&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].id // empty')"
          if [ -z "${artifact_id}" ]; then
            echo "No previous exact-SHA reassurance artifact found; starting from governed retained assurance."
            exit 0
          fi

          mkdir -p .reassurance-resume/checkpoint .artifacts/content-factory-business-subject-foundation-reassurance
          gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > .reassurance-resume/checkpoint.zip
          unzip -q .reassurance-resume/checkpoint.zip -d .reassurance-resume/checkpoint

          expected_fingerprint="$(node --input-type=module -e "import { loadBusinessSubjectFoundationCandidate } from './scripts/content-factory/load-business-subject-foundation-candidate-v06.mjs'; const c = await loadBusinessSubjectFoundationCandidate(); process.stdout.write(c.fingerprint)")"
          terminal_file="$(find .reassurance-resume/checkpoint -type f -name 'business-subject-foundation-reassurance.json' -print -quit)"
          if [ -n "${terminal_file}" ] \
            && jq -e --arg sha "${REVIEWED_MAIN_SHA}" --arg fp "${expected_fingerprint}" \
              '.reviewedMainSha == $sha and .candidateFingerprint == $fp and (.finalDecision == "pass" or .finalDecision == "fail_hold")' \
              "${terminal_file}" >/dev/null; then
            cp "${terminal_file}" .artifacts/content-factory-business-subject-foundation-reassurance/business-subject-foundation-reassurance.json
            summary_file="$(find .reassurance-resume/checkpoint -type f -name 'business-subject-foundation-reassurance-summary.json' -print -quit)"
            if [ -n "${summary_file}" ]; then
              cp "${summary_file}" .artifacts/content-factory-business-subject-foundation-reassurance/business-subject-foundation-reassurance-summary.json
            fi
            decision="$(jq -r '.finalDecision' "${terminal_file}")"
            echo 'mode=terminal' >> "${GITHUB_OUTPUT}"
            echo "Reusing terminal exact-fingerprint ${decision} evidence from artifact ${artifact_id}; no provider call will be repeated."
            exit 0
          fi

          resume_file="$(find .reassurance-resume/checkpoint -type f -name 'business-subject-foundation-reassurance-cost-paused.json' -print -quit)"
          if [ -z "${resume_file}" ]; then
            echo "Latest exact-SHA artifact contains no reusable terminal decision or cost-pause checkpoint; execution may retry."
            exit 0
          fi
          echo "CONTENT_FACTORY_REASSURANCE_RESUME_FILE=${resume_file}" >> "${GITHUB_ENV}"
          echo 'mode=resume' >> "${GITHUB_OUTPUT}"
          echo "Recovered exact-SHA cost-pause checkpoint from artifact ${artifact_id}. The runner will revalidate its candidate fingerprint and accepted outputs before reuse."

      - name: Run outstanding reassurance and final integration check
        if: steps.recover-reassurance.outputs.mode != 'terminal'
        env:
          CONTENT_FACTORY_BUSINESS_SUBJECT_REASSURANCE: '1'
          REVISION_REVIEWED_MAIN_SHA: ${{ steps.normalize-reviewed-main-sha.outputs.sha }}
          CONTENT_FACTORY_REASSURANCE_MODEL: gpt-5.6-terra
          CONTENT_FACTORY_MAX_SPEND_USD: '5'
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/assurance/business-subject-foundation-reassurance.mjs

      - name: Reuse terminal reassurance decision
        if: steps.recover-reassurance.outputs.mode == 'terminal'
        run: |
          set -euo pipefail
          decision="$(jq -r '.finalDecision' .artifacts/content-factory-business-subject-foundation-reassurance/business-subject-foundation-reassurance.json)"
          cumulative="$(jq -r '.cumulativeObservedSpendUsd // .observedSpendUsd // 0' .artifacts/content-factory-business-subject-foundation-reassurance/business-subject-foundation-reassurance.json)"
          {
            echo '## Business Subject Foundation v0.6 reassurance'
            echo
            echo "- Existing exact-fingerprint terminal decision reused: **${decision^^}**"
            echo '- Provider calls repeated: **0**'
            echo "- Recorded cumulative reassurance spend: **$${cumulative}**"
          } >> "${GITHUB_STEP_SUMMARY}"
          if [ "${decision}" = 'fail_hold' ]; then
            echo 'Exact-fingerprint educational FAIL/HOLD is unchanged; refusing to repurchase the same review.' >&2
            exit 1
          fi

      - name: Upload reassurance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-factory-business-subject-foundation-reassurance-${{ steps.normalize-reviewed-main-sha.outputs.sha }}
          path: .artifacts/content-factory-business-subject-foundation-reassurance/
          if-no-files-found: warn
          retention-days: 30
