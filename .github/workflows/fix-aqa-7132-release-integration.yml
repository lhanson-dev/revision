name: Fix AQA 7132 release integration contracts

on:
  push:
    branches:
      - release/aqa-7132-fast-path-content
    paths:
      - .github/workflows/fix-aqa-7132-release-integration.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Preserve authored content and layer Fast-Path content
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1

          # Preserve the pre-existing rich authored Learn pages verbatim.
          git show origin/main:content/business/aqa-a-level/shared/learn.ts > content/business/aqa-a-level/shared/authored-learn.ts

          # Keep the canonical pack-level flashcard contract unchanged.
          for paper in paper-1 paper-2 paper-3; do
            git show "origin/main:content/business/aqa-a-level/${paper}/index.ts" > "content/business/aqa-a-level/${paper}/index.ts"
          done

          python <<'PY'
          from pathlib import Path

          learn = Path('content/business/aqa-a-level/shared/learn.ts')
          text = learn.read_text()
          if "import { learn as authoredLearn } from './authored-learn'" not in text:
            text = text.replace("import type { LearnBlock, LearnChapter, LearnCourse, LearnPage } from '../../../learn-schema'\n", "import type { LearnBlock, LearnChapter, LearnCourse, LearnPage } from '../../../learn-schema'\nimport { learn as authoredLearn } from './authored-learn'\n", 1)
          text = text.replace('export const learn: LearnCourse = {', 'const fastPathLearn: LearnCourse = {', 1)
          if 'export const learn: LearnCourse = {' not in text:
            text += """

export const learn: LearnCourse = {
  chapters: topicOrder.map((topicId): LearnChapter => {
    const authored = authoredLearn.chapters.find((chapter) => chapter.topicId === topicId)
    const fastPath = fastPathLearn.chapters.find((chapter) => chapter.topicId === topicId)
    return {
      id: topicId,
      topicId,
      title: fastPath?.title ?? authored?.title ?? topicTitles[topicId],
      groups: [...(authored?.groups ?? []), ...(fastPath?.groups ?? [])],
    }
  }).filter((chapter) => chapter.groups.length > 0),
}
"""
          learn.write_text(text)

          workspace = Path('src/app/FocusedLearningWorkspace.tsx')
          text = workspace.read_text()
          import_anchor = "import type { LearningContentAdapter } from '../engine/content/content-adapter'\n"
          import_line = "import { fastPathFlashcards } from '../../content/business/aqa-a-level/shared/fast-path-flashcards'\n"
          if import_line not in text:
            text = text.replace(import_anchor, import_anchor + import_line, 1)
          old = "  const cards = useMemo(() => adapter.listFlashcards(topicId), [adapter, topicId])"
          new = """  const cards = useMemo(() => {
    const curated = adapter.listFlashcards(topicId)
    if (adapter.manifest.examBoard.id !== 'aqa' || adapter.manifest.specificationCode !== '7132') return curated
    return [...curated, ...fastPathFlashcards.filter((card) => card.topic === topicId)]
  }, [adapter, topicId])"""
          if old not in text and new not in text:
            raise SystemExit('FocusedLearningWorkspace flashcard anchor not found')
          text = text.replace(old, new, 1)
          workspace.write_text(text)

          test = Path('content/business/aqa-a-level/shared/fast-path-release.test.ts')
          text = test.read_text()
          old = """    const pages = learn.chapters.flatMap((chapter) => chapter.groups.flatMap((group) => group.pages))
    expect(pages).toHaveLength(79)
    expect(new Set(pages.map((page) => page.id)).size).toBe(79)
    expect(pages.every((page) => page.blocks.length > 0)).toBe(true)"""
          new = """    const pages = learn.chapters.flatMap((chapter) => chapter.groups.flatMap((group) => group.pages))
    const fastPathPages = pages.filter((page) => page.id.startsWith('bus-'))
    expect(fastPathPages).toHaveLength(79)
    expect(new Set(fastPathPages.map((page) => page.id)).size).toBe(79)
    expect(fastPathPages.every((page) => page.blocks.length > 0)).toBe(true)
    expect(pages.some((page) => page.id === 'limited-companies-and-shareholders')).toBe(true)
    expect(pages.some((page) => page.id === 'understanding-break-even')).toBe(true)"""
          if old not in text:
            raise SystemExit('Fast-Path release test anchor not found')
          test.write_text(text.replace(old, new, 1))

          doc = Path('docs/technical/AQA Business 7132 Fast-Path T12 Website Release.md')
          text = doc.read_text()
          text = text.replace('all 79 exact-course AQA 7132 teaching nodes projected from the 81-node reusable Business Foundation, adapted into the existing reading-first Learn page structure.', 'all 79 exact-course AQA 7132 teaching nodes projected from the 81-node reusable Business Foundation, layered into the existing reading-first Learn structure while preserving the richer curated pages already approved on the site.')
          text = text.replace('the Foundation-native guided-practice items for those exact-course nodes, added to the existing Practice reveal-and-rate flow without removing the existing curated flashcards.', 'the Foundation-native guided-practice items for those exact-course nodes, added at the learner workspace layer so the existing 100-card pack contract and curated flashcards remain unchanged.')
          doc.write_text(text)
          PY

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.19.0 --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run affected contracts
        run: npx vitest run content/business/aqa-a-level/shared/fast-path-release.test.ts content/business/aqa-a-level/content.test.ts src/engine/content/content-adapter.test.ts --reporter=verbose

      - name: Typecheck and build
        run: |
          npm run typecheck
          npm run build

      - name: Commit verified integration fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-aqa-7132-release-integration.yml
          git add content/business/aqa-a-level/shared/authored-learn.ts content/business/aqa-a-level/shared/learn.ts content/business/aqa-a-level/shared/fast-path-release.test.ts content/business/aqa-a-level/paper-1/index.ts content/business/aqa-a-level/paper-2/index.ts content/business/aqa-a-level/paper-3/index.ts src/app/FocusedLearningWorkspace.tsx docs/technical/'AQA Business 7132 Fast-Path T12 Website Release.md'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve learner contracts in AQA 7132 release'
          git push origin HEAD:release/aqa-7132-fast-path-content
