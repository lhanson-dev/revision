name: Temporary run-log history repair

on:
  pull_request:
    paths:
      - 'content-factory/RUN_LOG.md'
      - '.github/workflows/tmp-run-log-history-fix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - name: Restore exact historical sentence
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('content-factory/RUN_LOG.md')
          text = p.read_text()
          old = 'or sources do not directly state it directly; nothing taught is wrong or missing'
          new = 'or sources do not directly state it; nothing taught is wrong or missing'
          if text.count(old) != 1:
              raise SystemExit(f'expected one historical typo, found {text.count(old)}')
          p.write_text(text.replace(old, new))
          PY
          git config user.name "revision-governance"
          git config user.email "revision-governance@users.noreply.github.com"
          git add content-factory/RUN_LOG.md
          git commit -m "Restore exact run-log history"
          git push origin HEAD:${{ github.head_ref }}
