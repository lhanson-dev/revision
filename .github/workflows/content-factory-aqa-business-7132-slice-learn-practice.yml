name: Content Factory AQA Business 7132 Slice Learn and Practice

# Step 5b of the plan: Learn + Practice for one slice (first slice: AQA 7132 section 3.5), under the fast-path rules.
# Software proves what it can (arithmetic, coverage of named items, required treatments), then one fixed-checklist AI review per node.
# Live spend is capped and only runs from main, after merge.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: content-factory-aqa-business-7132-slice-learn-practice
  cancel-in-progress: false

jobs:
  slice-learn-practice:
    name: Generate, prove and review Learn and Practice for the slice
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact approved main
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.19.0 --no-audit --no-fund

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate, prove and review the slice
        env:
          CONTENT_FACTORY_AQA_7132_SLICE_LEARN_PRACTICE: '1'
          CONTENT_FACTORY_SLICE_REVIEWED_COMMIT: ${{ github.sha }}
          CONTENT_FACTORY_MAX_SPEND_USD: '6'
          CONTENT_FACTORY_GENERATION_MODEL: gpt-5.6-terra
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npx vitest run scripts/assurance/aqa-business-7132-slice-learn-practice.test.ts --reporter=verbose

      - name: Upload slice evidence and generated assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-factory-aqa-business-7132-slice-3-5-learn-practice-${{ github.sha }}
          path: .artifacts/content-factory-aqa-business-7132-slice-3.5-learn-practice/
          if-no-files-found: warn
          retention-days: 30
