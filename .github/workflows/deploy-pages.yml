name: Deploy Revision to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite learner app
        run: npm run build

      - name: Preserve current public and legacy routes during migration
        run: |
          cp index.html dist/index.html
          cp -R subjects dist/subjects
          touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  production-smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed root and React app
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}/"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 "${base}" -o /tmp/root.html
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 "${base}app/" -o /tmp/app.html
          grep -q '<div id="root"></div>' /tmp/app.html
          grep -Eq '/revision/assets/[^" ]+\.js' /tmp/app.html
          if grep -q '/src/main.tsx' /tmp/app.html; then
            echo 'Production /app/ is still serving source TypeScript instead of the Vite build.' >&2
            exit 1
          fi
          echo "Production Pages smoke passed for ${base} and ${base}app/"
