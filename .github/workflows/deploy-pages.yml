name: Deploy Revision to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SUPABASE_URL: https://xwwhshpmeogswxfjtpvq.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_N4uw63Yo5_dHLo04C5Tw_g_o8OMXTmG
  EXPECTED_BACKEND_CONTRACT: planner-v1

jobs:
  backend-readiness:
    name: Production backend readiness
    runs-on: ubuntu-latest
    steps:
      - name: Verify database release contract
        run: |
          set -euo pipefail

          response="$(curl --fail --silent --show-error \
            --request POST \
            --header "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            --header "Content-Type: application/json" \
            --data '{}' \
            "${SUPABASE_URL}/rest/v1/rpc/revision_release_readiness")"

          contract="$(jq -r '.contract // empty' <<<"$response")"
          ready="$(jq -r '.ready // false' <<<"$response")"

          if [ "$contract" != "$EXPECTED_BACKEND_CONTRACT" ]; then
            echo "Production database contract mismatch. Expected ${EXPECTED_BACKEND_CONTRACT}, got ${contract:-missing}." >&2
            echo "$response" >&2
            exit 1
          fi

          if [ "$ready" != "true" ]; then
            echo 'Production database is missing one or more required Revision capabilities.' >&2
            echo "$response" >&2
            exit 1
          fi

          echo "Production database contract ${contract} is ready."

      - name: Verify protected planner operations function is deployed
        run: |
          set -euo pipefail

          status="$(curl --silent --show-error \
            --request POST \
            --header "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            --output /tmp/planner-operations-response.txt \
            --write-out '%{http_code}' \
            "${SUPABASE_URL}/functions/v1/planner-operations")"

          if [ "$status" != "401" ]; then
            echo "Expected protected planner-operations to reject an unauthenticated request with 401; received ${status}." >&2
            cat /tmp/planner-operations-response.txt >&2 || true
            exit 1
          fi

          echo 'Protected planner-operations Edge Function is deployed and requires authentication.'

  build:
    needs: backend-readiness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'

      - name: Pin npm
        run: npm install --global npm@11.19.0 --no-audit --no-fund

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build Vite learner app
        run: npm run build

      - name: Publish root redirect
        run: |
          cp index.html dist/index.html
          touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  production-smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify canonical React app and legacy retirement
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}/"

          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 "${base}" -o /tmp/root.html
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 "${base}app/" -o /tmp/app.html

          grep -q 'data-revision-redirect="app"' /tmp/root.html
          grep -q './app/' /tmp/root.html
          grep -q '<div id="root"></div>' /tmp/app.html
          grep -Eq '/revision/assets/[^" ]+\.js' /tmp/app.html

          if grep -q '/src/main.tsx' /tmp/app.html; then
            echo 'Production /app/ is still serving source TypeScript instead of the Vite build.' >&2
            exit 1
          fi

          legacy_status="$(curl --silent --output /dev/null --write-out '%{http_code}' "${base}subjects/business/aqa-as/paper-2/")"
          root_asset_status="$(curl --silent --output /dev/null --write-out '%{http_code}' "${base}assets/home.css")"

          test "$legacy_status" = "404"
          test "$root_asset_status" = "404"

          echo "Production cutover smoke passed: ${base} redirects to ${base}app/, React assets are built, and legacy learner routes are retired."
