name: Deploy Revision to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'

      - name: Pin npm
        run: npm install --global npm@11.19.0 --no-audit --no-fund

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build Vite learner app
        run: npm run build

      - name: Publish root redirect
        run: |
          cp index.html dist/index.html
          touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  production-smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify canonical React app and legacy retirement
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}/"

          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 "${base}" -o /tmp/root.html
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 "${base}app/" -o /tmp/app.html

          grep -q 'data-revision-redirect="app"' /tmp/root.html
          grep -q './app/' /tmp/root.html
          grep -q '<div id="root"></div>' /tmp/app.html
          grep -Eq '/revision/assets/[^" ]+\.js' /tmp/app.html

          if grep -q '/src/main.tsx' /tmp/app.html; then
            echo 'Production /app/ is still serving source TypeScript instead of the Vite build.' >&2
            exit 1
          fi

          legacy_status="$(curl --silent --output /dev/null --write-out '%{http_code}' "${base}subjects/business/aqa-as/paper-2/")"
          root_asset_status="$(curl --silent --output /dev/null --write-out '%{http_code}' "${base}assets/home.css")"

          test "$legacy_status" = "404"
          test "$root_asset_status" = "404"

          echo "Production cutover smoke passed: ${base} redirects to ${base}app/, React assets are built, and legacy learner routes are retired."
