name: Bootstrap package lock

on:
  push:
    branches:
      - agent/stabilise-foundation

permissions:
  contents: write

jobs:
  bootstrap-lockfile:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/stabilise-foundation
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
      - name: Pin npm
        run: npm install --global npm@11.19.0 --no-audit --no-fund
      - name: Generate lockfile from pinned toolchain
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo 'package-lock.json already matches the pinned dependency resolution.'
            exit 0
          fi
          git config user.name 'revision-foundation-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Add deterministic package lock'
          git push origin HEAD:agent/stabilise-foundation
