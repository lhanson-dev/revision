name: Temporary retain AQA 7132 current learning evidence

on:
  push:
    branches:
      - retain/aqa-7132-current-learning-evidence

permissions:
  actions: read
  contents: write

jobs:
  retain:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout retention branch
        uses: actions/checkout@v6
        with:
          ref: retain/aqa-7132-current-learning-evidence
          fetch-depth: 0

      - name: Download exact retained artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 37105222475 --repo "$GITHUB_REPOSITORY" --name 'content-factory-aqa-business-7132-exact-course-assurance-proof-8e7f881f237e20a0a424476b6d093a1741b89005' --dir /tmp/t8
          gh run download 37106502134 --repo "$GITHUB_REPOSITORY" --name 'content-factory-aqa-business-7132-learn-practice-3.1-3.2-8e7f881f237e20a0a424476b6d093a1741b89005' --dir /tmp/lp31
          gh run download 37106518912 --repo "$GITHUB_REPOSITORY" --name 'content-factory-aqa-business-7132-learn-practice-3.4-8e7f881f237e20a0a424476b6d093a1741b89005' --dir /tmp/lp34
          gh run download 37106529775 --repo "$GITHUB_REPOSITORY" --name 'content-factory-aqa-business-7132-learn-practice-3.10-8e7f881f237e20a0a424476b6d093a1741b89005' --dir /tmp/lp310

      - name: Retain exact successful evidence and refreshed assets
        run: |
          set -euo pipefail

          install -m 0644 /tmp/t8/ledger.json content-factory/runs/aqa-7132-course-gate/ledger.json
          install -m 0644 /tmp/t8/summary.json content-factory/runs/aqa-7132-course-gate/summary.json

          for batch in 3.1-3.2 3.4 3.10; do
            src="/tmp/lp${batch//./}"
            case "$batch" in
              3.1-3.2) src=/tmp/lp31 ;;
              3.4) src=/tmp/lp34 ;;
              3.10) src=/tmp/lp310 ;;
            esac
            install -m 0644 "$src/SUMMARY.md" "content-factory/runs/aqa-7132-slice-$batch/SUMMARY.md"
            install -m 0644 "$src/ledger.json" "content-factory/runs/aqa-7132-slice-$batch/ledger.json"
            install -m 0644 "$src/slice-learn-practice-proof.json" "content-factory/runs/aqa-7132-slice-$batch/slice-learn-practice-proof.json"
          done

          install -m 0644 /tmp/lp31/assets/bus-ext-001.json content-factory/slices/aqa-7132-3.1-3.2/learn-practice/bus-ext-001.json
          install -m 0644 /tmp/lp31/assets/bus-fnd-001.json content-factory/slices/aqa-7132-3.1-3.2/learn-practice/bus-fnd-001.json
          install -m 0644 /tmp/lp31/assets/bus-fnd-005.json content-factory/slices/aqa-7132-3.1-3.2/learn-practice/bus-fnd-005.json
          install -m 0644 /tmp/lp31/assets/bus-fnd-009.json content-factory/slices/aqa-7132-3.1-3.2/learn-practice/bus-fnd-009.json
          install -m 0644 /tmp/lp34/assets/bus-ops-001.json content-factory/slices/aqa-7132-3.4/learn-practice/bus-ops-001.json
          install -m 0644 /tmp/lp310/assets/bus-evi-008.json content-factory/slices/aqa-7132-3.10/learn-practice/bus-evi-008.json
          install -m 0644 /tmp/lp310/assets/bus-str-009.json content-factory/slices/aqa-7132-3.10/learn-practice/bus-str-009.json

      - name: Update exact-fingerprint reuse regression
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/assurance/aqa-business-7132-learn-practice-resume-targets.test.ts')
          text = path.read_text()
          text = text.replace("it('proves only the exact dependants changed by the current governed fixes are stale'", "it('proves the retained targeted refresh assets are exact-fingerprint reusable'")
          text = text.replace("stale: ['bus-ext-001', 'bus-fnd-001', 'bus-fnd-005', 'bus-fnd-009'],", "stale: [],")
          text = text.replace("stale: ['bus-ops-001'],", "stale: [],")
          text = text.replace("stale: ['bus-evi-008', 'bus-str-009'],", "stale: [],")
          path.write_text(text)
          PY

      - name: Verify retained files match downloaded artifact bytes
        run: |
          set -euo pipefail
          cmp /tmp/t8/ledger.json content-factory/runs/aqa-7132-course-gate/ledger.json
          cmp /tmp/t8/summary.json content-factory/runs/aqa-7132-course-gate/summary.json
          cmp /tmp/lp31/assets/bus-ext-001.json content-factory/slices/aqa-7132-3.1-3.2/learn-practice/bus-ext-001.json
          cmp /tmp/lp31/assets/bus-fnd-001.json content-factory/slices/aqa-7132-3.1-3.2/learn-practice/bus-fnd-001.json
          cmp /tmp/lp31/assets/bus-fnd-005.json content-factory/slices/aqa-7132-3.1-3.2/learn-practice/bus-fnd-005.json
          cmp /tmp/lp31/assets/bus-fnd-009.json content-factory/slices/aqa-7132-3.1-3.2/learn-practice/bus-fnd-009.json
          cmp /tmp/lp34/assets/bus-ops-001.json content-factory/slices/aqa-7132-3.4/learn-practice/bus-ops-001.json
          cmp /tmp/lp310/assets/bus-evi-008.json content-factory/slices/aqa-7132-3.10/learn-practice/bus-evi-008.json
          cmp /tmp/lp310/assets/bus-str-009.json content-factory/slices/aqa-7132-3.10/learn-practice/bus-str-009.json

      - name: Commit retained evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content-factory/runs/aqa-7132-course-gate/ledger.json \
                  content-factory/runs/aqa-7132-course-gate/summary.json \
                  content-factory/runs/aqa-7132-slice-3.1-3.2 \
                  content-factory/runs/aqa-7132-slice-3.4 \
                  content-factory/runs/aqa-7132-slice-3.10 \
                  content-factory/slices/aqa-7132-3.1-3.2/learn-practice/bus-ext-001.json \
                  content-factory/slices/aqa-7132-3.1-3.2/learn-practice/bus-fnd-001.json \
                  content-factory/slices/aqa-7132-3.1-3.2/learn-practice/bus-fnd-005.json \
                  content-factory/slices/aqa-7132-3.1-3.2/learn-practice/bus-fnd-009.json \
                  content-factory/slices/aqa-7132-3.4/learn-practice/bus-ops-001.json \
                  content-factory/slices/aqa-7132-3.10/learn-practice/bus-evi-008.json \
                  content-factory/slices/aqa-7132-3.10/learn-practice/bus-str-009.json \
                  scripts/assurance/aqa-business-7132-learn-practice-resume-targets.test.ts
          git diff --cached --quiet && { echo 'No retained changes'; exit 1; }
          git commit -m 'Retain current AQA 7132 learning refresh evidence'
          git push origin HEAD:retain/aqa-7132-current-learning-evidence
