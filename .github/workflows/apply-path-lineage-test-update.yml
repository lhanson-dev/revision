name: Apply path lineage browser test update

on:
  push:
    branches:
      - agent/close-assurance-foundation-gaps

permissions:
  contents: write

jobs:
  update-path-lineage-test:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/close-assurance-foundation-gaps
      - name: Update Admin path-to-live fixture and assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/e2e/admin-operations.spec.ts')
          text = path.read_text()
          old_check = "            { id: 'deployment', label: 'Deployment', status: 'Healthy', detail: 'Latest main deployment and production smoke passed for abc1234.' },"
          new_check = old_check + "\n            { id: 'path-to-live', label: 'Path to live', status: 'Unknown', detail: 'PR #64 exact-head CI and production deployment are green, but no Founder approval marker is recorded for head abc1234.' },"
          old_assert = "  await expect(page.getByText('Exact-head CI correlation for the deployed revision is still not implemented')).toBeVisible()"
          new_assert = "  await expect(page.getByText('no Founder approval marker is recorded')).toBeVisible()"
          if text.count(old_check) != 1:
              raise SystemExit(f'Expected one deployment fixture target, found {text.count(old_check)}')
          if text.count(old_assert) != 1:
              raise SystemExit(f'Expected one path assertion target, found {text.count(old_assert)}')
          path.write_text(text.replace(old_check, new_check).replace(old_assert, new_assert))
          PY
      - name: Commit update
        run: |
          set -euo pipefail
          git config user.name 'revision-foundation-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tests/e2e/admin-operations.spec.ts
          git commit -m 'Test correlated path-to-live Unknown state'
          git push origin HEAD:agent/close-assurance-foundation-gaps
