name: Reconcile verified assurance evidence

on:
  push:
    branches:
      - agent/close-assurance-foundation-gaps

permissions:
  contents: write

jobs:
  reconcile-assurance-evidence:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/close-assurance-foundation-gaps
      - name: Reconcile verified evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one guarded target, found {count}: {old[:120]!r}')
              target.write_text(text.replace(old, new))

          replace_once(
              'tests/e2e/admin-operations.spec.ts',
              """  await expect(page.getByText('0 P0 · 0 P1 · 2 P2 open')).toBeVisible()
  await expect(page.getByRole('heading', { name: 'Defects' })).toBeVisible()
  await expect(page.getByText('DEF-2026-001')).toBeVisible()
  await expect(page.getByText('signed-in global and learner-runtime account/menu drawers', { exact: false })).toBeVisible()
  await expect(page.getByText('DEF-2026-002')).toBeVisible()
  await expect(page.getByText('learner-runtime desktop primary navigation', { exact: false })).toBeVisible()""",
              """  await expect(page.getByText('0 P0 · 0 P1 · 0 P2 open')).toBeVisible()
  await expect(page.getByRole('heading', { name: 'Defects' })).toBeVisible()
  await expect(page.getByText('No known open P0/P1/P2 defects')).toBeVisible()
  await expect(page.getByText('DEF-2026-001')).toHaveCount(0)
  await expect(page.getByText('DEF-2026-002')).toHaveCount(0)""",
          )

          register = '90-governance-registers/Assurance Coverage Register.md'
          replacements = {
              "| ADM-01 | Database-approved admin receives protected Admin experience | High | Browser + server/data boundary | `tests/e2e/admin-operations.spec.ts`, `tests/e2e/app-responsive.spec.ts`, protected Edge implementation | Partial | Add repeatable Edge Function 401/403/admin-success integration evidence |":
              "| ADM-01 | Database-approved admin receives protected Admin experience | High | Browser + server/data boundary | `tests/e2e/admin-operations.spec.ts`; `tests/integration/edge-operations.test.ts`; repository `admin-operations` source served against isolated Supabase | Covered | Retain browser presentation plus unauthenticated, ordinary-user and database-authorised-admin server-boundary assertions |",
              "| ADM-02 | Founder Assurance view truthfully exposes governed coverage and Unknown states | High | Unit + browser | `src/assurance/coverage-register.test.ts`; `tests/e2e/admin-operations.spec.ts` | Covered at UI/projection layer | Add protected dynamic CI/defect evidence sources without weakening Unknown truthfulness |":
              "| ADM-02 | Founder Assurance view truthfully exposes governed coverage and Unknown states | High | Unit + browser | coverage + defect register parsers/tests; `tests/e2e/admin-operations.spec.ts`; protected `admin-operations` dynamic path-to-live evidence | Covered | Retain fail-closed Unknown behaviour when governed register or dynamic lineage evidence is unavailable |",
              "| JRN-04 | Practice journey and evidence creation | High | Browser + persistence integration | Browser coverage reaches Practice; unit evidence engine exists | Partial | Add an end-to-end practice completion that verifies evidence is persisted/reloaded |":
              "| JRN-04 | Practice journey and evidence creation | High | Browser + persistence integration | `tests/e2e/database-persistence.spec.ts`; authenticated service integration; evidence engine/unit coverage | Covered | Retain real Practice save → browser reload assertions as evidence schema and UI evolve |",
              "| JRN-06 | Progress review from persisted learner evidence | High | Browser + persistence integration | Engine/unit coverage and UI presence exist | Partial | Add deterministic persisted-evidence → Progress display E2E/integration coverage |":
              "| JRN-06 | Progress review from persisted learner evidence | High | Browser + persistence integration | `tests/e2e/database-persistence.spec.ts`; progress/evidence unit coverage | Covered | Retain database-backed reload → Progress reconstruction assertion |",
              "| JRN-07 | Adaptive planner setup, deterministic prioritisation, constrained-time mode and replanning context | High | Unit + responsive browser + persistence integration | `src/engine/planning/planning.test.ts`, `src/app/planner-model.test.ts`, `tests/e2e/app-responsive.spec.ts`, database RLS CI | Partial | RLS ownership is automated; add database-backed planner setup/reload/replan integration evidence |":
              "| JRN-07 | Adaptive planner setup, deterministic prioritisation, constrained-time mode and replanning context | High | Unit + responsive browser + persistence integration | planning/model unit tests; responsive planner browser journey; `tests/integration/supabase-persistence.test.ts`; database/RLS CI | Covered | Retain persisted planner-state reload → deterministic replanning and learner-priority reason assertions |",
              "| DATA-02 | Learner evidence persists and reloads safely | Critical | Integration + browser | Persistence implementation/unit coverage plus automated RLS ownership evidence | Partial | Add a repeatable browser/client database-backed persistence and reload journey |":
              "| DATA-02 | Learner evidence persists and reloads safely | Critical | Integration + browser | authenticated `supabase-persistence` integration plus `tests/e2e/database-persistence.spec.ts` against isolated Supabase | Covered | Retain service round-trip, cross-user isolation and real browser reload evidence |",
              "| DATA-04 | Planner assessments, availability, bounded preferences and activity events remain learner-owned and planning context does not become mastery evidence | Critical | Database/RLS + domain integration | `supabase/tests/database-assurance.test.sql`; planner engine/service separation | Partial | RLS ownership is automated; add database-backed ownership/reload integration and retain domain separation coverage |":
              "| DATA-04 | Planner assessments, availability, bounded preferences and activity events remain learner-owned and planning context does not become mastery evidence | Critical | Database/RLS + domain integration | pgTAP RLS assurance; `tests/integration/supabase-persistence.test.ts`; deterministic planner/domain tests and service separation | Covered | Retain cross-user rejection plus reloaded preference → planner reason assertions without converting planning context into learning evidence |",
              "| SEC-02 | Admin operations re-authorise server-side before service-role use | Critical | Integration | Edge Function implementation; browser mocks exercise presentation | Partial | Add Edge Function integration tests for 401/403/admin-success paths |":
              "| SEC-02 | Admin operations re-authorise server-side before service-role use | Critical | Integration | `tests/integration/edge-operations.test.ts` against repository `admin-operations` source and isolated Supabase | Covered | Retain 401 unauthenticated, 403 ordinary-user and authorised-admin success assertions |",
              "| SEC-04 | Planner assurance aggregates re-authorise server-side and do not expose cross-user planner rows to browser roles | Critical | SQL/integration + protected server boundary | planner aggregate execution denied to browser role in database CI; `planner-operations` implementation | Partial | Add repeatable 401/403/admin-success Edge integration evidence; production deployment/auth protection is currently verified |":
              "| SEC-04 | Planner assurance aggregates re-authorise server-side and do not expose cross-user planner rows to browser roles | Critical | SQL/integration + protected server boundary | database CI denies browser-role aggregate execution; `tests/integration/edge-operations.test.ts` exercises repository `planner-operations` source | Covered | Retain SQL privilege boundary plus 401/403/admin-success protected-service assertions |",
              "| A11Y-01 | Critical learner journeys meet automated accessibility baseline | High | Automated accessibility | Required by Testing Standard | Uncovered | Introduce automated accessibility assertions/scanning into browser assurance, including Home / Plan / REV |":
              "| A11Y-01 | Critical learner journeys meet automated accessibility baseline | High | Automated accessibility | pinned `@axe-core/playwright`; `tests/e2e/accessibility.spec.ts` across phone/tablet/desktop; exact-head CI #381 | Covered | Automated WCAG A/AA is a baseline, not a substitute for manual/assistive-technology review when interaction risk warrants it |",
              "| DEF-01 | Open P0/P1/P2 defects are durably tracked and surfaced | High | Defect register + Admin integration | Severity model defined in Testing & Assurance Standard | Uncovered | Establish durable defect records and Admin aggregation before showing zero as a real value |":
              "| DEF-01 | Open P0/P1/P2 defects are durably tracked and surfaced | High | Defect register + Admin integration | `90-governance-registers/Defect Register.md`; fail-closed parser/unit tests; Founder Assurance browser projection | Covered | Retain deliberate triage date/schema marker and closure evidence; zero means zero known recorded open P0/P1/P2 defects only |",
          }
          text = Path(register).read_text()
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{register}: expected one row target, found {count}: {old[:100]!r}')
              text = text.replace(old, new)

          old_interpretation = """The repository has a meaningful automated foundation around build quality, responsive browser navigation, production artifact smoke and isolated database/RLS assurance. FI-001 extends browser and domain coverage to the adaptive planner, and Founder Assurance projects this register without converting gaps into a false confidence score.

The database-assurance job can recreate the schema from the production-aligned migration chain and proves learner-evidence ownership isolation plus the privileged Admin aggregate execution boundary. This is sufficient to keep DATA-01 and SEC-01 Covered. It does not prove browser/client persistence-reload, complete planner persistence lifecycles or protected Edge Function authorised success paths, so those related controls remain Partial.

The production incident in which the planner frontend was deployed before its Supabase schema existed exposed a separate path-to-live gap: frontend availability did not prove backend readiness. The `planner-v1` database readiness contract is currently present and returns ready, and the required protected Edge Functions are deployed with JWT verification. PTL-03 remains Partial until one complete production lineage is correlated through required CI, explicit Founder-approved merge, readiness, deploy and smoke.

PR #62 introduced forward least-privilege hardening of the public readiness RPC after Supabase Security Advisor identified its historical `SECURITY DEFINER` execution. Production applied that migration as `20260819162037_harden_release_readiness_security`; PR #63 reconciled the repository filename to the production migration ledger. Production re-verification confirms the RPC now runs as `SECURITY INVOKER`, so the readiness-RPC elevated-execution warning is closed. The remaining SEC-03 gap is repository-level secret/config scanning, not application of that migration.

The current implementation does **not** justify claiming complete production-backed persistence, real production authentication transaction coverage, accessibility, the full practice/progress/exam evidence lifecycle, exact CI-to-production lineage or durable defect aggregation.

That distinction is intentional. Founder confidence should increase as Partial/Uncovered rows become Covered through real automated evidence rather than by changing labels."""
          new_interpretation = """The repository now has repeatable assurance across deterministic build quality, responsive browser journeys, automated WCAG A/AA checks, isolated migration/RLS replay, authenticated learner persistence/reload, planner-state reuse, protected Edge authorization and governed defect evidence. Founder Assurance projects the governed registers without converting missing evidence into a false confidence score.

The database/service job recreates the production-aligned schema, proves learner ownership isolation and privileged aggregate boundaries, then uses synthetic authenticated users to exercise real learning-evidence and planner service round trips. A database-backed Playwright journey proves a scored Practice result survives a real browser reload and is reconstructed in Progress. Reloaded planner context is fed back through the deterministic planner, closing the previous persistence/replan assurance gap.

Protected `admin-operations` and `planner-operations` source is served against the isolated stack and must reject unauthenticated and ordinary authenticated users while allowing a database-authorised administrator. The automated accessibility gate scans the current critical learner journey on phone, tablet and desktop; it discovered two P2 defects during this tranche and exact-head CI #381 verified their fixes before closure in the Defect Register.

The production incident in which the planner frontend was deployed before its Supabase schema existed exposed a separate path-to-live gap. The `planner-v1` readiness contract is live and required protected Edge Functions are deployed, but PTL-03 remains Partial until a future explicitly Founder-approved PR records the new exact-head approval marker and the resulting production deployment/smoke can be correlated end to end. PR #64 predates that prospective marker and is not backfilled.

PR #62/63 production hardening remains verified: `revision_release_readiness()` runs as `SECURITY INVOKER`. SEC-03 remains Partial because repository-level secret/config scanning is not yet automated. AUTH-01 remains Partial because isolated CI authentication is not a real production sign-in transaction. JRN-05 remains qualified to navigation/start because the complete exam save/result lifecycle is not yet covered. Content assurance remains independent of software CI.

That distinction is intentional. Founder confidence increases only when the declared required layer is actually implemented and repeatable."""
          if text.count(old_interpretation) != 1:
              raise SystemExit('Assurance Coverage Register interpretation block did not match expected pre-reconciliation text')
          Path(register).write_text(text.replace(old_interpretation, new_interpretation))

          replace_once(
              'docs/technical/Founder Assurance Implementation.md',
              """The first runs found a real P2 defect: closed account/menu drawers remained keyboard-focusable while hidden. The defect is recorded as `DEF-2026-001`; PR #66 changes both implementations so closed drawers are removed from the DOM. The defect must remain open until an exact-head expanded accessibility run proves the fix.

Automated axe coverage is a baseline, not a claim that all accessibility quality can be proven mechanically.""",
              """The new gate found two real P2 defects before the tranche was declared complete: hidden account/menu drawers remained keyboard-focusable while closed (`DEF-2026-001`), and inactive desktop runtime navigation failed colour contrast (`DEF-2026-002`). PR #66 removes closed drawers from the DOM and aligns runtime navigation with the approved high-contrast deep-ink/indigo treatment. Exact-head Revision CI #381 passed the complete phone/tablet/desktop WCAG A/AA journey and both defects are closed with that verification evidence.

Automated axe coverage is a baseline, not a claim that all accessibility quality can be proven mechanically.""",
          )
          PY
      - name: Commit evidence reconciliation
        run: |
          set -euo pipefail
          git config user.name 'revision-foundation-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tests/e2e/admin-operations.spec.ts '90-governance-registers/Assurance Coverage Register.md' 'docs/technical/Founder Assurance Implementation.md'
          git commit -m 'Reconcile verified assurance coverage'
          git push origin HEAD:agent/close-assurance-foundation-gaps
