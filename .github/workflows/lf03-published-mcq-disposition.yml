name: LF-03 Published MCQ Item Disposition Audit

on:
  pull_request:
    paths:
      - '.github/workflows/lf03-published-mcq-disposition.yml'
      - 'scripts/assurance/lf03-published-disposition.test.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  item-inventory:
    name: Source-backed all-six-pack MCQ review queue
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Reconstruct actual course-pack source item dispositions
        run: npx vitest run scripts/assurance/lf03-published-disposition.test.ts
      - name: Publish non-sensitive per-item source QA inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lf03-published-mcq-dispositions-${{ github.run_id }}
          path: .artifacts/lf03-bank-dispositions/published-qa-queue.json
          retention-days: 30
          if-no-files-found: warn
