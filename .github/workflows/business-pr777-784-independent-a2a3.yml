name: Issue 698 Business Source-Scoped Independent A2 A3

on:
  pull_request:
    paths:
      - '.github/workflows/business-pr777-784-independent-a2a3.yml'
      - 'scripts/assurance/business-pr777-784-a2a3-review.mjs'
      - 'scripts/assurance/business-pr777-784-a2a3-review.node-check.mjs'
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: read

concurrency:
  group: issue-698-business-marketing-a2a3
  cancel-in-progress: false

jobs:
  reviewer-contract:
    name: Trusted Business reviewer guards (no secrets)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
      - run: node --test scripts/assurance/business-pr777-784-a2a3-review.node-check.mjs

  independent-business-review:
    name: Read-only independent exact-head A2 A3 educational review
    if: >-
      github.event_name == 'issue_comment' &&
      (github.event.issue.number == 777 || github.event.issue.number == 784 || github.event.issue.number == 805 || github.event.issue.number == 809 || github.event.issue.number == 820 || github.event.issue.number == 836) &&
      github.event.comment.user.login == 'lhanson-dev' &&
      github.event.comment.author_association == 'OWNER' &&
      (startsWith(github.event.comment.body, 'revision-run-business-marketing-a2a3:v1') || startsWith(github.event.comment.body, 'revision-run-business-guided-repair-a2a3:v1'))
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout current approved main only
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
      - name: Validate owner and exact-head reviewer contract
        run: node --test scripts/assurance/business-pr777-784-a2a3-review.node-check.mjs
      - name: Review inert candidate PR assets in isolated model context
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/assurance/business-pr777-784-a2a3-review.mjs
      - name: Retain exact-head educational evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-698-business-a2a3-${{ github.event.issue.number }}-${{ github.run_id }}
          path: .artifacts/issue-698-business-a2a3/
          if-no-files-found: warn
          retention-days: 30
