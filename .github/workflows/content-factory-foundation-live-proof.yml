name: Content Factory Foundation Live Proof

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: content-factory-foundation-live-proof
  cancel-in-progress: false

jobs:
  foundation-live-proof:
    name: Governed Foundation live real-course proof
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout approved main
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.19.0 --no-audit --no-fund

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run Foundation live real-course proof
        env:
          CONTENT_FACTORY_FOUNDATION_LIVE_PROOF: '1'
          CONTENT_FACTORY_CONTENT_HEAD_SHA: ${{ github.sha }}
          CONTENT_FACTORY_GIT_REF: ${{ github.ref }}
          CONTENT_FACTORY_MAX_SPEND_USD: '12'
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CONTENT_FACTORY_GENERATION_MODEL: gpt-5.6-terra
        run: npx vitest run src/content-factory/foundation-live-proof.integration.test.ts --reporter=verbose

      - name: Upload Foundation proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-factory-foundation-live-proof-${{ github.sha }}
          path: .artifacts/content-factory-foundation-live-proof/
          if-no-files-found: warn
          retention-days: 30
