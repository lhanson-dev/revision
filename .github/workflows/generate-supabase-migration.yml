name: Generate Supabase migration artifact

on:
  push:
    branches:
      - agent/first-additive-migration-artifact
    paths:
      - .github/workflows/generate-supabase-migration.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/first-additive-migration-artifact

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate migration filename with Supabase CLI
        run: |
          npx --yes supabase@2.111.0 migration new first_additive_regularisation
          migration_file="$(find supabase/migrations -maxdepth 1 -type f -name '*_first_additive_regularisation.sql' | head -1)"
          test -n "$migration_file"
          cp supabase/proposals/first-additive-regularisation.sql "$migration_file"
          sed -i '1,3d' "$migration_file"
          printf '%s\n' "$migration_file" > /tmp/migration-file.txt

      - name: Commit generated migration
        run: |
          migration_file="$(cat /tmp/migration-file.txt)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$migration_file"
          git commit -m "Generate first additive Supabase migration"
          git push
