name: Temporary stabilise Blueprint ownership

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-stabilise-blueprint-ownership.yml'

permissions:
  contents: write

jobs:
  stabilise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Restore committed Blueprint and plan identities from current main
        run: |
          git fetch origin main
          git checkout origin/main -- content-factory/slices/aqa-7132-3.1-3.2/BLUEPRINT.json content-factory/slices/aqa-7132-3.1-3.2/QUESTION_PLAN.json \
            content-factory/slices/aqa-7132-3.3/BLUEPRINT.json content-factory/slices/aqa-7132-3.3/QUESTION_PLAN.json \
            content-factory/slices/aqa-7132-3.4/BLUEPRINT.json content-factory/slices/aqa-7132-3.4/QUESTION_PLAN.json \
            content-factory/slices/aqa-7132-3.5-topup/BLUEPRINT.json content-factory/slices/aqa-7132-3.5-topup/QUESTION_PLAN.json \
            content-factory/slices/aqa-7132-3.6/BLUEPRINT.json content-factory/slices/aqa-7132-3.6/QUESTION_PLAN.json \
            content-factory/slices/aqa-7132-3.7/BLUEPRINT.json content-factory/slices/aqa-7132-3.7/QUESTION_PLAN.json \
            content-factory/slices/aqa-7132-3.8-3.9/BLUEPRINT.json content-factory/slices/aqa-7132-3.8-3.9/QUESTION_PLAN.json \
            content-factory/slices/aqa-7132-3.10/BLUEPRINT.json content-factory/slices/aqa-7132-3.10/QUESTION_PLAN.json \
            content-factory/slices/aqa-7132-batches-report.json
      - name: Make Blueprint item ownership stable across additive teaching changes
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('scripts/assurance/aqa-business-7132-batch-blueprint.ts')
          text = p.read_text()
          old = '''  // The blueprint already built for the first slice (3.5): its nodes are rebuilt in the top-up batch if they teach items from other sections.\n  builtBlueprint: Blueprint\n}) {'''
          new = '''  // The blueprint already built for the first slice (3.5): its nodes are rebuilt in the top-up batch if they teach items from other sections.\n  builtBlueprint: Blueprint\n  // Preserve an existing committed item owner when it remains a valid current teaching candidate.\n  // This prevents additive teaching improvements from reshuffling downstream question identities.\n  previousBlueprints?: Map<string, Blueprint>\n}) {'''
          if old not in text: raise SystemExit('input anchor missing')
          text = text.replace(old, new)

          old = '''  const taughtBy = new Map(input.coverage.map((entry) => [entry.id, (entry.taught_by ?? []).map((t) => t.node.toLowerCase()).filter((id) => ckmIds.has(id))]))\n  const itemOwner = new Map<string, string>()'''
          new = '''  const taughtBy = new Map(input.coverage.map((entry) => [entry.id, (entry.taught_by ?? []).map((t) => t.node.toLowerCase()).filter((id) => ckmIds.has(id))]))\n  const previousOwner = new Map<string, string>()\n  for (const blueprint of input.previousBlueprints?.values() ?? []) {\n    for (const item of blueprint.items) {\n      const nodeId = item.taughtBy[0]\n      if (nodeId) previousOwner.set(item.id, nodeId)\n    }\n  }\n  const itemOwner = new Map<string, string>()'''
          if old not in text: raise SystemExit('coverage anchor missing')
          text = text.replace(old, new)

          old = '''    const candidates = taughtBy.get(item.id) ?? []\n    const fresh = candidates.find((id) => owner.get(id) !== builtId)\n    if (fresh) itemOwner.set(item.id, fresh)\n    else uncovered.push({ id: item.id, builtNodes: candidates })'''
          new = '''    const candidates = taughtBy.get(item.id) ?? []\n    const previous = previousOwner.get(item.id)\n    const stablePrevious = previous && candidates.includes(previous) ? previous : undefined\n    const fresh = stablePrevious && owner.get(stablePrevious) !== builtId ? stablePrevious : candidates.find((id) => owner.get(id) !== builtId)\n    if (fresh) itemOwner.set(item.id, fresh)\n    else {\n      const builtNodes = stablePrevious ? [stablePrevious, ...candidates.filter((id) => id !== stablePrevious)] : candidates\n      uncovered.push({ id: item.id, builtNodes })\n    }'''
          if old not in text: raise SystemExit('ownership anchor missing')
          text = text.replace(old, new)
          p.write_text(text)

          p = Path('scripts/assurance/aqa-business-7132-batch-blueprint.test.ts')
          text = p.read_text()
          old = '''  const coverage = readJson<{ covered: CoverageEntry[] }>('research/aqa-business-7132/2027/ITEM_COVERAGE_REPORT.json').covered\n  const result = buildBatchBlueprints({ config, ckm, namedItems, coverage, mapping, courseId: config.course_id, examYear: 2027, builtBlueprint: readJson<Blueprint>('content-factory/slices/aqa-7132-3.5/BLUEPRINT.json') })\n  return { config, ckm, namedItems, ...result }'''
          new = '''  const coverage = readJson<{ covered: CoverageEntry[] }>('research/aqa-business-7132/2027/ITEM_COVERAGE_REPORT.json').covered\n  const previousBlueprints = new Map<string, Blueprint>([\n    ...config.batches.map((batch) => [batch.id, readJson<Blueprint>(blueprintPath(batch.id))] as const),\n    [config.top_up.id, readJson<Blueprint>(blueprintPath(config.top_up.id))] as const,\n  ])\n  const result = buildBatchBlueprints({ config, ckm, namedItems, coverage, mapping, courseId: config.course_id, examYear: 2027, builtBlueprint: readJson<Blueprint>('content-factory/slices/aqa-7132-3.5/BLUEPRINT.json'), previousBlueprints })\n  return { config, ckm, namedItems, coverage, previousBlueprints, ...result }'''
          if old not in text: raise SystemExit('test build anchor missing')
          text = text.replace(old, new)

          anchor = '''  it('rebuilds the already-built nodes that teach items from other sections, in a top-up batch', () => {'''
          test = '''  it('preserves a committed item owner while it remains a valid current teaching candidate', () => {\n    const candidatesByItem = new Map(built.coverage.map((entry) => [entry.id, (entry.taught_by ?? []).map((candidate) => candidate.node.toLowerCase())]))\n    for (const previous of built.previousBlueprints.values()) {\n      for (const item of previous.items) {\n        if (built.config.already_built.sections.some((prefix) => item.section.startsWith(`${prefix}.`))) continue\n        const owner = item.taughtBy[0]\n        if (!owner || !(candidatesByItem.get(item.id) ?? []).includes(owner)) continue\n        const currentOwner = built.itemOwner.get(item.id) ?? built.uncovered.find((entry) => entry.id === item.id)?.builtNodes[0]\n        expect(currentOwner, item.id).toBe(owner)\n      }\n    }\n  })\n\n'''
          if anchor not in text: raise SystemExit('test insertion anchor missing')
          text = text.replace(anchor, test + anchor)
          p.write_text(text)
          PY
      - name: Regenerate stable Blueprints and plans
        run: |
          CONTENT_FACTORY_WRITE_BATCH_BLUEPRINTS=1 npx vitest run scripts/assurance/aqa-business-7132-batch-blueprint.test.ts --reporter=dot
          CONTENT_FACTORY_WRITE_QUESTION_PLANS=1 npx vitest run scripts/assurance/aqa-business-7132-question-plan.test.ts --reporter=dot
      - name: Prove existing question identities did not move
        run: |
          python - <<'PY'
          import json, subprocess, pathlib
          batches = ['3.1-3.2','3.3','3.4','3.5-topup','3.6','3.7','3.8-3.9','3.10']
          keys = ['id','family','marks','commandWord','ao','itemSuffixes','formulaIds']
          for batch in batches:
              path = f'content-factory/slices/aqa-7132-{batch}/QUESTION_PLAN.json'
              old = json.loads(subprocess.check_output(['git','show',f'origin/main:{path}']))
              new = json.loads(pathlib.Path(path).read_text())
              old_id = [{k:q[k] for k in keys} for q in old['questions']]
              new_id = [{k:q[k] for k in keys} for q in new['questions']]
              if old_id != new_id:
                  raise SystemExit(f'question identity drift in {batch}')
          print('All committed question identities are stable.')
          PY
      - name: Run targeted software assurance
        run: |
          npx vitest run scripts/assurance/aqa-business-7132-question-number-parser.test.ts scripts/assurance/aqa-business-7132-slice-questions.test.ts scripts/assurance/aqa-business-7132-batch-blueprint.test.ts scripts/assurance/aqa-business-7132-question-plan.test.ts scripts/assurance/aqa-business-7132-learn-practice-resume-targets.test.ts --reporter=dot
      - name: Commit stable regeneration
        run: |
          git config user.name "revision-content-factory"
          git config user.email "revision-content-factory@users.noreply.github.com"
          git add scripts/assurance/aqa-business-7132-batch-blueprint.ts scripts/assurance/aqa-business-7132-batch-blueprint.test.ts content-factory/slices/aqa-7132-*/BLUEPRINT.json content-factory/slices/aqa-7132-*/QUESTION_PLAN.json content-factory/slices/aqa-7132-batches-report.json
          git commit -m "Keep Blueprint ownership and question identities stable"
          git push origin HEAD:${{ github.head_ref }}
