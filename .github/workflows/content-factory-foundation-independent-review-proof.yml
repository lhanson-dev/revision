name: Content Factory Foundation Independent Review Proof

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Foundation Live Proof run ID
        required: true
        type: string
      source_artifact_id:
        description: Retained Foundation Live Proof artifact ID
        required: true
        type: string
      source_head_sha:
        description: Exact released main SHA used by the live proof
        required: true
        type: string
      foundation_fingerprint:
        description: Exact Foundation fingerprint retained by the live proof
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: content-factory-foundation-independent-review-proof
  cancel-in-progress: false

jobs:
  foundation-independent-review-proof:
    name: Governed retained real-course Foundation independent review proof
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 289 &&
       github.event.comment.user.login == 'lhanson-dev' &&
       github.event.comment.author_association == 'OWNER' &&
       startsWith(github.event.comment.body, 'revision-run-foundation-independent-review-proof:v2'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout approved main
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Resolve exact source proof identity
        env:
          REVISION_TRIGGER_MARKER: revision-run-foundation-independent-review-proof:v2
          REVISION_TRIGGER_BODY: ${{ github.event.comment.body || '' }}
          REVISION_INPUT_SOURCE_RUN_ID: ${{ inputs.source_run_id || '' }}
          REVISION_INPUT_SOURCE_ARTIFACT_ID: ${{ inputs.source_artifact_id || '' }}
          REVISION_INPUT_SOURCE_HEAD_SHA: ${{ inputs.source_head_sha || '' }}
          REVISION_INPUT_FOUNDATION_FINGERPRINT: ${{ inputs.foundation_fingerprint || '' }}
        run: node scripts/assurance/foundation-proof-trigger.mjs

      - name: Verify retained source proof identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")"
          test "$(jq -r '.name' <<<"${run_json}")" = 'Content Factory Foundation Live Proof'
          test "$(jq -r '.status' <<<"${run_json}")" = 'completed'
          test "$(jq -r '.conclusion' <<<"${run_json}")" = 'success'
          test "$(jq -r '.head_branch' <<<"${run_json}")" = 'main'
          test "$(jq -r '.head_sha' <<<"${run_json}")" = "${SOURCE_HEAD_SHA}"

          artifact_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}")"
          expected_name="content-factory-foundation-live-proof-${SOURCE_HEAD_SHA}"
          actual_name="$(jq -r '.name' <<<"${artifact_json}")"
          actual_digest="$(jq -r '.digest' <<<"${artifact_json}")"
          actual_run_id="$(jq -r '.workflow_run.id' <<<"${artifact_json}")"
          actual_head_sha="$(jq -r '.workflow_run.head_sha' <<<"${artifact_json}")"
          actual_expired="$(jq -r '.expired' <<<"${artifact_json}")"
          test "${actual_name}" = "${expected_name}"
          test "${actual_run_id}" = "${SOURCE_RUN_ID}"
          test "${actual_head_sha}" = "${SOURCE_HEAD_SHA}"
          test "${actual_expired}" = 'false'
          test -n "${actual_digest}"
          test "${actual_digest}" != 'null'
          echo "SOURCE_ARTIFACT_NAME=${actual_name}" >> "${GITHUB_ENV}"
          echo "SOURCE_ARTIFACT_DIGEST=${actual_digest}" >> "${GITHUB_ENV}"

      - name: Download and verify retained Foundation live proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source_dir='.artifacts/content-factory-foundation-independent-review-source'
          mkdir -p "${source_dir}"
          gh run download "${SOURCE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "${SOURCE_ARTIFACT_NAME}" \
            --dir "${source_dir}"

          mapfile -t proof_files < <(find "${source_dir}" -maxdepth 1 -type f -name '*.json' -print)
          test "${#proof_files[@]}" -eq 1
          source_proof_path="${proof_files[0]}"
          test "$(jq -r '.artifactType' "${source_proof_path}")" = 'foundation_live_real_course_proof_evidence'
          test "$(jq -r '.contentHeadSha' "${source_proof_path}")" = "${SOURCE_HEAD_SHA}"
          test "$(jq -r '.foundationFingerprint' "${source_proof_path}")" = "${FOUNDATION_FINGERPRINT}"
          test "$(jq -r '.learnerAssetCount' "${source_proof_path}")" = '0'
          echo "SOURCE_PROOF_PATH=${source_proof_path}" >> "${GITHUB_ENV}"

      - name: Pin npm
        run: npm install --global npm@11.19.0 --no-audit --no-fund

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run retained Foundation independent review proof
        env:
          CONTENT_FACTORY_FOUNDATION_INDEPENDENT_REVIEW_PROOF: '1'
          CONTENT_FACTORY_FOUNDATION_SOURCE_PROOF_PATH: ${{ env.SOURCE_PROOF_PATH }}
          CONTENT_FACTORY_FOUNDATION_SOURCE_HEAD_SHA: ${{ env.SOURCE_HEAD_SHA }}
          CONTENT_FACTORY_FOUNDATION_FINGERPRINT: ${{ env.FOUNDATION_FINGERPRINT }}
          CONTENT_FACTORY_FOUNDATION_SOURCE_RUN_ID: ${{ env.SOURCE_RUN_ID }}
          CONTENT_FACTORY_FOUNDATION_SOURCE_ARTIFACT_NAME: ${{ env.SOURCE_ARTIFACT_NAME }}
          CONTENT_FACTORY_FOUNDATION_SOURCE_ARTIFACT_DIGEST: ${{ env.SOURCE_ARTIFACT_DIGEST }}
          CONTENT_FACTORY_REVIEWED_COMMIT: ${{ github.sha }}
          CONTENT_FACTORY_MAX_SPEND_USD: '12'
          CONTENT_FACTORY_GENERATION_MODEL: gpt-5.6-terra
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npx vitest run src/content-factory/foundation-independent-review-proof.integration.test.ts --reporter=verbose

      - name: Upload independent review proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-factory-foundation-independent-review-proof-${{ github.sha }}
          path: .artifacts/content-factory-foundation-independent-review-proof/
          if-no-files-found: warn
          retention-days: 30
