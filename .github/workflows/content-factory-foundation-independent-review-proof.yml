name: Content Factory Foundation Independent Review Proof

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: content-factory-foundation-independent-review-proof
  cancel-in-progress: false

jobs:
  foundation-independent-review-proof:
    name: Governed retained real-course Foundation independent review proof
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 289 &&
       github.event.comment.user.login == 'lhanson-dev' &&
       github.event.comment.author_association == 'OWNER' &&
       github.event.comment.body == 'revision-run-foundation-independent-review-proof:v1')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_RUN_ID: '33938173128'
      SOURCE_ARTIFACT_NAME: content-factory-foundation-live-proof-599704ff77bc2f1e782f4804b142614a043700c7
      SOURCE_ARTIFACT_DIGEST: sha256:ba590273474bae9325bcc7b1a3add4e73bd5498c60d75cf1c603ed71ce56a16e
      SOURCE_HEAD_SHA: 599704ff77bc2f1e782f4804b142614a043700c7
      FOUNDATION_FINGERPRINT: 8c3786491943091da31325812af0386a531b5c634513dfcece2147273bb022ca
      SOURCE_PROOF_PATH: .artifacts/content-factory-foundation-independent-review-source/aqa-a-level-business-7132-foundation-599704ff77bc-1788574070566.json
    steps:
      - name: Checkout approved main
        uses: actions/checkout@v6

      - name: Verify retained source proof identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          actual_digest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts" --jq ".artifacts[] | select(.name == \"${SOURCE_ARTIFACT_NAME}\") | .digest")"
          test "${actual_digest}" = "${SOURCE_ARTIFACT_DIGEST}"

      - name: Download retained Foundation live proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .artifacts/content-factory-foundation-independent-review-source
          gh run download "${SOURCE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "${SOURCE_ARTIFACT_NAME}" \
            --dir .artifacts/content-factory-foundation-independent-review-source
          test -f "${SOURCE_PROOF_PATH}"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.19.0 --no-audit --no-fund

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run retained Foundation independent review proof
        env:
          CONTENT_FACTORY_FOUNDATION_INDEPENDENT_REVIEW_PROOF: '1'
          CONTENT_FACTORY_FOUNDATION_SOURCE_PROOF_PATH: ${{ env.SOURCE_PROOF_PATH }}
          CONTENT_FACTORY_FOUNDATION_SOURCE_HEAD_SHA: ${{ env.SOURCE_HEAD_SHA }}
          CONTENT_FACTORY_FOUNDATION_FINGERPRINT: ${{ env.FOUNDATION_FINGERPRINT }}
          CONTENT_FACTORY_FOUNDATION_SOURCE_RUN_ID: ${{ env.SOURCE_RUN_ID }}
          CONTENT_FACTORY_FOUNDATION_SOURCE_ARTIFACT_NAME: ${{ env.SOURCE_ARTIFACT_NAME }}
          CONTENT_FACTORY_FOUNDATION_SOURCE_ARTIFACT_DIGEST: ${{ env.SOURCE_ARTIFACT_DIGEST }}
          CONTENT_FACTORY_REVIEWED_COMMIT: ${{ github.sha }}
          CONTENT_FACTORY_MAX_SPEND_USD: '12'
          CONTENT_FACTORY_GENERATION_MODEL: gpt-5.6-terra
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npx vitest run src/content-factory/foundation-independent-review-proof.integration.test.ts --reporter=verbose

      - name: Upload independent review proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-factory-foundation-independent-review-proof-${{ github.sha }}
          path: .artifacts/content-factory-foundation-independent-review-proof/
          if-no-files-found: warn
          retention-days: 30
