name: Content Factory Live Pilot

on:
  workflow_dispatch:
    inputs:
      resume_job_issue_number:
        description: 'Optional existing Content Factory job issue number to resume on the exact same main commit'
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: content-factory-live-pilot
  cancel-in-progress: false

jobs:
  live-pilot:
    name: Governed Content Factory live adapter proof
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout approved main
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.19.0 --no-audit --no-fund

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify course-agnostic Content Factory reliability qualification
        run: node scripts/content-factory-live-pilot-qualification.mjs

      - name: Run rights-safe live adapter pilot
        env:
          CONTENT_FACTORY_LIVE_PILOT: '1'
          CONTENT_FACTORY_CONTENT_HEAD_SHA: ${{ github.sha }}
          CONTENT_FACTORY_MAX_SPEND_USD: '20'
          CONTENT_FACTORY_RESUME_JOB_ISSUE_NUMBER: ${{ inputs.resume_job_issue_number }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CONTENT_FACTORY_GENERATION_MODEL: gpt-5.6-terra
          CONTENT_FACTORY_REVIEW_MODEL: gpt-5.6-sol
        run: npx vitest run src/content-factory/live-pilot.integration.test.ts --reporter=verbose

      - name: Upload live pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-factory-live-pilot-${{ github.sha }}
          path: .artifacts/content-factory-live-pilot/
          if-no-files-found: warn
          retention-days: 30
