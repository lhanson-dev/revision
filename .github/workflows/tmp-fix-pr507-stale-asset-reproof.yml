name: Temporary PR507 stale asset reproof fix

on:
  push:
    branches:
      - fix/aqa-7132-t8-two-blockers
    paths:
      - scripts/tmp-pr507-stale-asset-patch.py
      - .github/workflows/tmp-fix-pr507-stale-asset-reproof.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/aqa-7132-t8-two-blockers
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python scripts/tmp-pr507-stale-asset-patch.py
      - run: npx vitest run scripts/assurance/aqa-business-7132-slice-learn-practice.test.ts scripts/assurance/aqa-business-7132-learn-practice-resume-targets.test.ts scripts/assurance/aqa-business-7132-post-merge-t8-remediation.test.ts
      - name: Commit tested patch and remove helpers
        run: |
          rm scripts/tmp-pr507-stale-asset-patch.py
          rm .github/workflows/tmp-fix-pr507-stale-asset-reproof.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Respect stale Learn Practice assets before T8 refresh'
          git push origin HEAD:fix/aqa-7132-t8-two-blockers
