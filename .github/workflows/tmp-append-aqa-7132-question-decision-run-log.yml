name: Temporary append AQA 7132 question decision run log

on:
  push:
    branches:
      - fix/aqa-7132-founder-question-fingerprints

permissions:
  contents: write

jobs:
  append-and-remove:
    if: ${{ github.actor == 'lhanson-dev' || github.actor == 'openai-connector[bot]' || github.actor == 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/aqa-7132-founder-question-fingerprints
          fetch-depth: 0
      - name: Append exact run-log line and remove helper
        run: |
          set -euo pipefail
          line='2026-10-03 · AQA 7132 question Founder decision binding · Corrected all ten 2 October Founder-fix prior fingerprints to the exact run 36925676050 ledger values; retained a compact source receipt and made exhausted fingerprint mismatches fail loudly during resume · The prior decision-file fingerprints did not match the canonical checkpoint, so decisions were skipped and old two-round findings were re-escalated · T11 exact-fingerprint resume / Founder escalation regression'
          if ! grep -Fqx "$line" content-factory/RUN_LOG.md; then
            printf '\n%s\n' "$line" >> content-factory/RUN_LOG.md
          fi
          rm .github/workflows/tmp-append-aqa-7132-question-decision-run-log.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content-factory/RUN_LOG.md .github/workflows/tmp-append-aqa-7132-question-decision-run-log.yml
          git commit -m 'Record AQA 7132 question decision binding fix'
          git push origin HEAD:fix/aqa-7132-founder-question-fingerprints
