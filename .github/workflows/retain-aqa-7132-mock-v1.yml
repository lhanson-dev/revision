name: Retain AQA Business 7132 mock v1 artifact

on:
  push:
    branches:
      - content/aqa-7132-retain-mock-v1
    paths:
      - 'content-factory/retention-requests/aqa-7132-mock-v1.json'
      - '.github/workflows/retain-aqa-7132-mock-v1.yml'

permissions:
  contents: write
  actions: read

jobs:
  retain:
    name: Retain exact successful mock artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout retention branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Validate source run and retain exact artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          request='content-factory/retention-requests/aqa-7132-mock-v1.json'
          run_id="$(jq -r '.run_id' "$request")"
          artifact_id="$(jq -r '.artifact_id' "$request")"
          artifact_name="$(jq -r '.artifact_name' "$request")"
          reviewed_commit="$(jq -r '.reviewed_commit' "$request")"
          plan_fingerprint="$(jq -r '.plan_fingerprint' "$request")"
          target_dir="$(jq -r '.target_dir' "$request")"

          meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
          test "$(jq -r '.name' <<<"$meta")" = 'Content Factory AQA Business 7132 Mock Generation'
          test "$(jq -r '.event' <<<"$meta")" = 'workflow_dispatch'
          test "$(jq -r '.head_branch' <<<"$meta")" = 'main'
          test "$(jq -r '.head_sha' <<<"$meta")" = "$reviewed_commit"
          test "$(jq -r '.status' <<<"$meta")" = 'completed'
          test "$(jq -r '.conclusion' <<<"$meta")" = 'success'

          artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts")"
          test "$(jq -r --argjson id "$artifact_id" --arg name "$artifact_name" '[.artifacts[] | select(.id == $id and .name == $name and .expired == false)] | length' <<<"$artifacts")" = '1'

          rm -rf "$target_dir"
          mkdir -p "$target_dir"
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$artifact_name" --dir "$target_dir"

          test -f "$target_dir/summary.json"
          test -f "$target_dir/generation-state.json"
          test -f "$target_dir/unit-review-ledger.json"
          test -f "$target_dir/paper-review-ledger.json"
          test -f "$target_dir/set-review-ledger.json"

          test "$(jq -r '.status' "$target_dir/summary.json")" = 'assured_not_published'
          test "$(jq -r '.reviewed_commit' "$target_dir/summary.json")" = "$reviewed_commit"
          test "$(jq -r '.plan_fingerprint' "$target_dir/summary.json")" = "$plan_fingerprint"
          test "$(find "$target_dir/questions" -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')" = '41'
          test "$(find "$target_dir/blind-units" -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')" = '13'
          test "$(find "$target_dir/contexts" -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')" = '4'
          test "$(find "$target_dir/papers" -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')" = '3'

          jq -e '
            .unit_summary.can_progress == true and
            .paper_summary.can_progress == true and
            .set_summary.can_progress == true and
            (.unit_summary.blocking | length) == 0 and
            (.unit_summary.escalated | length) == 0 and
            (.unit_summary.failed | length) == 0 and
            (.paper_summary.blocking | length) == 0 and
            (.paper_summary.escalated | length) == 0 and
            (.paper_summary.failed | length) == 0 and
            (.set_summary.blocking | length) == 0 and
            (.set_summary.escalated | length) == 0 and
            (.set_summary.failed | length) == 0
          ' "$target_dir/summary.json" >/dev/null

      - name: Write exact-file retention manifest
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          request_path = Path('content-factory/retention-requests/aqa-7132-mock-v1.json')
          request = json.loads(request_path.read_text())
          root = Path(request['target_dir'])
          files = {}
          for path in sorted(p for p in root.rglob('*') if p.is_file()):
              payload = path.read_bytes()
              files[str(path.relative_to(root))] = {
                  'bytes': len(payload),
                  'sha256': hashlib.sha256(payload).hexdigest(),
              }

          manifest = {
              'schema_version': 1,
              'source_run_id': request['run_id'],
              'source_artifact_id': request['artifact_id'],
              'source_artifact_name': request['artifact_name'],
              'source_artifact_zip_sha256': request['artifact_zip_sha256'],
              'reviewed_commit': request['reviewed_commit'],
              'plan_fingerprint': request['plan_fingerprint'],
              'retained_file_count': len(files),
              'files': files,
          }
          out = root.parent / 'RETENTION_MANIFEST.json'
          out.write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          PY

      - name: Commit retained evidence to branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content-factory/runs/aqa-7132-mock-v1
          if git diff --cached --quiet; then
            echo 'Exact artifact already retained; nothing to commit.'
            exit 0
          fi
          git commit -m 'Retain assured AQA 7132 mock v1 evidence'
          git push origin "HEAD:${GITHUB_REF_NAME}"
