name: Reconcile visual navigation authority

on:
  push:
    branches:
      - agent/close-assurance-foundation-gaps

permissions:
  contents: write

jobs:
  reconcile-visual-navigation:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/close-assurance-foundation-gaps
      - name: Reconcile approved primary navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('20-brand-and-experience/Visual Brand System.md')
          text = path.read_text()
          replacements = {
              'version: "0.3"': 'version: "0.4"',
              'last_reviewed: "2026-08-18"': 'last_reviewed: "2026-08-19"',
              '''Desktop uses a persistent top navigation with:\n\n- Home\n- Subjects\n- Progress\n- REV\n\nAccount and utility controls remain visually secondary.''': '''Desktop uses a persistent top navigation with:\n\n- Home\n- Plan\n- REV\n- Progress\n- Subjects\n\nPlan is a genuine primary learner job under the approved adaptive-planning model, not a decorative navigation item. REV may receive distinctive visual treatment while preserving the clarity and accessibility of every other destination. Account and utility controls remain visually secondary.''',
              '''The current bottom navigation is:\n\n- Home\n- Subjects\n- Progress\n- REV\n\nDo not add a fifth global destination solely for symmetry. A later context-specific action may occupy additional navigation space only when usability evidence demonstrates that it improves the learner journey.''': '''The current bottom navigation is:\n\n- Home\n- Plan\n- REV\n- Progress\n- Subjects\n\nREV occupies the centre position and may receive a modest differentiated treatment because it is a core product capability. That prominence must not reduce label clarity, touch-target quality, focus visibility or the usability of the other four destinations. Do not add further global destinations solely for symmetry; later navigation changes require deliberate product/experience authority.'''
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one guarded target, found {count}: {old[:80]!r}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
      - name: Commit reconciliation
        run: |
          set -euo pipefail
          git config user.name 'revision-foundation-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add '20-brand-and-experience/Visual Brand System.md'
          git commit -m 'Align visual navigation authority with Plan'
          git push origin HEAD:agent/close-assurance-foundation-gaps
