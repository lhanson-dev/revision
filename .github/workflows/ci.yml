name: Revision CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Later pushes to the same PR supersede obsolete CI work. Main-branch
# production evidence is never cancelled by this setting.
concurrency:
  group: revision-ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  assurance-plan:
    name: Assurance plan and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      risk_level: ${{ steps.plan-output.outputs.risk_level }}
      risk_label: ${{ steps.plan-output.outputs.risk_label }}
      selection_scope: ${{ steps.plan-output.outputs.selection_scope }}
      run_static: ${{ steps.plan-output.outputs.run_static }}
      run_browser: ${{ steps.plan-output.outputs.run_browser }}
      run_db: ${{ steps.plan-output.outputs.run_db }}
      browser_tests: ${{ steps.plan-output.outputs.browser_tests }}
    steps:
      - name: Checkout full change history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
      - name: Generate machine-readable assurance plan
        env:
          REVISION_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          REVISION_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          REVISION_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/assurance/generate-assurance-plan.mjs --output assurance-plan.json
      - name: Expose assurance plan summary
        id: plan-output
        run: |
          node <<'NODE'
          const fs = require('fs')
          const plan = JSON.parse(fs.readFileSync('assurance-plan.json', 'utf8'))
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `selection_scope=${plan.execution.mode}\nrun_static=${plan.execution.runStatic}\nrun_browser=${plan.execution.runBrowser}\nrun_db=${plan.execution.runDatabase}\nbrowser_tests=${plan.execution.browserTestFiles.join(' ')}\nrisk_level=${plan.risk.level}\nrisk_label=${plan.risk.label}\n`)
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Assurance plan\n\n**Risk:** Level ${plan.risk.level} / ${plan.risk.label}\n\n**Selection mode:** ${plan.selectionMode} / ${plan.execution.mode}\n\n**Checks executed:** static=${plan.execution.runStatic}, browser=${plan.execution.runBrowser}, database=${plan.execution.runDatabase}\n\n**Targeted browser files:** ${plan.execution.browserTestFiles.join(', ') || 'none'}\n\n### Reasons\n${plan.risk.reasons.map((reason) => `- ${reason}`).join('\n')}\n\n### Affected domains\n${plan.risk.affectedDomains.map((domain) => `- ${domain}`).join('\n')}\n`)
          NODE
      - name: Scan repository for privileged secrets and config
        run: node scripts/assurance/scan-secrets.mjs
      - name: Upload assurance plan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assurance-plan-${{ github.run_id }}
          path: assurance-plan.json
          if-no-files-found: error
          retention-days: 30

  foundation-static:
    name: Foundation static, unit and build assurance
    needs: assurance-plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Document-only assurance selection
        if: needs.assurance-plan.outputs.run_static != 'true'
        run: echo "Static, unit and build assurance not applicable for allowlisted documentation-only PR."
      - name: Checkout
        if: needs.assurance-plan.outputs.run_static == 'true'
        uses: actions/checkout@v6
      - name: Set up Node
        if: needs.assurance-plan.outputs.run_static == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: npm
      - name: Pin npm
        if: needs.assurance-plan.outputs.run_static == 'true'
        run: npm install --global npm@11.19.0 --no-audit --no-fund
      - name: Install dependencies from lockfile
        if: needs.assurance-plan.outputs.run_static == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate Business subject promotion provenance
        if: needs.assurance-plan.outputs.run_static == 'true'
        run: node scripts/assurance/validate-business-subject-provenance.mjs
      - name: Validate Business subject fresh-reassurance contract
        if: needs.assurance-plan.outputs.run_static == 'true'
        run: node scripts/assurance/business-subject-foundation-reassurance.mjs --self-test
      - name: Validate AQA 7132 specification mapping and v0.7 gap scope
        if: needs.assurance-plan.outputs.run_static == 'true'
        run: node scripts/assurance/validate-aqa-business-7132-specification-mapping.mjs
      - name: Typecheck
        if: needs.assurance-plan.outputs.run_static == 'true'
        run: npm run typecheck
      - name: Lint
        if: needs.assurance-plan.outputs.run_static == 'true'
        run: npm run lint
      - name: Unit tests
        if: needs.assurance-plan.outputs.run_static == 'true'
        run: npm run test
      - name: Production build
        if: needs.assurance-plan.outputs.run_static == 'true'
        run: npm run build

  responsive-browser:
    name: Responsive browser assurance (${{ matrix.project }})
    needs: assurance-plan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [phone, tablet, desktop]
    steps:
      - name: Browser assurance selection
        if: needs.assurance-plan.outputs.run_browser != 'true'
        run: echo "Browser assurance not applicable for allowlisted documentation-only PR."
      - name: Checkout
        if: needs.assurance-plan.outputs.run_browser == 'true'
        uses: actions/checkout@v6
      - name: Set up Node
        if: needs.assurance-plan.outputs.run_browser == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: npm
      - name: Pin npm
        if: needs.assurance-plan.outputs.run_browser == 'true'
        run: npm install --global npm@11.19.0 --no-audit --no-fund
      - name: Install dependencies from lockfile
        if: needs.assurance-plan.outputs.run_browser == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium for browser assurance
        if: needs.assurance-plan.outputs.run_browser == 'true'
        timeout-minutes: 10
        run: npx playwright install chromium
      - name: Responsive browser assurance
        if: needs.assurance-plan.outputs.run_browser == 'true'
        timeout-minutes: 20
        env:
          LEARNER_DESIGN_SHOTS: '1'
          BROWSER_SELECTION: ${{ needs.assurance-plan.outputs.selection_scope }}
          BROWSER_TEST_FILES: ${{ needs.assurance-plan.outputs.browser_tests }}
        run: |
          set -euo pipefail
          if [ "$BROWSER_SELECTION" = "targeted-e2e" ]; then
            read -r -a specs <<< "$BROWSER_TEST_FILES"
            if [ "${#specs[@]}" -eq 0 ]; then
              echo "::error::Targeted browser assurance requires at least one spec."
              exit 1
            fi
            npx playwright test "${specs[@]}" --project=${{ matrix.project }}
          elif [ "$BROWSER_SELECTION" = "full" ]; then
            npx playwright test --project=${{ matrix.project }}
          else
            echo "::error::Unknown browser selection '$BROWSER_SELECTION'."
            exit 1
          fi
      - name: Upload interface visual regression evidence
        if: always() && needs.assurance-plan.outputs.run_browser == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: interface-visual-regression-${{ github.run_id }}-${{ matrix.project }}
          path: |
            test-results
            tests/e2e/interface-visual-regression.spec.ts-snapshots
          if-no-files-found: ignore
          retention-days: 30

  # Preserve the required 'Foundation quality' status while failing closed if
  # ANY browser viewport, static check or assurance-plan prerequisite fails.
  foundation-quality:
    name: Foundation quality
    if: always()
    needs: [assurance-plan, foundation-static, responsive-browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all foundation assurance jobs succeeded
        env:
          ASSURANCE_PLAN: ${{ needs.assurance-plan.result }}
          STATIC_QUALITY: ${{ needs.foundation-static.result }}
          RESPONSIVE_BROWSER: ${{ needs.responsive-browser.result }}
        run: |
          set -euo pipefail
          for result in "$ASSURANCE_PLAN" "$STATIC_QUALITY" "$RESPONSIVE_BROWSER"; do
            if [ "$result" != "success" ]; then
              echo "::error::Required foundation assurance was not successful (plan=$ASSURANCE_PLAN, static=$STATIC_QUALITY, browser=$RESPONSIVE_BROWSER)."
              exit 1
            fi
          done
          echo "All applicable Foundation quality prerequisites passed; requested assurance scope: ${{ needs.assurance-plan.outputs.selection_scope }}."

  database-assurance:
    name: Database, RLS and protected service assurance
    needs: assurance-plan
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Database assurance selection
        if: needs.assurance-plan.outputs.run_db != 'true'
        run: echo "Database/RLS/protected-service assurance not applicable for selected PR-only documentation or isolated browser-test changes."
      - name: Checkout
        if: needs.assurance-plan.outputs.run_db == 'true'
        uses: actions/checkout@v6
      - name: Set up Node
        if: needs.assurance-plan.outputs.run_db == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
      - name: Pin npm
        if: needs.assurance-plan.outputs.run_db == 'true'
        run: npm install --global npm@11.19.0 --no-audit --no-fund
      - name: Install dependencies from lockfile
        if: needs.assurance-plan.outputs.run_db == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Set up Supabase CLI
        if: needs.assurance-plan.outputs.run_db == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0
      - name: Start isolated Supabase test stack and replay migrations
        if: needs.assurance-plan.outputs.run_db == 'true'
        run: supabase start
      - name: Export isolated Supabase client credentials
        if: needs.assurance-plan.outputs.run_db == 'true'
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          {
            echo "SUPABASE_URL=http://127.0.0.1:54321"
            echo "SUPABASE_ANON_KEY=${ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
            echo "VITE_SUPABASE_URL=http://127.0.0.1:54321"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=${ANON_KEY}"
            echo "REVISION_SUPABASE_INTEGRATION=1"
          } >> "$GITHUB_ENV"
      - name: Verify anonymous release readiness contract
        if: needs.assurance-plan.outputs.run_db == 'true'
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            --request POST \
            --header "apikey: ${SUPABASE_ANON_KEY}" \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "${SUPABASE_URL}/rest/v1/rpc/revision_release_readiness")"
          test "$(jq -r '.contract // empty' <<<"$response")" = 'planner-week-v1'
          test "$(jq -r '.ready // false' <<<"$response")" = 'true'
          test "$(jq -r '.checks.weeklyAvailability // false' <<<"$response")" = 'true'
      - name: Run pgTAP database and RLS assurance
        if: needs.assurance-plan.outputs.run_db == 'true'
        run: |
          supabase test db supabase/tests/database-assurance.test.sql
          supabase test db supabase/tests/learner-plan-assurance.test.sql
          supabase test db supabase/tests/starting-check-assurance.test.sql
          supabase test db supabase/tests/student-first-use-assurance.test.sql
          supabase test db supabase/tests/learner-planned-sessions-assurance.test.sql
      - name: Run authenticated persistence and reload integration assurance
        if: needs.assurance-plan.outputs.run_db == 'true'
        run: npx vitest run tests/integration/supabase-persistence.test.ts
      # The Supabase CLI pulls the Edge runtime from public ECR, whose anonymous
      # data quota is shared across GitHub runners and can refuse the pull
      # ("toomanyrequests"). Pre-load the same tag from GHCR (or Docker Hub) and
      # retag it so the CLI finds it locally. The tag must match what Supabase
      # CLI 2.111.0 expects; if both mirrors fail, the CLI still tries ECR.
      - name: Pre-load Edge runtime image from GHCR
        if: needs.assurance-plan.outputs.run_db == 'true'
        run: |
          set -uo pipefail
          target='public.ecr.aws/supabase/edge-runtime:v1.74.2'
          for source in 'ghcr.io/supabase/edge-runtime:v1.74.2' 'supabase/edge-runtime:v1.74.2'; do
            if docker pull "$source"; then
              docker tag "$source" "$target"
              echo "Edge runtime pre-loaded from $source"
              exit 0
            fi
          done
          echo "::warning::Could not pre-load the Edge runtime from GHCR or Docker Hub; falling back to public ECR."
      - name: Serve protected Edge Functions from repository source
        if: needs.assurance-plan.outputs.run_db == 'true'
        run: |
          set -euo pipefail
          nohup supabase functions serve > /tmp/revision-edge-functions.log 2>&1 &
          echo $! > /tmp/revision-edge-functions.pid
          ready=false
          for attempt in $(seq 1 60); do
            status="$(curl --silent --output /tmp/admin-edge-probe.txt --write-out '%{http_code}' \
              --request POST \
              --header "apikey: ${SUPABASE_ANON_KEY}" \
              --header 'Content-Type: application/json' \
              --data '{}' \
              "${SUPABASE_URL}/functions/v1/admin-operations" || true)"
            if [ "$status" = "401" ]; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != "true" ]; then
            echo 'Protected Edge Functions did not become ready with the expected unauthenticated 401 boundary.' >&2
            cat /tmp/revision-edge-functions.log >&2 || true
            cat /tmp/admin-edge-probe.txt >&2 || true
            exit 1
          fi
      - name: Run protected Edge Function authorization integration assurance
        if: needs.assurance-plan.outputs.run_db == 'true'
        env:
          REVISION_EDGE_INTEGRATION: '1'
        run: npx vitest run tests/integration/edge-operations.test.ts
      - name: Install Chromium for database-backed browser assurance
        if: needs.assurance-plan.outputs.run_db == 'true'
        timeout-minutes: 10
        run: npx playwright install chromium
      - name: Run isolated database-backed browser persistence and new-account first-use assurance
        if: needs.assurance-plan.outputs.run_db == 'true'
        env:
          REVISION_BROWSER_DB_INTEGRATION: '1'
        run: npx playwright test tests/e2e/database-persistence.spec.ts tests/e2e/first-use-real-service.spec.ts --project=desktop
      - name: Stop isolated Supabase test stack
        if: always() && needs.assurance-plan.outputs.run_db == 'true'
        run: |
          if [ -f /tmp/revision-edge-functions.pid ]; then
            kill "$(cat /tmp/revision-edge-functions.pid)" 2>/dev/null || true
          fi
          supabase stop --no-backup
