name: Revision CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation-quality:
    name: Foundation quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
      - name: Pin npm
        run: npm install --global npm@11.19.0 --no-audit --no-fund
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npm run build
      - name: Install Chromium for browser assurance
        timeout-minutes: 10
        run: npx playwright install chromium
      - name: Responsive browser assurance
        timeout-minutes: 10
        run: npm run test:e2e
