name: Revision CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Later pushes to the same PR supersede obsolete CI work. Main-branch
# production evidence is never cancelled by this setting.
concurrency:
  group: revision-ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  assurance-plan:
    name: Assurance plan and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      risk_level: ${{ steps.plan-output.outputs.risk_level }}
      risk_label: ${{ steps.plan-output.outputs.risk_label }}
      docs_only: ${{ steps.plan-output.outputs.docs_only }}
      selection_mode: ${{ steps.plan-output.outputs.selection_mode }}
      browser_files: ${{ steps.plan-output.outputs.browser_files }}
    steps:
      - name: Checkout full change history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
      - name: Generate machine-readable assurance plan
        env:
          REVISION_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          REVISION_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          REVISION_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/assurance/generate-assurance-plan.mjs --output assurance-plan.json
      - name: Expose assurance plan summary
        id: plan-output
        run: |
          node <<'NODE'
          const fs = require('fs')
          const plan = JSON.parse(fs.readFileSync('assurance-plan.json', 'utf8'))
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `risk_level=${plan.risk.level}\nrisk_label=${plan.risk.label}\ndocs_only=${plan.selectionMode === 'docs-only'}\nselection_mode=${plan.selectionMode}\nbrowser_files=${plan.selectedBrowserSpecs.join(',')}\n`)
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Assurance plan\n\n**Risk:** Level ${plan.risk.level} / ${plan.risk.label}\n\n**Selection mode:** ${plan.selectionMode}\n\n### Reasons\n${plan.risk.reasons.map((reason) => `- ${reason}`).join('\n')}\n\n### Affected domains\n${plan.risk.affectedDomains.map((domain) => `- ${domain}`).join('\n')}\n`)
          NODE
      - name: Scan repository for privileged secrets and config
        run: node scripts/assurance/scan-secrets.mjs
      - name: Upload assurance plan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assurance-plan-${{ github.run_id }}
          path: assurance-plan.json
          if-no-files-found: error
          retention-days: 30

  foundation-static:
    name: Foundation static, unit and build assurance
    needs: assurance-plan
    if: ${{ needs.assurance-plan.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: npm
      - name: Pin npm
        run: npm install --global npm@11.19.0 --no-audit --no-fund
      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate Business subject promotion provenance
        run: node scripts/assurance/validate-business-subject-provenance.mjs
      - name: Validate Business subject fresh-reassurance contract
        run: node scripts/assurance/business-subject-foundation-reassurance.mjs --self-test
      - name: Validate AQA 7132 specification mapping and v0.7 gap scope
        run: node scripts/assurance/validate-aqa-business-7132-specification-mapping.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npm run build

  responsive-browser:
    name: Responsive browser assurance (${{ matrix.project }}, shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    needs: assurance-plan
    if: ${{ needs.assurance-plan.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      # Desktop is the long-running browser lane. Split its complete project
      # into two disjoint Playwright shards; phone and tablet stay unsharded.
      # All four jobs must pass for the matrix result and Foundation quality.
      matrix:
        include:
          - project: phone
            shardIndex: 1
            shardTotal: 1
          - project: tablet
            shardIndex: 1
            shardTotal: 1
          - project: desktop
            shardIndex: 1
            shardTotal: 2
          - project: desktop
            shardIndex: 2
            shardTotal: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: npm
      - name: Pin npm
        run: npm install --global npm@11.19.0 --no-audit --no-fund
      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium for browser assurance
        timeout-minutes: 10
        run: npx playwright install chromium
      - name: Responsive browser assurance
        timeout-minutes: 20
        env:
          LEARNER_DESIGN_SHOTS: '1'
          REVISION_BROWSER_SELECTION: ${{ needs.assurance-plan.outputs.selection_mode }}
          REVISION_BROWSER_FILES: ${{ needs.assurance-plan.outputs.browser_files }}
          REVISION_BROWSER_PROJECT: ${{ matrix.project }}
          REVISION_BROWSER_SHARD: ${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        run: node scripts/assurance/run-browser-tests.mjs "${REVISION_BROWSER_PROJECT}"
      - name: Verify restricted production pilot boundary
        if: ${{ matrix.project == 'desktop' && matrix.shardIndex == 1 }}
        timeout-minutes: 8
        env:
          REVISION_PILOT_GATE_CHECK: '1'
        run: npx playwright test tests/e2e/fi001-pilot-boundary.spec.ts tests/e2e/rec10-pilot-boundary.spec.ts --project=desktop
      - name: Upload interface visual regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interface-visual-regression-${{ github.run_id }}-${{ matrix.project }}-${{ matrix.shardIndex }}of${{ matrix.shardTotal }}
          path: |
            test-results
            tests/e2e/interface-visual-regression.spec.ts-snapshots
          if-no-files-found: ignore
          retention-days: 30

  # Preserve the required 'Foundation quality' status while failing closed if
  # ANY browser viewport/shard, static check or assurance-plan prerequisite fails.
  foundation-quality:
    name: Foundation quality
    if: always()
    needs: [assurance-plan, foundation-static, responsive-browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify risk-selected foundation assurance
        env:
          ASSURANCE_PLAN: ${{ needs.assurance-plan.result }}
          DOCS_ONLY: ${{ needs.assurance-plan.outputs.docs_only }}
          SELECTION_MODE: ${{ needs.assurance-plan.outputs.selection_mode }}
          STATIC_QUALITY: ${{ needs.foundation-static.result }}
          RESPONSIVE_BROWSER: ${{ needs.responsive-browser.result }}
        run: |
          set -euo pipefail
          if [ "$ASSURANCE_PLAN" != "success" ]; then
            echo "::error::Assurance plan or secret scanning failed: $ASSURANCE_PLAN"
            exit 1
          fi
          if [ "$DOCS_ONLY" = "true" ]; then
            if [ "$STATIC_QUALITY" != "skipped" ] || [ "$RESPONSIVE_BROWSER" != "skipped" ]; then
              echo "::error::Docs-only plan requires explicit skips for both code and browser suites."
              exit 1
            fi
            echo "Docs-only CI: secret scan, assurance-plan and independent database assurance remain required."
          else
            if [ "$SELECTION_MODE" != "conservative-full" ] && [ "$SELECTION_MODE" != "learn-targeted" ] && [ "$SELECTION_MODE" != "practice-targeted" ]; then
              echo "::error::Unrecognised executable-code selection mode: $SELECTION_MODE"
              exit 1
            fi
            if [ "$STATIC_QUALITY" != "success" ] || [ "$RESPONSIVE_BROWSER" != "success" ]; then
              echo "::error::Required foundation assurance failed (static=$STATIC_QUALITY, browser=$RESPONSIVE_BROWSER)."
              exit 1
            fi
            echo "All Foundation quality prerequisites passed across phone, tablet and desktop (mode=$SELECTION_MODE)."
          fi

  database-assurance:
    name: Database, RLS and protected service assurance
    needs: assurance-plan
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
      - name: Pin npm
        run: npm install --global npm@11.19.0 --no-audit --no-fund
      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0
      - name: Start isolated Supabase test stack and replay migrations
        run: supabase start
      - name: Export isolated Supabase client credentials
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          {
            echo "SUPABASE_URL=http://127.0.0.1:54321"
            echo "SUPABASE_ANON_KEY=${ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
            echo "VITE_SUPABASE_URL=http://127.0.0.1:54321"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=${ANON_KEY}"
            echo "REVISION_SUPABASE_INTEGRATION=1"
          } >> "$GITHUB_ENV"
      - name: Verify anonymous release readiness contract
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            --request POST \
            --header "apikey: ${SUPABASE_ANON_KEY}" \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "${SUPABASE_URL}/rest/v1/rpc/revision_release_readiness")"
          test "$(jq -r '.contract // empty' <<<"$response")" = 'r2-exam-attempt-v1'
          test "$(jq -r '.ready // false' <<<"$response")" = 'true'
          test "$(jq -r '.checks.weeklyAvailability // false' <<<"$response")" = 'true'
          test "$(jq -r '.checks.learnExposures // false' <<<"$response")" = 'true'
          test "$(jq -r '.checks.practiceCheckpoints // false' <<<"$response")" = 'true'
          test "$(jq -r '.checks.examAttempts // false' <<<"$response")" = 'true'
      - name: Run pgTAP database and RLS assurance
        run: |
          supabase test db supabase/tests/database-assurance.test.sql
          supabase test db supabase/tests/learner-plan-assurance.test.sql
          supabase test db supabase/tests/starting-check-assurance.test.sql
          supabase test db supabase/tests/student-first-use-assurance.test.sql
          supabase test db supabase/tests/learner-planned-sessions-assurance.test.sql
          supabase test db supabase/tests/practice-checkpoint-assurance.test.sql
          supabase test db supabase/tests/exam-attempt-assurance.test.sql
      - name: Run authenticated persistence and reload integration assurance
        run: npx vitest run tests/integration/supabase-persistence.test.ts
      # The Supabase CLI pulls the Edge runtime from public ECR, whose anonymous
      # data quota is shared across GitHub runners and can refuse the pull
      # ("toomanyrequests"). Pre-load the same tag from GHCR (or Docker Hub) and
      # retag it so the CLI finds it locally. The tag must match what Supabase
      # CLI 2.111.0 expects; if both mirrors fail, the CLI still tries ECR.
      - name: Pre-load Edge runtime image from GHCR
        run: |
          set -uo pipefail
          target='public.ecr.aws/supabase/edge-runtime:v1.74.2'
          for source in 'ghcr.io/supabase/edge-runtime:v1.74.2' 'supabase/edge-runtime:v1.74.2'; do
            if docker pull "$source"; then
              docker tag "$source" "$target"
              echo "Edge runtime pre-loaded from $source"
              exit 0
            fi
          done
          echo "::warning::Could not pre-load the Edge runtime from GHCR or Docker Hub; falling back to public ECR."
      - name: Serve protected Edge Functions from repository source
        run: |
          set -euo pipefail
          nohup supabase functions serve > /tmp/revision-edge-functions.log 2>&1 &
          echo $! > /tmp/revision-edge-functions.pid
          ready=false
          for attempt in $(seq 1 60); do
            status="$(curl --silent --output /tmp/admin-edge-probe.txt --write-out '%{http_code}' \
              --request POST \
              --header "apikey: ${SUPABASE_ANON_KEY}" \
              --header 'Content-Type: application/json' \
              --data '{}' \
              "${SUPABASE_URL}/functions/v1/admin-operations" || true)"
            if [ "$status" = "401" ]; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != "true" ]; then
            echo 'Protected Edge Functions did not become ready with the expected unauthenticated 401 boundary.' >&2
            cat /tmp/revision-edge-functions.log >&2 || true
            cat /tmp/admin-edge-probe.txt >&2 || true
            exit 1
          fi
      - name: Run protected Edge Function authorization integration assurance
        env:
          REVISION_EDGE_INTEGRATION: '1'
        run: npx vitest run tests/integration/edge-operations.test.ts
      - name: Install Chromium for database-backed browser assurance
        timeout-minutes: 10
        run: npx playwright install chromium
      - name: Run isolated database-backed browser persistence and new-account first-use assurance
        env:
          REVISION_BROWSER_DB_INTEGRATION: '1'
        run: npx playwright test tests/e2e/database-persistence.spec.ts tests/e2e/first-use-real-service.spec.ts --project=desktop
      - name: Stop isolated Supabase test stack
        if: always()
        run: |
          if [ -f /tmp/revision-edge-functions.pid ]; then
            kill "$(cat /tmp/revision-edge-functions.pid)" 2>/dev/null || true
          fi
          supabase stop --no-backup
