name: Temporary AQA 7132 batch Blueprint refresh

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'content/aqa-7132-resolve-question-escalations' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.19.0 --no-audit --no-fund

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Regenerate batch Blueprints by software only
        env:
          CONTENT_FACTORY_WRITE_BATCH_BLUEPRINTS: '1'
        run: npx vitest run scripts/assurance/aqa-business-7132-batch-blueprint.test.ts --reporter=verbose

      - name: Commit exact generated evidence and remove this temporary workflow
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          rm .github/workflows/tmp-refresh-aqa-7132-batch-blueprints.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content-factory/slices/aqa-7132-3.1-3.2/BLUEPRINT.json \
                  content-factory/slices/aqa-7132-3.3/BLUEPRINT.json \
                  content-factory/slices/aqa-7132-3.4/BLUEPRINT.json \
                  content-factory/slices/aqa-7132-3.6/BLUEPRINT.json \
                  content-factory/slices/aqa-7132-3.7/BLUEPRINT.json \
                  content-factory/slices/aqa-7132-3.8-3.9/BLUEPRINT.json \
                  content-factory/slices/aqa-7132-3.10/BLUEPRINT.json \
                  content-factory/slices/aqa-7132-3.5-topup/BLUEPRINT.json \
                  content-factory/slices/aqa-7132-batches-report.json \
                  .github/workflows/tmp-refresh-aqa-7132-batch-blueprints.yml
          git diff --cached --check
          git diff --cached --quiet && { echo "No generated changes to commit"; exit 1; }
          git commit -m "Refresh AQA 7132 batch Blueprint evidence"
          git push origin "HEAD:${HEAD_BRANCH}"
