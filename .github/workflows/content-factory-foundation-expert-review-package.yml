name: Content Factory Foundation Expert Review Package

on:
  workflow_dispatch:
    inputs:
      external_source_challenge_json:
        description: 'Passing structured foundation_external_source_challenge_report JSON for the exact candidate/fingerprint'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: content-factory-foundation-expert-review-package
  cancel-in-progress: false

jobs:
  foundation-expert-review-package:
    name: Assemble retained real-course Foundation expert review package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_RUN_ID: '34017938933'
      SOURCE_ARTIFACT_ID: '9984534245'
      SOURCE_ARTIFACT_NAME: content-factory-foundation-live-proof-5734f266a551069b27ea9a158a37c7ef93db9bb6
      SOURCE_ARTIFACT_DIGEST: sha256:0b11868b48bfdbdeb5fd8db5fbca4378e62e227f37949347c97175e87aa2622a
      SOURCE_HEAD_SHA: 5734f266a551069b27ea9a158a37c7ef93db9bb6
      SOURCE_FOUNDATION_FINGERPRINT: 843eb478fb43585315b2ea38a69e1499abae10b1227e9bade54dc6117d272976
      SOURCE_PROOF_PATH: .artifacts/content-factory-foundation-expert-review-source/aqa-a-level-business-7132-foundation-5734f266a551-1788677993717.json
      REVIEW_RUN_ID: '34022356623'
      REVIEW_ARTIFACT_ID: '9985944396'
      REVIEW_ARTIFACT_NAME: content-factory-foundation-independent-review-proof-d7607b0d30f97fb750956dbb573404373aae1a4d
      REVIEW_ARTIFACT_DIGEST: sha256:97fd656721c926355a80b31bebf2d2e79c72032449ee4490b91a5ac87511587b
      REVIEWED_COMMIT: d7607b0d30f97fb750956dbb573404373aae1a4d
      REVIEW_PROOF_PATH: .artifacts/content-factory-foundation-expert-review-assurance/aqa-a-level-business-7132-foundation-5734f266a551-1788677993717-independent-review.json
      FOUNDATION_FINGERPRINT: 09acd5d79698fa029c9b9b53138878c893940eed5c6b2534695aaba6c7779456
      EXTERNAL_CHALLENGE_PATH: .artifacts/content-factory-foundation-expert-review-challenge/external-source-challenge.json
    steps:
      - name: Checkout approved main
        uses: actions/checkout@v6

      - name: Verify retained proof identities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source_artifact_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}")"
          review_artifact_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${REVIEW_ARTIFACT_ID}")"

          source_name="$(jq -r '.name' <<<"${source_artifact_json}")"
          source_digest="$(jq -r '.digest' <<<"${source_artifact_json}")"
          source_run_id="$(jq -r '.workflow_run.id' <<<"${source_artifact_json}")"
          source_head_sha="$(jq -r '.workflow_run.head_sha' <<<"${source_artifact_json}")"
          test "${source_name}" = "${SOURCE_ARTIFACT_NAME}"
          test "${source_digest}" = "${SOURCE_ARTIFACT_DIGEST}"
          test "${source_run_id}" = "${SOURCE_RUN_ID}"
          test "${source_head_sha}" = "${SOURCE_HEAD_SHA}"

          review_name="$(jq -r '.name' <<<"${review_artifact_json}")"
          review_digest="$(jq -r '.digest' <<<"${review_artifact_json}")"
          review_run_id="$(jq -r '.workflow_run.id' <<<"${review_artifact_json}")"
          review_head_sha="$(jq -r '.workflow_run.head_sha' <<<"${review_artifact_json}")"
          test "${review_name}" = "${REVIEW_ARTIFACT_NAME}"
          test "${review_digest}" = "${REVIEW_ARTIFACT_DIGEST}"
          test "${review_run_id}" = "${REVIEW_RUN_ID}"
          test "${review_head_sha}" = "${REVIEWED_COMMIT}"

      - name: Download retained Foundation and assurance proofs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .artifacts/content-factory-foundation-expert-review-source
          mkdir -p .artifacts/content-factory-foundation-expert-review-assurance
          gh run download "${SOURCE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "${SOURCE_ARTIFACT_NAME}" \
            --dir .artifacts/content-factory-foundation-expert-review-source
          gh run download "${REVIEW_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "${REVIEW_ARTIFACT_NAME}" \
            --dir .artifacts/content-factory-foundation-expert-review-assurance
          test -f "${SOURCE_PROOF_PATH}"
          test -f "${REVIEW_PROOF_PATH}"

      - name: Materialize fresh external-source challenge evidence
        env:
          EXTERNAL_SOURCE_CHALLENGE_JSON: ${{ inputs.external_source_challenge_json }}
        run: |
          mkdir -p "$(dirname "${EXTERNAL_CHALLENGE_PATH}")"
          printf '%s' "${EXTERNAL_SOURCE_CHALLENGE_JSON}" > "${EXTERNAL_CHALLENGE_PATH}"
          jq -e '.artifactType == "foundation_external_source_challenge_report"' "${EXTERNAL_CHALLENGE_PATH}" >/dev/null

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.19.0 --no-audit --no-fund

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Assemble retained qualified-human review package
        env:
          CONTENT_FACTORY_FOUNDATION_EXPERT_REVIEW_PACKAGE_PROOF: '1'
          CONTENT_FACTORY_FOUNDATION_SOURCE_PROOF_PATH: ${{ env.SOURCE_PROOF_PATH }}
          CONTENT_FACTORY_FOUNDATION_REVIEW_PROOF_PATH: ${{ env.REVIEW_PROOF_PATH }}
          CONTENT_FACTORY_FOUNDATION_EXTERNAL_SOURCE_CHALLENGE_PATH: ${{ env.EXTERNAL_CHALLENGE_PATH }}
          CONTENT_FACTORY_FOUNDATION_SOURCE_HEAD_SHA: ${{ env.SOURCE_HEAD_SHA }}
          CONTENT_FACTORY_FOUNDATION_SOURCE_FINGERPRINT: ${{ env.SOURCE_FOUNDATION_FINGERPRINT }}
          CONTENT_FACTORY_FOUNDATION_FINGERPRINT: ${{ env.FOUNDATION_FINGERPRINT }}
          CONTENT_FACTORY_FOUNDATION_REVIEWED_COMMIT: ${{ env.REVIEWED_COMMIT }}
          CONTENT_FACTORY_PACKAGING_COMMIT: ${{ github.sha }}
          CONTENT_FACTORY_FOUNDATION_SOURCE_RUN_ID: ${{ env.SOURCE_RUN_ID }}
          CONTENT_FACTORY_FOUNDATION_SOURCE_ARTIFACT_NAME: ${{ env.SOURCE_ARTIFACT_NAME }}
          CONTENT_FACTORY_FOUNDATION_SOURCE_ARTIFACT_DIGEST: ${{ env.SOURCE_ARTIFACT_DIGEST }}
          CONTENT_FACTORY_FOUNDATION_REVIEW_RUN_ID: ${{ env.REVIEW_RUN_ID }}
          CONTENT_FACTORY_FOUNDATION_REVIEW_ARTIFACT_NAME: ${{ env.REVIEW_ARTIFACT_NAME }}
          CONTENT_FACTORY_FOUNDATION_REVIEW_ARTIFACT_DIGEST: ${{ env.REVIEW_ARTIFACT_DIGEST }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npx vitest run src/content-factory/foundation-expert-review-package-proof.integration.test.ts --reporter=verbose

      - name: Upload expert review package
        uses: actions/upload-artifact@v4
        with:
          name: content-factory-foundation-expert-review-package-${{ github.sha }}
          path: .artifacts/content-factory-foundation-expert-review-package/
          if-no-files-found: error
          retention-days: 30
