name: Content Factory AQA Business 7132 Item Coverage

on:
  pull_request:
    paths:
      - 'research/aqa-business-7132/**'
      - 'research/business-subject-foundation/**'
      - 'scripts/content-factory/load-business-subject-foundation-candidate-*.mjs'
      - 'scripts/assurance/check-aqa-business-7132-item-coverage*'
      - '.github/workflows/content-factory-aqa-business-7132-item-coverage.yml'

permissions:
  contents: read

jobs:
  item-coverage:
    name: AQA 7132 item-level coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: npm
      - name: Pin npm
        run: npm install --global npm@11.19.0 --no-audit --no-fund
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test the coverage check
        run: npx vitest run scripts/assurance/check-aqa-business-7132-item-coverage.test.mjs
      - name: Materialise updated coverage report for this PR head
        run: node scripts/assurance/check-aqa-business-7132-item-coverage.mjs --write
      - name: Upload regenerated coverage report
        uses: actions/upload-artifact@v4
        with:
          name: aqa-7132-item-coverage-report-${{ github.sha }}
          path: research/aqa-business-7132/2027/ITEM_COVERAGE_REPORT.json
          retention-days: 1
