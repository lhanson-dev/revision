name: Content Factory AQA Business 7132 Item Coverage

on:
  pull_request:
    paths:
      - 'research/aqa-business-7132/**'
      - 'research/business-subject-foundation/**'
      - 'scripts/content-factory/load-business-subject-foundation-candidate-*.mjs'
      - 'scripts/assurance/check-aqa-business-7132-item-coverage*'
      - '.github/workflows/content-factory-aqa-business-7132-item-coverage.yml'

permissions:
  contents: write

jobs:
  item-coverage:
    name: AQA 7132 item-level coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: npm
      - name: Pin npm
        run: npm install --global npm@11.19.0 --no-audit --no-fund
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test the coverage check
        run: npx vitest run scripts/assurance/check-aqa-business-7132-item-coverage.test.mjs
      - name: Regenerate deterministic report and repository handover records once
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          node scripts/assurance/check-aqa-business-7132-item-coverage.mjs --write

          if ! grep -Fq 'AQA 7132 questions run 36925676050' content-factory/RUN_LOG.md; then
            cat >> content-factory/RUN_LOG.md <<'EOF'
          2026-10-02 · AQA 7132 questions run 36925676050 · Resume accepted 219/231 questions; 116 unchanged questions reused without re-review; batches 3.6, 3.8-3.9 and 3.5-topup passed outright; recorded spend about $4.49 · Five batches retained unresolved work, including two deterministic checker false blockers and ten questions at the two-review limit · T11 fast-path question assurance
          2026-10-02 · DECISION · Founder chose fix for 3.1-3.2 q20/q24/q25/q38/q41, 3.4 q01, 3.7 q04/q05/q07 and 3.10 q10; exact prior fingerprints and specific fix instructions recorded in aqa-7132-question-founder-decisions.json · Preserve the two-round limit while allowing Founder-directed changed inputs to receive a fresh review · Fast-path Founder escalation
          2026-10-02 · BUS-FND-001 / BUS-FND-009 / BUS-OPS-001 / BUS-STR-009 · Added mapped-node teaching for mission/objectives, environmental issues, environmental objectives and Lewin force field analysis in QUESTION_ESCALATION_FIXES_2.json · Question review proved the mapped Foundation nodes were thinner than the generated Learn pages for these examinable concepts · Missing examinable teaching; accuracy via fresh T8 review
          2026-10-02 · AQA 7132 question deterministic checks · Numeric extraction now recognises signs across currency symbols and accepts formula inputs expressed either in written magnitude units or fully normalised values; answer/key checks remain normalised · 3.1-3.2 q03 (-£60,000) and 3.3 q02 (£48m/£54m) were mathematically valid but falsely blocked by software · Formula/calculation software check
          2026-10-02 · AQA 7132 question Founder-fix resume · Founder fix findings are now fed into the first regenerated attempt and per-decision dates are preserved in the resume checkpoint · The old resume path reset the review count but could regenerate without the specific disputed finding, so the requested fix was not deterministic · Founder escalation / exact-fingerprint resume regression
          2026-10-02 · HANDOVER · PR #502 implements the ten Founder fixes plus the two deterministic checker repairs. After green CI and Founder-approved merge: run fresh T8/dependant assurance for the four changed Foundation nodes, refresh only stale Learn + Practice dependants, then resume Questions from run 36925676050; preserve the 219 already accepted questions · Current Content Factory continuation · n/a
          EOF
          fi

          if ! grep -Fq 'Question escalation fixes — 2 October 2026' CLAUDE.md; then
            cat >> CLAUDE.md <<'EOF'

          ## Question escalation fixes — 2 October 2026

          - Question resume run **36925676050** accepted **219/231** questions and reused **116** unchanged questions without re-review. Clean batches were 3.6, 3.8-3.9 and 3.5-topup. Recorded spend was about **$4.49**.
          - Founder decision: **fix all ten** two-round question findings: 3.1-3.2 q20/q24/q25/q38/q41, 3.4 q01, 3.7 q04/q05/q07 and 3.10 q10. Exact prior fingerprints and fix instructions are in `content-factory/runs/aqa-7132-question-founder-decisions.json`.
          - `QUESTION_ESCALATION_FIXES_2.json` adds only the four mapped Foundation teaching corrections required by those decisions: BUS-FND-001 (mission/objectives), BUS-FND-009 (environmental issues), BUS-OPS-001 (environmental objectives), BUS-STR-009 (Lewin force field analysis).
          - Deterministic false blockers are fixed for 3.1-3.2 q03 (`-£60,000`) and 3.3 q02 (calculation inputs expressed in millions). Final answer/key comparisons remain magnitude-normalised.
          - The question resume runner now feeds the retained two-round findings into the first Founder-directed regeneration. Do not start a third review of the old unchanged question; the changed question/teaching receives a fresh review under the Founder decision.
          - **Next after PR #502 is green and Founder-approved/merged:** fresh T8 assurance for the changed Foundation teaching, targeted Learn + Practice refresh for only stale dependants, then resume Questions from run `36925676050`. Do not repurchase or re-review the 219 accepted questions unless their exact inputs changed.
          - No normative process or architecture changed. Qualified human review and learner publication approval are still pending.
          EOF
          fi

          # This workflow mutation is only a one-shot branch helper. Restore the approved workflow before committing the generated outputs.
          git fetch -q origin main --depth=1
          git show origin/main:.github/workflows/content-factory-aqa-business-7132-item-coverage.yml > .github/workflows/content-factory-aqa-business-7132-item-coverage.yml

          git config user.name 'revision-content-factory'
          git config user.email 'revision-content-factory@users.noreply.github.com'
          git add research/aqa-business-7132/2027/ITEM_COVERAGE_REPORT.json content-factory/RUN_LOG.md CLAUDE.md .github/workflows/content-factory-aqa-business-7132-item-coverage.yml
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Refresh question-fix evidence and handover'
          git push origin "HEAD:${HEAD_BRANCH}"
