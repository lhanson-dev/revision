name: Content Factory AQA Business 7132 Item Coverage

on:
  pull_request:
    paths:
      - 'research/aqa-business-7132/**'
      - 'research/business-subject-foundation/**'
      - 'scripts/content-factory/load-business-subject-foundation-candidate-*.mjs'
      - 'scripts/assurance/check-aqa-business-7132-item-coverage*'
      - '.github/workflows/content-factory-aqa-business-7132-item-coverage.yml'

permissions:
  contents: write

jobs:
  item-coverage:
    name: AQA 7132 item-level coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: npm
      - name: Pin npm
        run: npm install --global npm@11.19.0 --no-audit --no-fund
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test the coverage check
        run: npx vitest run scripts/assurance/check-aqa-business-7132-item-coverage.test.mjs
      - name: Regenerate deterministic coverage report
        run: node scripts/assurance/check-aqa-business-7132-item-coverage.mjs --write
      - name: Commit refreshed report if needed
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- research/aqa-business-7132/2027/ITEM_COVERAGE_REPORT.json; then
            echo "Coverage report already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/aqa-business-7132/2027/ITEM_COVERAGE_REPORT.json
          git commit -m "Refresh AQA 7132 item coverage report"
          git push origin "HEAD:${HEAD_BRANCH}"
      - name: Verify committed coverage report
        run: node scripts/assurance/check-aqa-business-7132-item-coverage.mjs
