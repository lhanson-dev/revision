name: Content Factory Foundation Internal Learning Assurance Proof

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Foundation Live Proof run ID
        required: true
        type: string
      source_artifact_id:
        description: Retained Foundation Live Proof artifact ID
        required: true
        type: string
      source_head_sha:
        description: Exact Foundation compilation SHA
        required: true
        type: string
      source_foundation_fingerprint:
        description: Foundation fingerprint retained by the source proof
        required: true
        type: string
      ai_assured_run_id:
        description: Successful Foundation AI-Assured Proof run ID
        required: true
        type: string
      ai_assured_artifact_id:
        description: Retained Foundation AI-Assured Proof artifact ID
        required: true
        type: string
      ai_assured_head_sha:
        description: Exact approved-main SHA that executed the AI assurance gate
        required: true
        type: string
      learning_run_id:
        description: Successful retained internal Learn/Practice generation run ID
        required: true
        type: string
      learning_artifact_id:
        description: Retained internal Learn/Practice artifact ID
        required: true
        type: string
      learning_head_sha:
        description: Exact approved-main SHA that generated the retained Learn/Practice bundle
        required: true
        type: string
      foundation_fingerprint:
        description: Exact AI-assured Foundation fingerprint bound to the generated assets
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: content-factory-foundation-internal-learning-assurance-proof
  cancel-in-progress: false

jobs:
  foundation-internal-learning-assurance-proof:
    name: Independently assure retained internal Learn and Practice assets
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 289 &&
       github.event.comment.user.login == 'lhanson-dev' &&
       github.event.comment.author_association == 'OWNER' &&
       startsWith(github.event.comment.body, 'revision-run-foundation-internal-learning-assurance-proof:v1'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact approved-main event SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Resolve exact retained proof identities
        env:
          REVISION_TRIGGER_MARKER: revision-run-foundation-internal-learning-assurance-proof:v1
          REVISION_TRIGGER_BODY: ${{ github.event.comment.body || '' }}
          REVISION_INPUT_SOURCE_RUN_ID: ${{ inputs.source_run_id || '' }}
          REVISION_INPUT_SOURCE_ARTIFACT_ID: ${{ inputs.source_artifact_id || '' }}
          REVISION_INPUT_SOURCE_HEAD_SHA: ${{ inputs.source_head_sha || '' }}
          REVISION_INPUT_SOURCE_FOUNDATION_FINGERPRINT: ${{ inputs.source_foundation_fingerprint || '' }}
          REVISION_INPUT_AI_ASSURED_RUN_ID: ${{ inputs.ai_assured_run_id || '' }}
          REVISION_INPUT_AI_ASSURED_ARTIFACT_ID: ${{ inputs.ai_assured_artifact_id || '' }}
          REVISION_INPUT_AI_ASSURED_HEAD_SHA: ${{ inputs.ai_assured_head_sha || '' }}
          REVISION_INPUT_LEARNING_RUN_ID: ${{ inputs.learning_run_id || '' }}
          REVISION_INPUT_LEARNING_ARTIFACT_ID: ${{ inputs.learning_artifact_id || '' }}
          REVISION_INPUT_LEARNING_HEAD_SHA: ${{ inputs.learning_head_sha || '' }}
          REVISION_INPUT_FOUNDATION_FINGERPRINT: ${{ inputs.foundation_fingerprint || '' }}
        run: node scripts/assurance/foundation-internal-learning-assurance-proof-trigger.mjs

      - name: Verify retained proof identities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source_run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")"
          test "$(jq -r '.name' <<<"${source_run_json}")" = 'Content Factory Foundation Live Proof'
          test "$(jq -r '.status' <<<"${source_run_json}")" = 'completed'
          test "$(jq -r '.conclusion' <<<"${source_run_json}")" = 'success'
          test "$(jq -r '.head_branch' <<<"${source_run_json}")" = 'main'
          test "$(jq -r '.head_sha' <<<"${source_run_json}")" = "${SOURCE_HEAD_SHA}"

          source_artifact_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}")"
          source_expected_name="content-factory-foundation-live-proof-${SOURCE_HEAD_SHA}"
          source_name="$(jq -r '.name' <<<"${source_artifact_json}")"
          source_digest="$(jq -r '.digest' <<<"${source_artifact_json}")"
          test "${source_name}" = "${source_expected_name}"
          test "$(jq -r '.workflow_run.id' <<<"${source_artifact_json}")" = "${SOURCE_RUN_ID}"
          test "$(jq -r '.workflow_run.head_sha' <<<"${source_artifact_json}")" = "${SOURCE_HEAD_SHA}"
          test "$(jq -r '.expired' <<<"${source_artifact_json}")" = 'false'
          test -n "${source_digest}"
          test "${source_digest}" != 'null'

          ai_run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${AI_ASSURED_RUN_ID}")"
          test "$(jq -r '.name' <<<"${ai_run_json}")" = 'Content Factory Foundation AI-Assured Proof'
          test "$(jq -r '.status' <<<"${ai_run_json}")" = 'completed'
          test "$(jq -r '.conclusion' <<<"${ai_run_json}")" = 'success'
          test "$(jq -r '.head_branch' <<<"${ai_run_json}")" = 'main'
          test "$(jq -r '.head_sha' <<<"${ai_run_json}")" = "${AI_ASSURED_HEAD_SHA}"

          ai_artifact_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${AI_ASSURED_ARTIFACT_ID}")"
          ai_expected_name="content-factory-foundation-ai-assured-proof-${AI_ASSURED_HEAD_SHA}"
          ai_name="$(jq -r '.name' <<<"${ai_artifact_json}")"
          ai_digest="$(jq -r '.digest' <<<"${ai_artifact_json}")"
          test "${ai_name}" = "${ai_expected_name}"
          test "$(jq -r '.workflow_run.id' <<<"${ai_artifact_json}")" = "${AI_ASSURED_RUN_ID}"
          test "$(jq -r '.workflow_run.head_sha' <<<"${ai_artifact_json}")" = "${AI_ASSURED_HEAD_SHA}"
          test "$(jq -r '.expired' <<<"${ai_artifact_json}")" = 'false'
          test -n "${ai_digest}"
          test "${ai_digest}" != 'null'

          learning_run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${LEARNING_RUN_ID}")"
          test "$(jq -r '.name' <<<"${learning_run_json}")" = 'Content Factory Foundation Internal Learning Proof'
          test "$(jq -r '.status' <<<"${learning_run_json}")" = 'completed'
          test "$(jq -r '.conclusion' <<<"${learning_run_json}")" = 'success'
          test "$(jq -r '.head_branch' <<<"${learning_run_json}")" = 'main'
          test "$(jq -r '.head_sha' <<<"${learning_run_json}")" = "${LEARNING_HEAD_SHA}"

          learning_artifact_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${LEARNING_ARTIFACT_ID}")"
          learning_expected_name="content-factory-foundation-internal-learning-proof-${LEARNING_HEAD_SHA}"
          learning_name="$(jq -r '.name' <<<"${learning_artifact_json}")"
          learning_digest="$(jq -r '.digest' <<<"${learning_artifact_json}")"
          test "${learning_name}" = "${learning_expected_name}"
          test "$(jq -r '.workflow_run.id' <<<"${learning_artifact_json}")" = "${LEARNING_RUN_ID}"
          test "$(jq -r '.workflow_run.head_sha' <<<"${learning_artifact_json}")" = "${LEARNING_HEAD_SHA}"
          test "$(jq -r '.expired' <<<"${learning_artifact_json}")" = 'false'
          test -n "${learning_digest}"
          test "${learning_digest}" != 'null'

          echo "SOURCE_ARTIFACT_NAME=${source_name}" >> "${GITHUB_ENV}"
          echo "SOURCE_ARTIFACT_DIGEST=${source_digest}" >> "${GITHUB_ENV}"
          echo "AI_ASSURED_ARTIFACT_NAME=${ai_name}" >> "${GITHUB_ENV}"
          echo "AI_ASSURED_ARTIFACT_DIGEST=${ai_digest}" >> "${GITHUB_ENV}"
          echo "LEARNING_ARTIFACT_NAME=${learning_name}" >> "${GITHUB_ENV}"
          echo "LEARNING_ARTIFACT_DIGEST=${learning_digest}" >> "${GITHUB_ENV}"

      - name: Download and verify retained evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source_dir='.artifacts/content-factory-foundation-internal-learning-assurance-source'
          ai_dir='.artifacts/content-factory-foundation-internal-learning-assurance-ai'
          learning_dir='.artifacts/content-factory-foundation-internal-learning-assurance-learning'
          mkdir -p "${source_dir}" "${ai_dir}" "${learning_dir}"
          gh run download "${SOURCE_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --name "${SOURCE_ARTIFACT_NAME}" --dir "${source_dir}"
          gh run download "${AI_ASSURED_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --name "${AI_ASSURED_ARTIFACT_NAME}" --dir "${ai_dir}"
          gh run download "${LEARNING_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --name "${LEARNING_ARTIFACT_NAME}" --dir "${learning_dir}"

          mapfile -t source_files < <(find "${source_dir}" -maxdepth 1 -type f -name '*.json' -print)
          mapfile -t ai_files < <(find "${ai_dir}" -maxdepth 1 -type f -name '*.json' -print)
          mapfile -t learning_files < <(find "${learning_dir}" -maxdepth 1 -type f -name '*.json' -print)
          test "${#source_files[@]}" -eq 1
          test "${#ai_files[@]}" -eq 1
          test "${#learning_files[@]}" -eq 1
          source_proof_path="${source_files[0]}"
          ai_proof_path="${ai_files[0]}"
          learning_proof_path="${learning_files[0]}"

          test "$(jq -r '.artifactType' "${source_proof_path}")" = 'foundation_live_real_course_proof_evidence'
          test "$(jq -r '.contentHeadSha' "${source_proof_path}")" = "${SOURCE_HEAD_SHA}"
          test "$(jq -r '.foundationFingerprint' "${source_proof_path}")" = "${SOURCE_FOUNDATION_FINGERPRINT}"

          test "$(jq -r '.artifactType' "${ai_proof_path}")" = 'foundation_real_course_ai_assured_proof_evidence'
          test "$(jq -r '.challengeImplementationCommit' "${ai_proof_path}")" = "${AI_ASSURED_HEAD_SHA}"
          test "$(jq -r '.foundationFingerprint' "${ai_proof_path}")" = "${FOUNDATION_FINGERPRINT}"
          test "$(jq -r '.finalState' "${ai_proof_path}")" = 'ai_assured'
          test "$(jq -r '.foundationApprovalStatus' "${ai_proof_path}")" = 'not_approved'
          test "$(jq -r '.learnerPublicationEligible' "${ai_proof_path}")" = 'false'

          test "$(jq -r '.artifactType' "${learning_proof_path}")" = 'foundation_internal_learning_live_proof_evidence'
          test "$(jq -r '.generationImplementationCommit' "${learning_proof_path}")" = "${LEARNING_HEAD_SHA}"
          test "$(jq -r '.foundationFingerprint' "${learning_proof_path}")" = "${FOUNDATION_FINGERPRINT}"
          test "$(jq -r '.status' "${learning_proof_path}")" = 'pass'
          test "$(jq -r '.learnAssetStatus' "${learning_proof_path}")" = 'pending'
          test "$(jq -r '.practiceAssetStatus' "${learning_proof_path}")" = 'pending'
          test "$(jq -r '.learnerPublicationEligible' "${learning_proof_path}")" = 'false'

          echo "SOURCE_PROOF_PATH=${source_proof_path}" >> "${GITHUB_ENV}"
          echo "AI_ASSURED_PROOF_PATH=${ai_proof_path}" >> "${GITHUB_ENV}"
          echo "LEARNING_PROOF_PATH=${learning_proof_path}" >> "${GITHUB_ENV}"

      - name: Pin npm
        run: npm install --global npm@11.19.0 --no-audit --no-fund

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Independently assure retained internal Learn and Practice assets
        env:
          CONTENT_FACTORY_FOUNDATION_INTERNAL_LEARNING_ASSURANCE_PROOF: '1'
          CONTENT_FACTORY_FOUNDATION_SOURCE_PROOF_PATH: ${{ env.SOURCE_PROOF_PATH }}
          CONTENT_FACTORY_FOUNDATION_AI_ASSURED_PROOF_PATH: ${{ env.AI_ASSURED_PROOF_PATH }}
          CONTENT_FACTORY_FOUNDATION_INTERNAL_LEARNING_PROOF_PATH: ${{ env.LEARNING_PROOF_PATH }}
          CONTENT_FACTORY_FOUNDATION_SOURCE_RUN_ID: ${{ env.SOURCE_RUN_ID }}
          CONTENT_FACTORY_FOUNDATION_SOURCE_ARTIFACT_NAME: ${{ env.SOURCE_ARTIFACT_NAME }}
          CONTENT_FACTORY_FOUNDATION_SOURCE_ARTIFACT_DIGEST: ${{ env.SOURCE_ARTIFACT_DIGEST }}
          CONTENT_FACTORY_FOUNDATION_SOURCE_HEAD_SHA: ${{ env.SOURCE_HEAD_SHA }}
          CONTENT_FACTORY_FOUNDATION_SOURCE_FINGERPRINT: ${{ env.SOURCE_FOUNDATION_FINGERPRINT }}
          CONTENT_FACTORY_FOUNDATION_AI_ASSURED_RUN_ID: ${{ env.AI_ASSURED_RUN_ID }}
          CONTENT_FACTORY_FOUNDATION_AI_ASSURED_ARTIFACT_NAME: ${{ env.AI_ASSURED_ARTIFACT_NAME }}
          CONTENT_FACTORY_FOUNDATION_AI_ASSURED_ARTIFACT_DIGEST: ${{ env.AI_ASSURED_ARTIFACT_DIGEST }}
          CONTENT_FACTORY_FOUNDATION_AI_ASSURED_HEAD_SHA: ${{ env.AI_ASSURED_HEAD_SHA }}
          CONTENT_FACTORY_FOUNDATION_INTERNAL_LEARNING_RUN_ID: ${{ env.LEARNING_RUN_ID }}
          CONTENT_FACTORY_FOUNDATION_INTERNAL_LEARNING_ARTIFACT_NAME: ${{ env.LEARNING_ARTIFACT_NAME }}
          CONTENT_FACTORY_FOUNDATION_INTERNAL_LEARNING_ARTIFACT_DIGEST: ${{ env.LEARNING_ARTIFACT_DIGEST }}
          CONTENT_FACTORY_FOUNDATION_INTERNAL_LEARNING_HEAD_SHA: ${{ env.LEARNING_HEAD_SHA }}
          CONTENT_FACTORY_FOUNDATION_FINGERPRINT: ${{ env.FOUNDATION_FINGERPRINT }}
          CONTENT_FACTORY_ASSURANCE_IMPLEMENTATION_COMMIT: ${{ github.sha }}
          CONTENT_FACTORY_ASSURANCE_MAX_SPEND_USD: '12'
          CONTENT_FACTORY_ASSURANCE_MAX_OUTPUT_TOKENS: '5000'
          CONTENT_FACTORY_ASSURANCE_MODEL: gpt-5.6-terra
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npx vitest run src/content-factory/foundation-internal-learning-assurance-live-proof.integration.test.ts --reporter=verbose

      - name: Upload retained internal learning assurance proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-factory-foundation-internal-learning-assurance-proof-${{ github.sha }}
          path: .artifacts/content-factory-foundation-internal-learning-assurance-proof/
          if-no-files-found: error
          retention-days: 30
