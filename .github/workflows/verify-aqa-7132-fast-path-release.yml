name: Verify AQA 7132 Fast-Path release

on:
  push:
    branches:
      - release/aqa-7132-fast-path-content
    paths:
      - .github/workflows/verify-aqa-7132-fast-path-release.yml

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply canonical learner and documentation wiring
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          screen = Path('src/app/CourseExperienceScreen.tsx')
          text = screen.read_text()
          import_anchor = "import { CourseHeader, courseSectionLabels as sectionLabels } from './CourseHeader'\n"
          import_line = "import { AqaBusinessQuestionBank } from './AqaBusinessQuestionBank'\n"
          if import_line not in text:
            if import_anchor not in text:
              raise SystemExit('CourseExperienceScreen import anchor not found')
            text = text.replace(import_anchor, import_anchor + import_line, 1)

          section_anchor = '          <section className="home-section" aria-labelledby="choose-paper-title">'
          bank_line = "          {course.examBoardName === 'AQA' && course.specificationCode === '7132' && <AqaBusinessQuestionBank />}\n"
          if bank_line not in text:
            if section_anchor not in text:
              raise SystemExit('CourseExperienceScreen Exam Prep anchor not found')
            text = text.replace(section_anchor, bank_line + section_anchor, 1)
          screen.write_text(text)

          tech = Path('docs/technical/Content Factory Foundation-Native Internal Learning Assets.md')
          text = tech.read_text()
          note = '> **Fast-Path release note (4 October 2026):** this document predates the Founder-approved Fast-Path Process (ADR-0029). For courses released through that process, its T12 blocking rules and the Content Accuracy Assurance Gate conditional-pass route control learner publication. Qualified-human subject review may remain pending for a restricted pilot when there are no blocking, escalated or failed teaching items and product claims remain within the governed confidence limits.\n\n'
          purpose_anchor = '## Purpose\n\n'
          if note not in text:
            if purpose_anchor not in text:
              raise SystemExit('Technical-doc purpose anchor not found')
            text = text.replace(purpose_anchor, purpose_anchor + note, 1)
          legacy = 'An AI-assured Foundation may be used only for the explicitly governed internal derivation/testing path. Qualified-human `foundation_approved` status remains mandatory before learner publication.'
          replacement = 'For the legacy Foundation-native pre-production runtime described here, qualified-human `foundation_approved` was the publication boundary. Founder-approved Fast-Path courses use the later Fast-Path T12 blocking and conditional-release rules instead; this legacy sentence must not be used to reintroduce the superseded absolute gate.'
          if legacy in text:
            text = text.replace(legacy, replacement, 1)
          tech.write_text(text)

          log = Path('content-factory/RUN_LOG.md')
          line = '2026-10-04 · AQA 7132 T12 restricted-pilot website release · Promote 81 assured Learn nodes, Foundation-native guided Practice and 245 accepted Revision-authored AQA-style questions into the canonical learner content packs; retain 231 Action-only accepted questions with exact provenance and reuse the 14 committed 3.5 questions · Founder requested the assured course content be put on the website before mock production; zero blocking/escalated/failed items in the promoted evidence chain; qualified human subject review remains pending under conditional-pass claim limits · Fast-Path T12 / Content Accuracy Assurance Gate\n'
          current = log.read_text()
          if line not in current:
            log.write_text(current.rstrip() + '\n' + line)
          PY

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.19.0 --no-audit --no-fund

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify Fast-Path release contract
        run: npx vitest run content/business/aqa-a-level/shared/fast-path-release.test.ts --reporter=verbose

      - name: Build production learner app
        run: npm run build

      - name: Commit verified wiring and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/verify-aqa-7132-fast-path-release.yml
          git add src/app/CourseExperienceScreen.tsx docs/technical/'Content Factory Foundation-Native Internal Learning Assets.md' content-factory/RUN_LOG.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Wire assured AQA 7132 content into learner site'
          git push origin HEAD:release/aqa-7132-fast-path-content

# rerun after normalising legacy 3.5 batch metadata
