name: B7 reviewed visual baselines

on:
  pull_request:
    branches:
      - main

jobs:
  commit-reviewed-baselines:
    if: github.event.pull_request.number == 148 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Download reviewed CI 864 visual artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/b7-reviewed-baselines
          mkdir -p /tmp/b7-reviewed-baselines
          gh run download 32655418540 \
            --repo "${{ github.repository }}" \
            --name interface-visual-regression-32655418540 \
            --dir /tmp/b7-reviewed-baselines

      - name: Stage exactly the 18 reviewed PNG baselines
        run: |
          source_dir=/tmp/b7-reviewed-baselines/tests/e2e/interface-visual-regression.spec.ts-snapshots
          target_dir=tests/e2e/interface-visual-regression.spec.ts-snapshots
          test -d "$source_dir"
          test "$(find "$source_dir" -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 18
          mkdir -p "$target_dir"
          cp "$source_dir"/*.png "$target_dir"/
          test "$(find "$target_dir" -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 18

      - name: Commit reviewed baseline evidence to the PR branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/interface-visual-regression.spec.ts-snapshots/*.png
          if git diff --cached --quiet; then
            echo "Reviewed baselines are already committed."
            exit 0
          fi
          git commit -m "B7.5 commit reviewed visual baselines"
          git push origin "HEAD:${HEAD_REF}"
