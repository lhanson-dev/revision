<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Revision</title>
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url=./app/">
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f8ff;color:#10143f}
    a{color:#3349f4;font-weight:700}
  </style>
</head>
<body data-revision-redirect="app">
  <p>Opening <a href="./app/">Revision</a>…</p>
  <script>
    const target = new URL('./app/', window.location.href)
    target.search = window.location.search
    target.hash = window.location.hash
    window.location.replace(target.toString())
  </script>
</body>
</html>
