<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">REV Living E</title>
  <desc id="desc">Three rounded horizontal teal bars inside a soft teal halo.</desc>
  <defs>
    <radialGradient id="halo-core" cx="50%" cy="48%" r="50%">
      <stop offset="0" stop-color="#2BB6A3" stop-opacity="0.20"/>
      <stop offset="0.42" stop-color="#E6FBF4" stop-opacity="0.92"/>
      <stop offset="0.72" stop-color="#2BB6A3" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#2BB6A3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo-ring" cx="50%" cy="50%" r="50%">
      <stop offset="0.48" stop-color="#2BB6A3" stop-opacity="0"/>
      <stop offset="0.70" stop-color="#2BB6A3" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#2BB6A3" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="120" cy="120" rx="92" ry="88" fill="url(#halo-core)"/>
  <ellipse cx="120" cy="120" rx="108" ry="102" fill="url(#halo-ring)"/>
  <g fill="#2BB6A3">
